informatie = "informatie"
als = "als"
mis = "mis"
juni = "juni"
juli = "juli"
oktober = "oktober"

# ISO 20022 element names and truncated SQL keywords asserted on literally.
OTHR = "OTHR"
Othr = "Othr"
BCK = "BCK"
bck = "bck"
Bse = "Bse"
FND = "FND"
INSER = "INSER"
UPDAT = "UPDAT"
