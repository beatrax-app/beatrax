[default]
# Hotkey mockup notation like [e]rror, [s]earch in keyboard-shortcut examples,
# and SQL verbs written with a capitalised keyword plus an English suffix —
# the tokeniser splits "JOINed" into "JOI" + "Ned" and flags the tail.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+", "JOINed"]

[default.extend-words]
beatrax = "beatrax"
Beatrax = "Beatrax"
# A Dutch hosting company that appears as a counterparty in sync fixtures.
Versio = "Versio"
versio = "versio"
# Apple's own App Store Connect rejection codes, quoted verbatim
# (ITMS-91053, ITMS-91056) in the privacy-manifest tests.
ITMS = "ITMS"
# Dutch statement vocabulary that appears verbatim in parser examples.
Betaalautomaat = "Betaalautomaat"
Geldautomaat = "Geldautomaat"
Bankstorting = "Bankstorting"
Incasso = "Incasso"
Contant = "Contant"
Overboeking = "Overboeking"
Saldo = "Saldo"
aangifte = "aangifte"
Afschriftnummer = "Afschriftnummer"
Volgnummer = "Volgnummer"
Omschrijving = "Omschrijving"
Categorie = "Categorie"
# Institution names as they are actually spelled.
# Split on the capital, so the exception is the part the dictionary rejects.
Regio = "Regio"
# Library and protocol names the dictionary does not carry.
Livewire = "Livewire"
NativePHP = "NativePHP"
Larastan = "Larastan"
Volt = "Volt"
Flux = "Flux"
genkgo = "genkgo"
nwidart = "nwidart"
Argon2id = "Argon2id"
XChaCha20 = "XChaCha20"
BLAKE2b = "BLAKE2b"
mDNS = "mDNS"
iDEAL = "iDEAL"
YNAB = "YNAB"
nYNAB = "nYNAB"

# Dutch statement and demo-data vocabulary that appears verbatim in adapters,
# seeders, and assertions — these are the strings the parsers actually match.
Mobiel = "Mobiel"
Salaris = "Salaris"
Pensioen = "Pensioen"
Periode = "Periode"
Stichting = "Stichting"
STICHTING = "STICHTING"
Supermarkt = "Supermarkt"
SUPERMARKT = "SUPERMARKT"
Supermarkten = "Supermarkten"
Adres = "Adres"
Provincie = "Provincie"
Thuis = "Thuis"
Aand = "Aand"
informatie = "informatie"
als = "als"
mis = "mis"
juni = "juni"
juli = "juli"
oktober = "oktober"

# ISO 20022 element names and truncated SQL keywords asserted on literally.
OTHR = "OTHR"
Othr = "Othr"
BCK = "BCK"
bck = "bck"
Bse = "Bse"
FND = "FND"
INSER = "INSER"
UPDAT = "UPDAT"
DELET = "DELET"
SELEC = "SELEC"
# SchmeNm (Scheme Name) splits on the capital, leaving the half the
# dictionary rejects; UNIQUEs splits into UNIQU + Es.
Schme = "Schme"
UNIQU = "UNIQU"

# Words the dictionary lacks that are correct in this codebase.
unparseable = "unparseable"
Unparseable = "Unparseable"
invokable = "invokable"
appliable = "appliable"
encrypter = "encrypter"
COSE = "COSE"
# The PDF stream filter is spelled FlateDecode, after the zlib "deflate"
# it wraps — the reader's own comment names the encoding it rebuilds.
Flate = "Flate"

# Misspelled upstream. bacon/qr-code names the constant
# DEFAULT_BYTE_MODE_ECODING, and the reference has to match the library
# rather than the dictionary.
ECODING = "ECODING"

# Test-local identifiers and abbreviations asserted on literally.
nwe = "nwe"
NWE = "NWE"
USERA = "USERA"
usera = "usera"
ND = "ND"
SMAL = "SMAL"
# Synthetic IBAN prefixes, built so each test's accounts are its own:
# 'NL00SER…' and 'NL00FRAM…' split on the digits.
SER = "SER"
FRAM = "FRAM"
# A cursor-test series id, 'thr-a'.
thr = "thr"
Caf = "Caf"

# Words from the shipped locales, quoted verbatim by tests that assert on
# rendered translated copy. The lang trees themselves are excluded below for
# the same reason; a test naming the string it renders sits outside them.
iz = "iz"          # hr/sr/sl: "from"
Iz = "Iz"
sur = "sur"        # fr: "on", as in "1 sur 3"
cours = "cours"    # fr: "cours" in en cours
collegate = "collegate"    # it: "connected", feminine plural
duplicat = "duplicat"      # ro: "duplicate"
importerad = "importerad"  # sv: "imported"
Leeg = "Leeg"                    # nl: "empty", in a goal name
Deterministisch = "Deterministisch"  # nl: "deterministic"
Extracto = "Extracto"            # es: "statement"
klick = "klick"                  # de/sv: "click", in the touch-copy guard

[files]
# Vendored, generated, and fixture trees are not ours to spell-check. Bank
# statement fixtures and the merchant corpus carry real-world strings in a
# dozen languages, deliberately unedited — correcting them would break the
# parsers they exist to exercise.
extend-exclude = [
  "vendor/",
  "node_modules/",
  "mobile-app/",
  "storage/",
  "public/build/",
  "nativephp/",
  "composer.lock",
  "package-lock.json",
  "*.min.js",
  "*.min.css",
  "**/tests/fixtures/",
  "resources/corpus/",
  # Translated UI copy is legitimately not English; the English-only typo
  # checker flags "Adresse" as "Address" and "Alle" as "All". Every locale
  # tree except `en` is excluded — `en` is the source language and the one
  # place a typo here is really a typo.
  #
  # `**/lang/<locale>/` rather than `**/Resources/lang/<locale>/` so it covers
  # both the modules' own trees and the framework's messages at the repo root.
  # Those are Laravel's translations, and Slovak "sme", Serbian "simbol" and
  # "autor" are words, not mistakes.
  "**/lang/bg/",
  "**/lang/cs/",
  "**/lang/da/",
  "**/lang/de/",
  "**/lang/el/",
  "**/lang/es/",
  "**/lang/et/",
  "**/lang/fi/",
  "**/lang/fr/",
  "**/lang/hr/",
  "**/lang/hu/",
  "**/lang/it/",
  "**/lang/lt/",
  "**/lang/lv/",
  "**/lang/nb/",
  "**/lang/nl/",
  "**/lang/pl/",
  "**/lang/pt/",
  "**/lang/ro/",
  "**/lang/sk/",
  "**/lang/sl/",
  "**/lang/sr/",
  "**/lang/sv/",
  "**/lang/tr/",
  "**/lang/uk/",
  "database/seeders/data/",
  "scripts/anonymize_*.php",
  "scripts/synthesise_*.php",
]
