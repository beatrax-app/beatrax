# Local PHP 8.5 toolchain for running the CI gates without installing PHP
# on the host. The app itself ships via NativePHP — this is
# dev-only tooling (see docker/php8.5/Dockerfile).
#
# Usage:
#   docker compose build
#   docker compose run --rm php composer install
#   docker compose run --rm php composer test          # Pest (parallel)
#   docker compose run --rm php vendor/bin/pint --test  # formatting gate
#   docker compose run --rm php vendor/bin/phpstan analyse -c phpstan-docker.neon --memory-limit=1G  # Larastan level 10 (memory-safe local Docker config)
#   docker compose run --rm php vendor/bin/pest Modules/Desktop
#
# The repo is bind-mounted, so edits on the host are picked up immediately
# and `vendor/` written inside the container lands back on the host.
services:
  php:
    build:
      context: .
      dockerfile: docker/php8.5/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - /Users/wessel/Development/nightworksio/beatrax/vendor:/app/vendor:ro
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
      # The Pest/PHPUnit suite runs against the dedicated, isolated
      # `sqlite_testing` connection (in-memory, no WAL). It must be named
      # explicitly: pointing the production-shaped `sqlite` connection (WAL +
      # busy_timeout) at :memory: breaks RefreshDatabase isolation across the
      # full serial suite. phpunit.xml also sets this, but a real env var
      # wins over phpunit's <env> in the `artisan test` flow, so the
      # authoritative value lives here. Override on the command line for a
      # file-backed DB.
      DB_CONNECTION: sqlite_testing
    tty: true

volumes:
  composer-cache:
