; Loaded via PHP_INI_SCAN_DIR from composer's coverage script, AFTER
; tools/test-php-ini, so these override the pcov.enabled=0 that makes an
; ordinary `composer test` fast. A scan directory rather than -d flags for the
; reason 00-test-performance.ini gives: -d reaches the parent php only, and the
; workers are where coverage is actually collected. --passthru-php cannot carry
; the exclude pattern either — paratest re-invokes through sh, and the regex
; below contains parentheses and a pipe.
pcov.enabled=1

; pcov instruments ONE directory tree and, left to detect it, picks `app/` —
; 22 files beside the ~7,000 that hold the product. A local run then reported 5
; covered statements against 202,690, none of them under Modules/: a 0.0% that
; reads as "nothing is tested" rather than as "nothing was measured".
; `.` is the repository root because composer runs its scripts from there.
pcov.directory=.

; Without this pcov instruments vendor/ as well, which costs time and measures
; code no report is about.
; Quoted: php.ini reads an unquoted ~, | or () as bitwise operators, so the
; bare pattern evaluates to -1 and excludes nothing.
pcov.exclude="~(vendor|node_modules)~"
