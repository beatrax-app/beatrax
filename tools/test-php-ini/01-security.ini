; Loaded via PHP_INI_SCAN_DIR from composer's test scripts, alongside
; 00-test-performance.ini. Separate file because these are correctness
; directives, not speed ones, and a future performance rewrite must not take
; them with it.

; Off by default, and then getTraceAsString() renders the first 15 characters
; of every string argument -- on a parse frame, a row of the reader's bank
; statement. SafeTrace assembles its own frames and does not depend on this;
; the directive is here so nothing ELSE that renders a trace can leak one.
zend.exception_ignore_args=1
