; Loaded via PHP_INI_SCAN_DIR from composer's test scripts, which is the only
; way these reach the paratest WORKER processes: -d flags apply to the parent
; php only, and the workers are where the suite actually spends its time.

; The suite loads several thousand class files per worker and each worker is
; long-lived, so compiling them once instead of on every include is the single
; largest saving available here.
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=30000

; Nothing rewrites source mid-run, so skip the stat() per included file.
opcache.validate_timestamps=0

; JIT costs warm-up time it never earns back on a short-lived test worker,
; and it is off in production for this app too.
opcache.jit=disable
opcache.jit_buffer_size=0

; pcov instruments every executed line whenever it is enabled, coverage
; requested or not — and `composer test` never requests it. The coverage
; script re-enables it explicitly.
pcov.enabled=0
