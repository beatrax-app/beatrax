# Built-in merchant heuristics — twelve dominant Dutch consumer brands
# the import preview's auto-suggest chip falls back to before the user
# accumulates their own renames or the community corpus catches a row.
#
# These rows are tagged `contributor: built-in` so the suggest-mapping
# modal's provenance line can distinguish bundled corpus entries from
# heuristic seed rows, and so a future contributor view can filter out
# the heuristic baseline when counting per-contributor totals.
#
# Schema is identical to merchant-mappings.yaml; see that file for the
# documented fields.
