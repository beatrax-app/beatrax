# Tax deduction categories — Malta
# Mirrors the deductions an individual claims on the MT Income Tax Return.
#
# Authority: Income Tax Act (Cap. 123), consolidated text of 10/03/2026 —
# art. 14(1) general deduction and the itemised deductions of art. 14A–14G,
# plus the art. 57 personal retirement scheme credit; Voluntary Occupational
# Pension Scheme credit per Commissioner for Tax and Customs guidance.
# Years of assessment 2025–2026.
#
# Malta's return is in English, so names use the Act's own English wording.
#
# Note: school transport fees (art. 14H) were repealed by Act XIII of 2024
# from year of assessment 2025 and are deliberately absent. Malta grants no
# general charitable-donation or trade-union-subscription deduction to
# individuals, so those are absent too.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "mt_outgoings_and_expenses"
    name: "Outgoings and expenses"
    short_name: "Business"
    hint: "Expenses wholly and exclusively incurred in producing the income"
  - key: "mt_alimony_payments"
    name: "Alimony payments"
    short_name: "Alimony"
    hint: "Alimony to an estranged spouse; child maintenance does not qualify"
  - key: "mt_school_fees"
    name: "School fees"
    short_name: "School Fees"
    hint: "Fees for a registered private kindergarten or independent school"
  - key: "mt_facilitator_fees"
    name: "Facilitator fees for children with special needs"
    short_name: "Facilitator"
    hint: "Fees paid to the school for a facilitator for a child in need"
  - key: "mt_childcare_fees"
    name: "Child care fees"
    short_name: "Childcare"
    hint: "Fees to a bona fide childcare centre for children under twelve"
  - key: "mt_homes_for_the_elderly"
    name: "Fees in respect of homes for the elderly and the disabled"
    short_name: "Elderly Home"
    hint: "Private home for the elderly or disabled, or a respite centre"
  - key: "mt_sports_fees"
    name: "Sports fees"
    short_name: "Sports Fees"
    hint: "Sports activities for children under sixteen, through SportMalta"
  - key: "mt_cultural_activity_fees"
    name: "Fees for cultural activities"
    short_name: "Culture Fees"
    hint: "Accredited creative or cultural courses for children under sixteen"
  - key: "mt_tertiary_study_fees"
    name: "Fees for tertiary studies"
    short_name: "Tertiary"
    hint: "Your own fees at a recognised tertiary education institution"
  - key: "mt_personal_retirement_scheme"
    name: "Personal retirement scheme contributions"
    short_name: "Pension PRS"
    hint: "Contributions to a qualifying personal retirement scheme or policy"
  - key: "mt_voluntary_occupational_pension"
    name: "Voluntary Occupational Pension Scheme contributions"
    short_name: "VOPS"
    hint: "Voluntary employee contributions to an occupational pension scheme"
