# Tax deduction categories — Netherlands
# Mirrors NL income tax return (aangifte inkomstenbelasting) Box 1 deduction items.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "nl_zorgkosten"
    name: "Zorgkosten"
    short_name: "Zorgkosten"
    hint: "Ziektekosten boven drempel (eigen risico, hulpmiddelen, etc.)"
  - key: "nl_giften"
    name: "Giften"
    short_name: "Giften"
    hint: "Periodieke en eenmalige giften aan ANBI-instellingen"
  - key: "nl_eigen_woning"
    name: "Eigen woning"
    short_name: "Eigen woning"
    hint: "Hypotheekrente, erfpacht, opstalrecht"
  - key: "nl_partneralimentatie"
    name: "Partneralimentatie"
    short_name: "Alimentatie"
    hint: "Betaalde alimentatie aan ex-partner"
  - key: "nl_lijfrente"
    name: "Lijfrente / pensioen"
    short_name: "Lijfrente"
    hint: "Premies lijfrenteverzekering of lijfrenterekening"
  - key: "nl_ondernemerskosten"
    name: "Ondernemerskosten (ZZP)"
    short_name: "ZZP-kosten"
    hint: "Zakelijke kosten voor zelfstandigen"
