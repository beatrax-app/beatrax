# Tax deduction categories — Germany
# Mirrors DE Einkommensteuererklärung deduction items.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "de_aussergewoehnliche_belastungen"
    name: "Außergewöhnliche Belastungen"
    short_name: "Außergew."
    hint: "Krankheits-, Pflege- und behinderungsbedingte Kosten"
    i18n:
      en:
        name: "Extraordinary expenses"
        short_name: "Extraordinary"
        hint: "Costs of illness, care and disability"
      nl:
        name: "Buitengewone lasten"
        short_name: "Buitengewoon"
        hint: "Kosten door ziekte, zorg en arbeidsongeschiktheid"
  - key: "de_sonderausgaben"
