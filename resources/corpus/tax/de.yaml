    i18n:
      en:
        name: "Work-related expenses"
        short_name: "Work expenses"
        hint: "Arbeitnehmer-Pauschbetrag, commuting costs and work equipment"
      nl:
        name: "Beroepskosten"
        short_name: "Beroepskosten"
        hint: "Arbeitnehmer-Pauschbetrag, woon-werkverkeer en werkmiddelen"
  - key: "de_spenden"
