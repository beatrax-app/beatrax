# Tax deduction categories — Germany
# Mirrors DE Einkommensteuererklärung deduction items.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "de_aussergewoehnliche_belastungen"
    name: "Außergewöhnliche Belastungen"
    short_name: "Außergewöhnl."
    hint: "Krankheits-, Pflege- und behinderungsbedingte Kosten"
  - key: "de_sonderausgaben"
    name: "Sonderausgaben"
    short_name: "Sonderausgaben"
    hint: "Kirchensteuer, Spenden, Schulgeld, Berufsausbildungskosten"
  - key: "de_werbungskosten"
    name: "Werbungskosten"
    short_name: "Werbungskosten"
    hint: "Arbeitnehmer-Pauschbetrag, Fahrtkosten, Arbeitsmittel"
  - key: "de_spenden"
    name: "Spenden und Mitgliedsbeiträge"
    short_name: "Spenden"
    hint: "Zuwendungen an gemeinnützige Organisationen"
  - key: "de_handwerkerleistungen"
    name: "Handwerkerleistungen"
    short_name: "Handwerker"
    hint: "Steuerermäßigung für haushaltsnahe Dienstleistungen"
  - key: "de_vorsorgeaufwendungen"
    name: "Vorsorgeaufwendungen"
    short_name: "Vorsorge"
    hint: "Kranken-, Pflege- und Rentenversicherungsbeiträge"
