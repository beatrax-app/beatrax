    short_name: "Sonderausg."
    hint: "Kirchensteuer, Spenden, Schulgeld, Berufsausbildungskosten"
    i18n:
      en:
        name: "Special expenses"
        short_name: "Special exp."
        hint: "Church tax, donations, school fees and vocational training costs"
      nl:
        name: "Bijzondere uitgaven"
        short_name: "Bijzondere uitg."
        hint: "Kerkbelasting, giften, schoolgeld en kosten van een beroepsopleiding"
  - key: "de_werbungskosten"
