# Tax deduction categories — Greece
# Mirrors the spend-driven items of the GR δήλωση φορολογίας εισοδήματος
# φυσικών προσώπων (Έντυπο Ε1).
#
# Authority: Κώδικας Φορολογίας Εισοδήματος (ν. 4172/2013), codified text as
# in force in 2026 — άρθρα 15 (παρ. 6 και 7), 19, 22 και 39Β. AADE administers
# the return. Tax year 2025 (δήλωση 2026).
#
# Greece has few classic deductible expenses: most relief is a μείωση φόρου or
# a coverage threshold rather than a deduction from income. Άρθρο 18
# (μειώσεις φόρου για ιατρικές δαπάνες) is repealed, and there is no relief for
# ασφάλιστρα ζωής or τόκοι στεγαστικών δανείων, so none appear below.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "gr_ilektronikes_dapanes"
    name: "Δαπάνες με ηλεκτρονικά μέσα πληρωμής"
    short_name: "Ηλεκτρ.δαπ."
    hint: "Δαπάνες που καλύπτουν το απαιτούμενο ποσοστό του εισοδήματος"
    i18n:
      en:
        name: "Spending by electronic payment"
        short_name: "E-payments"
        hint: "Spending that covers the required percentage of your income"
      nl:
        name: "Uitgaven met elektronische betaalmiddelen"
        short_name: "E-betalingen"
        hint: "Uitgaven die het vereiste percentage van het inkomen dekken"
  - key: "gr_dapanes_lipsis_ypiresion"
    name: "Δαπάνες λήψης υπηρεσιών"
    short_name: "Υπηρεσίες"
    hint: "Αφαίρεση 30% για ορισμένες υπηρεσίες που πληρώνονται ηλεκτρονικά"
    i18n:
      en:
        name: "Spending on services"
        short_name: "Services"
        hint: "30% deduction for certain services paid for electronically"
      nl:
        name: "Uitgaven aan diensten"
        short_name: "Diensten"
        hint: "30% aftrek voor bepaalde elektronisch betaalde diensten"
  - key: "gr_dorees"
    name: "Δωρεές σε αναγνωρισμένους φορείς"
    short_name: "Δωρεές"
    hint: "Μείωση φόρου για δωρεές άνω των 100 ευρώ σε αναγνωρισμένους φορείς"
    i18n:
      en:
        name: "Donations to recognised bodies"
        short_name: "Donations"
        hint: "Tax reduction for donations over 100 euro to recognised bodies"
      nl:
        name: "Giften aan erkende instellingen"
        short_name: "Giften"
        hint: "Belastingvermindering voor giften van meer dan 100 euro aan erkende instellingen"
  - key: "gr_dorees_koinofelon"
    name: "Δωρεές σε κοινωφελή ιδρύματα και Οργανώσεις Κοινωνίας Πολιτών"
    short_name: "Κοινωφελή"
    hint: "Δωρεές σε ειδικό τραπεζικό λογαριασμό του φορέα, με αυξημένο ποσοστό"
    i18n:
      en:
        name: "Donations to public-benefit foundations and civil society organisations"
        short_name: "Public benefit"
        hint: "Donations into the body's dedicated bank account, at an increased rate"
      nl:
        name: "Giften aan instellingen van algemeen nut en maatschappelijke organisaties"
        short_name: "Algemeen nut"
        hint: "Giften op de speciale bankrekening van de instelling, met een hoger percentage"
  - key: "gr_dorees_politika_kommata"
    name: "Δωρεές σε πολιτικά κόμματα"
    short_name: "Κόμματα"
    hint: "Δωρεές σε κόμματα, συνασπισμούς και υποψήφιους αντιπροσώπους"
    i18n:
      en:
        name: "Donations to political parties"
        short_name: "Parties"
        hint: "Donations to parties, coalitions and candidate representatives"
      nl:
        name: "Giften aan politieke partijen"
        short_name: "Partijen"
        hint: "Giften aan partijen, coalities en kandidaat-volksvertegenwoordigers"
  - key: "gr_anavathmisi_ktirion"
    name: "Ενεργειακή, λειτουργική και αισθητική αναβάθμιση κτιρίων"
    short_name: "Αναβ.κτιρίων"
    hint: "Μείωση φόρου κατανεμημένη σε πέντε έτη, με ηλεκτρονική πληρωμή"
    i18n:
      en:
        name: "Energy, functional and aesthetic upgrading of buildings"
        short_name: "Building upgrade"
        hint: "Tax reduction spread over five years, paid electronically"
      nl:
        name: "Energetische, functionele en esthetische verbetering van gebouwen"
        short_name: "Gebouwverbetering"
        hint: "Belastingvermindering verdeeld over vijf jaar, met elektronische betaling"
  - key: "gr_asfalistikes_eisfores"
    name: "Ασφαλιστικές εισφορές"
    short_name: "Εισφορές"
    hint: "Υποχρεωτικές εισφορές που μειώνουν το φορολογητέο εισόδημα"
    i18n:
      en:
        name: "Social insurance contributions"
        short_name: "Contributions"
        hint: "Compulsory contributions that reduce your taxable income"
      nl:
        name: "Sociale premies"
        short_name: "Premies"
        hint: "Verplichte premies die het belastbaar inkomen verlagen"
  - key: "gr_epicheirimatikes_dapanes"
    name: "Εκπιπτόμενες επιχειρηματικές δαπάνες"
    short_name: "Επαγγ.δαπάν"
    hint: "Δαπάνες ατομικής επιχείρησης ή ελεύθερου επαγγελματία"
    i18n:
      en:
        name: "Deductible business expenses"
        short_name: "Business exp."
        hint: "Costs of a sole trader or self-employed professional"
      nl:
        name: "Aftrekbare ondernemerskosten"
        short_name: "Ondernemerskosten"
        hint: "Kosten van een eenmanszaak of zelfstandig beroepsbeoefenaar"
