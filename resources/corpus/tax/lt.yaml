# Tax deduction categories — Lithuania
# Mirrors the lengvatos of the LT metinė pajamų mokesčio deklaracija (GPM311),
# priedas GPM311G "Išlaidos, mažinančios pajamas".
# Source: Valstybinė mokesčių inspekcija (vmi.lt), 2025 m. mokestiniai metai.
# Lithuania's set is genuinely small: the 2019–2023 temporary reliefs for building
# repair, car repair and childcare all expired and are not claimable.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "lt_npd"
    name: "Metinis neapmokestinamasis pajamų dydis (NPD)"
    short_name: "NPD"
    hint: "Neapmokestinama metinių su darbo santykiais susijusių pajamų dalis"
    i18n:
      en:
        name: "Annual tax-exempt amount (NPD)"
        short_name: "NPD"
        hint: "The tax-exempt share of annual employment-related income"
      nl:
        name: "Jaarlijks belastingvrij bedrag (NPD)"
        short_name: "NPD"
        hint: "Het belastingvrije deel van het jaarlijkse inkomen uit dienstbetrekking"
  - key: "lt_npd_negalia"
    name: "Padidintas NPD asmenims, kuriems nustatytas dalyvumo lygis"
    short_name: "NPD negalia"
