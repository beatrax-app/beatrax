# Tax deduction categories — Lithuania
# Mirrors the lengvatos of the LT metinė pajamų mokesčio deklaracija (GPM311),
# priedas GPM311G "Išlaidos, mažinančios pajamas".
# Source: Valstybinė mokesčių inspekcija (vmi.lt), 2025 m. mokestiniai metai.
# Lithuania's set is genuinely small: the 2019–2023 temporary reliefs for building
# repair, car repair and childcare all expired and are not claimable.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
