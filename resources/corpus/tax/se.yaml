# Tax deduction categories — Sweden
# Mirrors the avdrag and skattereduktioner sections of the SE Inkomstdeklaration 1 (INK1).
# Source: Skatteverket (skatteverket.se), Hjälp för Inkomstdeklarationen 2026 — inkomstår 2025.
# Grundavdrag is omitted — Skatteverket grants it automatically with no claim.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "se_reseavdrag"
    name: "Resor till och från arbetet"
    short_name: "Resor jobb"
    hint: "Utgifter för resor mellan bostaden och arbetsplatsen"
  - key: "se_tjansteresor"
    name: "Tjänsteresor"
    short_name: "Tjänsteresor"
    hint: "Utgifter du har haft i samband med tjänsteresor i arbetet"
  - key: "se_tillfalligt_arbete"
    name: "Tillfälligt arbete på annan ort"
    short_name: "Tillf.arbete"
    hint: "Ökade levnadskostnader när du övernattar på arbetsorten och har kvar din bostad"
  - key: "se_dubbel_bosattning"
    name: "Dubbel bosättning"
    short_name: "Dubbel bos."
    hint: "Ökade levnadskostnader när du flyttat för arbete och behållit den tidigare bostaden"
  - key: "se_hemresor"
    name: "Hemresor"
    short_name: "Hemresor"
    hint: "Resor hem när du arbetar och bor på annan ort"
  - key: "se_ovriga_utgifter"
    name: "Övriga utgifter för ditt arbete"
    short_name: "Övriga utg."
    hint: "Nödvändiga utgifter i arbetet till den del de överstiger en fast bottengräns"
  - key: "se_arbetsrum"
    name: "Arbetsrum"
    short_name: "Arbetsrum"
    hint: "Arbetsrum i bostaden om rummet har egen ingång och används enbart för arbete"
  - key: "se_arbetsredskap"
    name: "Arbetsredskap"
    short_name: "Arbetsredsk."
    hint: "Dator, verktyg och annan utrustning som är nödvändig för dina arbetsuppgifter"
  - key: "se_pensionssparande"
    name: "Pensionssparande"
    short_name: "Pensionsspar"
    hint: "Allmänt avdrag för eget pensionssparande om du saknar pensionsrätt i anställning"
  - key: "se_periodiskt_understod"
    name: "Periodiskt understöd"
    short_name: "Understöd"
    hint: "Periodiskt understöd du är skyldig att betala och som mottagaren beskattas för"
  - key: "se_rotavdrag"
    name: "Rotavdrag"
    short_name: "Rotavdrag"
    hint: "Skattereduktion för arbetskostnad vid reparation, om- och tillbyggnad av bostaden"
  - key: "se_rutavdrag"
    name: "Rutavdrag"
    short_name: "Rutavdrag"
    hint: "Skattereduktion för hushållsnära tjänster som städning, tvätt och trädgårdsarbete"
  - key: "se_gron_teknik"
    name: "Skattereduktion för grön teknik"
    short_name: "Grön teknik"
    hint: "Installation av solceller, ellagring och laddningspunkt till elfordon"
  - key: "se_gava"
    name: "Gåva till godkänd gåvomottagare"
    short_name: "Gåva"
    hint: "Skattereduktion för penninggåvor till en av Skatteverket godkänd gåvomottagare"
  - key: "se_ranteutgifter"
    name: "Ränteutgifter"
    short_name: "Räntor"
    hint: "Räntor på lån, både lån med säkerhet och lån utan säkerhet"
  - key: "se_kapitalforlust"
    name: "Kapitalförlust vid försäljning"
    short_name: "Kapitalförl."
    hint: "Förlust vid försäljning av värdepapper, fondandelar eller bostad"
  - key: "se_forbattringsutgifter"
    name: "Förbättringsutgifter på bostad"
    short_name: "Förbättring"
    hint: "Vid bostadsförsäljning: ny-, till- och ombyggnad samt förbättrande reparationer"
  - key: "se_a_kassa"
    name: "Avgift till arbetslöshetskassa"
    short_name: "A-kassa"
    hint: "Skattereduktion för medlemsavgift till arbetslöshetskassa"
