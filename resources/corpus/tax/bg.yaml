# Tax deduction categories — Bulgaria
# Mirrors the данъчни облекчения claimed on the годишна данъчна декларация
# по чл. 50 от ЗДДФЛ.
# Source: Национална агенция за приходите (nra.bg), "Данъчни облекчения", 2025/2026.
# Bulgaria runs a flat-tax regime: this list of nine reliefs is the complete set,
# not a trimmed one.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "bg_namalena_rabotosposobnost"
    name: "Данъчно облекчение за лица с намалена работоспособност"
    short_name: "Работоспос."
    hint: "Облекчение за лица с намалена работоспособност по решение на ТЕЛК или НЕЛК"
  - key: "bg_dobrovolno_osiguryavane"
    name: "Данъчно облекчение за лични вноски за доброволно осигуряване и застраховане"
    short_name: "Осигуряване"
    hint: "Лични вноски за доброволно пенсионно осигуряване и застраховки живот"
  - key: "bg_osiguritelen_stazh"
    name: "Данъчно облекчение за лични вноски за осигурителен стаж при пенсиониране"
    short_name: "Стаж"
    hint: "Лични вноски, внесени за закупуване на осигурителен стаж при пенсиониране"
  - key: "bg_dareniya"
    name: "Данъчно облекчение за дарения"
    short_name: "Дарения"
    hint: "Дарения в полза на здравни, образователни, културни и благотворителни организации"
  - key: "bg_mladi_semeystva"
    name: "Данъчно облекчение за млади семейства"
    short_name: "Млади сем."
    hint: "Лихви по ипотечен кредит за закупуване на първо жилище"
  - key: "bg_deca"
    name: "Данъчно облекчение за деца"
    short_name: "Деца"
    hint: "Облекчение според броя на ненавършилите пълнолетие деца"
  - key: "bg_deca_s_uvrezhdaniya"
    name: "Данъчно облекчение за деца с увреждания"
    short_name: "Деца с увр."
    hint: "Облекчение за отглеждане на дете с определен вид и степен на увреждане"
  - key: "bg_bezkasovi_plashtaniya"
    name: "Данъчно облекчение за извършени безкасови плащания"
    short_name: "Безкасови"
    hint: "Облекчение при получаване и извършване на плащанията само по банков път"
  - key: "bg_remont_na_imot"
    name: "Данъчно облекчение за подобрения и ремонт на недвижим жилищен имот"
    short_name: "Ремонт"
    hint: "Разходи за труд по подобрения или ремонт на собствен жилищен недвижим имот"
