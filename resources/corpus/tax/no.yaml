# Tax deduction categories — Norway
# Mirrors the fradrag posts on the NO skattemelding.
# Source: Skatteetaten (skatteetaten.no), inntektsåret 2025 (skattemelding levert 2026).
# Personfradrag is omitted — it is a bunnfradrag granted automatically with no claim.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "no_minstefradrag"
    name: "Minstefradrag"
    short_name: "Minstefradr."
    hint: "Standardfradrag som trekkes automatisk fra lønn og pensjon"
    i18n:
      en:
        name: "Minstefradrag standard deduction"
        short_name: "Minstefradrag"
        hint: "Standard deduction taken automatically from salary and pension"
      nl:
        name: "Minstefradrag (standaardaftrek)"
        short_name: "Minstefradrag"
        hint: "Standaardaftrek die automatisch van loon en pensioen wordt afgetrokken"
  - key: "no_reisefradrag"
    name: "Reisefradrag"
    short_name: "Reisefradrag"
    hint: "Reise mellom hjem og fast arbeidssted, beregnet etter kilometersats"
    i18n:
      en:
        name: "Travel deduction"
        short_name: "Commuting"
        hint: "Travel between home and a fixed workplace, calculated at a kilometre rate"
      nl:
        name: "Reisaftrek woon-werkverkeer"
        short_name: "Woon-werkverkeer"
        hint: "Reizen tussen huis en vaste werkplek, berekend met een kilometertarief"
  - key: "no_pendler_kost"
    name: "Merkostnader til kost for pendlere"
    short_name: "Pendlerkost"
    hint: "Merkostnader til mat når du overnatter borte fra hjemmet på grunn av jobb"
    i18n:
      en:
        name: "Extra board costs for commuters"
        short_name: "Commuter food"
        hint: "Extra food costs when you stay away from home overnight because of work"
      nl:
        name: "Extra maaltijdkosten voor pendelaars"
        short_name: "Pendelkosten"
        hint: "Extra kosten voor eten als je vanwege je werk buitenshuis overnacht"
  - key: "no_pendler_losji"
    name: "Merkostnader til losji for pendlere"
    short_name: "Pendlerlosji"
    hint: "Husleie, strøm og internett i pendlerboligen"
    i18n:
      en:
        name: "Extra lodging costs for commuters"
        short_name: "Commuter lodging"
        hint: "Rent, electricity and internet in the commuter accommodation"
      nl:
        name: "Extra huisvestingskosten voor pendelaars"
        short_name: "Pendelverblijf"
        hint: "Huur, elektriciteit en internet in de pendelwoning"
  - key: "no_besoeksreiser"
    name: "Besøksreiser til hjemmet"
    short_name: "Besøksreiser"
    hint: "Reiser hjem til familien når du bor på arbeidsstedet som pendler"
    i18n:
      en:
        name: "Visits home"
        short_name: "Home visits"
        hint: "Trips home to the family when you live at the workplace as a commuter"
      nl:
        name: "Bezoekreizen naar huis"
        short_name: "Bezoekreizen"
        hint: "Reizen naar het gezin als je als pendelaar op de werkplek woont"
  - key: "no_fagforeningsfradrag"
    name: "Fagforeningsfradrag"
    short_name: "Fagforening"
    hint: "Betalt fagforeningskontingent til arbeidstakerorganisasjon"
    i18n:
      en:
        name: "Trade union deduction"
        short_name: "Union dues"
        hint: "Union membership dues paid to an employee organisation"
      nl:
        name: "Aftrek vakbondscontributie"
        short_name: "Vakbondscontributie"
        hint: "Betaalde vakbondscontributie aan een werknemersorganisatie"
  - key: "no_foreldrefradrag"
    name: "Foreldrefradrag"
    short_name: "Foreldrefrad"
    hint: "Dokumenterte utgifter til pass og stell av barn som er 11 år eller yngre"
    i18n:
      en:
        name: "Parental deduction for childcare"
        short_name: "Childcare"
        hint: "Documented costs for the care and minding of children aged 11 or younger"
      nl:
        name: "Ouderaftrek voor kinderopvang"
        short_name: "Kinderopvangkosten"
        hint: "Aangetoonde kosten voor opvang en verzorging van kinderen van 11 jaar of jonger"
  - key: "no_gjeldsrenter"
    name: "Fradrag for gjeldsrenter"
    short_name: "Gjeldsrenter"
    hint: "Renter du har betalt på lån og annen gjeld"
    i18n:
      en:
        name: "Deduction for interest on debt"
        short_name: "Debt interest"
        hint: "Interest you have paid on loans and other debt"
      nl:
        name: "Aftrek van rente op leningen"
        short_name: "Rente op leningen"
        hint: "Rente die je hebt betaald op leningen en andere schulden"
  - key: "no_bsu"
    name: "Boligsparing for ungdom (BSU)"
    short_name: "BSU"
    hint: "Skattefradrag for sparing til første bolig for deg som er under 34 år"
    i18n:
      en:
        name: "Boligsparing for ungdom (BSU) first-home savings"
        short_name: "BSU"
        hint: "Tax deduction for saving towards a first home if you are under 34"
      nl:
        name: "Boligsparing for ungdom (BSU), sparen voor een eerste woning"
        short_name: "BSU"
        hint: "Belastingaftrek voor sparen voor een eerste woning als je jonger bent dan 34"
  - key: "no_ips"
    name: "Individuell sparing til pensjon (IPS)"
