    i18n:
      en:
        name: "Special deduction for large medical expenses"
        short_name: "Medical costs"
        hint: "Only if you received the special deduction in both 2010 and 2011 and still meet the conditions"
      nl:
        name: "Bijzondere aftrek voor hoge ziektekosten"
        short_name: "Zorgkosten"
        hint: "Alleen als je de bijzondere aftrek zowel in 2010 als in 2011 kreeg en nog aan de voorwaarden voldoet"
  - key: "no_doktorgrad"
    name: "Fradrag for kostnader til doktorgrad"
    short_name: "Doktorgrad"
    hint: "Utgifter til trykking, reise og doktorgradsmiddag i forbindelse med disputas"
    i18n:
      en:
        name: "Deduction for doctoral degree costs"
        short_name: "Doctorate"
        hint: "Costs of printing, travel and the doctoral dinner around the defence"
      nl:
        name: "Aftrek voor kosten van een promotie"
        short_name: "Promotiekosten"
        hint: "Kosten voor drukwerk, reizen en het promotiediner rond de verdediging"
