# Tax deduction categories — Italy
# Mirrors the IT dichiarazione dei redditi, Modello 730 Quadro E (Oneri e spese)
# and the equivalent Quadro RP of the Modello Redditi PF.
#
# Authority: Agenzia delle Entrate, „Modello 730/2026 — Istruzioni per la
# compilazione", capitolo 9 (Quadro E) e Appendice.
# Tax year 2025 (dichiarato nel 2026).
#
# Note: from anno d'imposta 2025 art. 16-ter TUIR caps total detrazioni for
# redditi over 75.000 EUR, and several righi are split by contract date.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "it_spese_sanitarie"
    name: "Spese sanitarie"
    short_name: "Salute"
    hint: "Spese mediche, farmaci e ticket oltre la franchigia"
