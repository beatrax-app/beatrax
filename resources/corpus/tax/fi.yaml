# Tax deduction categories — Finland
# Mirrors the vähennykset sections of the FI esitäytetty veroilmoitus.
# Source: Verohallinto (vero.fi), verovuosi 2025 (veroilmoitus 2026), 2026 changes noted.
# Automatically computed deductions (perusvähennys, työtulovähennys, tulonhankkimis-
# vähennys, eläketulovähennys, alijäämähyvitys) are omitted — nothing to tag.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "fi_kotitalousvahennys"
    name: "Kotitalousvähennys"
    short_name: "Kotitalous"
    hint: "Kotitalous-, hoiva- ja hoitotyö sekä asunnon kunnossapito- ja perusparannustyö"
  - key: "fi_matkakulut"
    name: "Matkakulut"
    short_name: "Matkakulut"
    hint: "Asunnon ja työpaikan väliset matkat halvimman kulkuneuvon mukaan"
  - key: "fi_tulonhankkimismenot"
    name: "Tulonhankkimismenot"
    short_name: "Tulonhankk."
    hint: "Tulon hankkimisesta aiheutuneet menot, kuten työvälineet ja ammattikirjallisuus"
  - key: "fi_tyohuonevahennys"
    name: "Työhuonevähennys"
    short_name: "Työhuone"
    hint: "Kotona työskentelystä aiheutuneet työtilakulut; ei enää palkkatulosta vuodesta 2026"
  - key: "fi_tyoasuntovahennys"
    name: "Työasuntovähennys"
    short_name: "Työasunto"
    hint: "Työn takia vuokrattu toinen asunto, kun varsinainen koti on toisella paikkakunnalla"
  - key: "fi_vuokratulojen_vahennykset"
    name: "Vuokratuloista tehtävät vähennykset"
    short_name: "Vuokratulot"
    hint: "Vuokraustoiminnasta aiheutuneet menot, kuten vastike, remontit ja kalustehankinnat"
  - key: "fi_paaomatulojen_vahennykset"
    name: "Pääomatuloista tehtävät vähennykset"
    short_name: "Pääomatulot"
    hint: "Pääomatulon hankkimisesta ja säilyttämisestä johtuneet menot"
  - key: "fi_veronmaksukyvyn_alentumisvahennys"
    name: "Veronmaksukyvyn alentumisvähennys"
    short_name: "Veronmaksuk."
    hint: "Harkinnanvarainen vähennys, kun veronmaksukyky on olennaisesti alentunut"
  - key: "fi_elatusvelvollisuusvahennys"
    name: "Elatusvelvollisuusvähennys"
    short_name: "Elatusvelv."
    hint: "Alaikäisestä lapsesta maksettu elatussopimukseen tai tuomioon perustuva elatusapu"
  - key: "fi_lahjoitusvahennys"
    name: "Lahjoitusvähennys"
    short_name: "Lahjoitus"
    hint: "Rahalahjoitus yliopistolle tai korkeakoululle tiedettä tai taidetta edistämään"
  - key: "fi_yel_myel_maksut"
    name: "YEL- ja MYEL-maksut"
    short_name: "YEL/MYEL"
    hint: "Yrittäjän tai maatalousyrittäjän pakolliset eläkevakuutusmaksut"
  - key: "fi_jasenmaksut"
    name: "Jäsenmaksut ja työttömyyskassamaksut"
    short_name: "Jäsenmaksut"
    hint: "Työmarkkinajärjestön jäsenmaksut ja työttömyyskassan maksut"
  - key: "fi_velan_korot"
    name: "Velan korot"
    short_name: "Velan korot"
    hint: "Tulonhankkimisvelan korot; asuntolainan korot eivät ole enää vähennyskelpoisia"
  - key: "fi_vapaaehtoinen_elakevakuutus"
    name: "Vapaaehtoisen eläkevakuutuksen ja PS-sopimuksen maksut"
    short_name: "Eläkevak."
    hint: "Vapaaehtoiseen eläkevakuutukseen tai pitkäaikaissäästämissopimukseen maksetut maksut"
  - key: "fi_pakolliset_elakemaksut"
    name: "Pakolliset eläke- ja työttömyysvakuutusmaksut"
    short_name: "Pak. eläke"
    hint: "Palkasta perityt työeläke- ja työttömyysvakuutusmaksut"
  - key: "fi_arvopaperien_hoitomenot"
    name: "Arvopapereiden hoito- ja säilyttämismenot"
    short_name: "Arvopaperit"
    hint: "Arvopapereiden ja arvo-osuuksien hoidosta ja säilyttämisestä aiheutuneet menot"
