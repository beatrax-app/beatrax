# Tax deduction categories — Belgium
# Mirrors BE personal income tax (personenbelasting / impôt des personnes physiques) deduction items.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "be_giften"
    name: "Giften aan erkende instellingen"
    short_name: "Giften"
    hint: "Giften aan erkende filantropische instellingen (min. €40)"
  - key: "be_eigen_woning"
    name: "Kosten eigen woning"
    short_name: "Eigen woning"
    hint: "Hypothecaire interesten en kapitaalaflossingen (woonbonus)"
  - key: "be_beroepskosten"
    name: "Werkelijke beroepskosten"
    short_name: "Beroepsk."
    hint: "Aantoonbare kosten gemaakt voor de uitoefening van beroep"
  - key: "be_pensioensparen"
    name: "Pensioensparen"
    short_name: "Pensioensp."
    hint: "Stortingen op pensioenspaarrekening of -fonds"
  - key: "be_levensverzekering"
    name: "Individuele levensverzekering"
    short_name: "Levensverz."
    hint: "Premies individuele levensverzekering (2e pijler)"
  - key: "be_kinderopvang"
    name: "Kinderopvang"
    short_name: "Kinderopvang"
    hint: "Kosten voor opvang van kinderen jonger dan 14 jaar"
