        short_name: "Education"
        hint: "Nurseries, schools, tuition fees, textbooks and vocational training"
      nl:
        name: "Onderwijs- en opleidingskosten"
        short_name: "Studiekosten"
        hint: "Kinderdagverblijven, scholen, collegegeld, studieboeken en beroepsopleiding"
  - key: "pt_encargos_imoveis"
    name: "Encargos com rendas de habitação ou juros"
    short_name: "Habitação"
    hint: "Rendas de habitação permanente ou juros de crédito à habitação"
    i18n:
      en:
        name: "Housing rent or mortgage interest"
        short_name: "Housing"
        hint: "Rent for a permanent home or interest on a home loan"
      nl:
        name: "Huur van de woning of hypotheekrente"
        short_name: "Woonlasten"
        hint: "Huur van de vaste woning of rente op een woningkrediet"
  - key: "pt_encargos_lares"
