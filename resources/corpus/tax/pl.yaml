# Tax deduction categories — Poland
# Mirrors the ulgi i odliczenia of the PL zeznanie PIT (PIT-37 / PIT-36 + PIT/O).
# Source: Krajowa Administracja Skarbowa / Ministerstwo Finansów (podatki.gov.pl),
# "Ulgi i odliczenia", rozliczenie PIT za 2025 r.
# Business-only reliefs (ulga B+R, na terminal, na robotyzację, na ekspansję) are
# omitted — they attach to działalność gospodarcza, not to a private individual.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "pl_ulga_na_dzieci"
    name: "Ulga na dziecko (ulga prorodzinna)"
    short_name: "Na dzieci"
    hint: "Odliczenie od podatku dla rodziców, opiekunów prawnych i rodzin zastępczych"
  - key: "pl_ulga_termomodernizacyjna"
    name: "Ulga termomodernizacyjna"
    short_name: "Termomod."
    hint: "Wydatki na przedsięwzięcie termomodernizacyjne we własnym budynku jednorodzinnym"
  - key: "pl_ulga_rehabilitacyjna"
    name: "Ulga rehabilitacyjna"
    short_name: "Rehabilit."
    hint: "Wydatki na cele rehabilitacyjne i ułatwienie wykonywania czynności życiowych"
  - key: "pl_ulga_na_internet"
    name: "Ulga na internet"
    short_name: "Internet"
    hint: "Wydatki na użytkowanie sieci Internet w dwóch kolejno po sobie następujących latach"
  - key: "pl_ulga_na_ikze"
    name: "Ulga na IKZE"
    short_name: "IKZE"
    hint: "Wpłaty na indywidualne konto zabezpieczenia emerytalnego"
  - key: "pl_ulga_na_zabytki"
    name: "Ulga na zabytki"
    short_name: "Zabytki"
    hint: "Wydatki na prace konserwatorskie i roboty budowlane w zabytku nieruchomym"
  - key: "pl_ulga_dla_mlodych"
    name: "Ulga dla młodych"
    short_name: "Dla młodych"
    hint: "Zwolnienie przychodów podatnika, który nie ukończył 26. roku życia"
  - key: "pl_ulga_na_powrot"
    name: "Ulga na powrót"
    short_name: "Na powrót"
    hint: "Zwolnienie dla osób, które przeniosły miejsce zamieszkania do Polski"
  - key: "pl_ulga_dla_rodzin_4plus"
    name: "Ulga dla rodzin 4+"
    short_name: "Rodzina 4+"
    hint: "Zwolnienie dla podatnika wychowującego co najmniej czworo dzieci"
  - key: "pl_ulga_dla_pracujacych_seniorow"
    name: "Ulga dla pracujących seniorów"
    short_name: "Seniorzy"
    hint: "Zwolnienie dla osoby w wieku emerytalnym, która nie pobiera emerytury i pracuje"
  - key: "pl_darowizna_pozytek_publiczny"
    name: "Darowizna na cele pożytku publicznego"
    short_name: "Darow. OPP"
    hint: "Darowizny na cele określone w ustawie o działalności pożytku publicznego"
  - key: "pl_darowizna_krwiodawstwo"
    name: "Darowizna na cele krwiodawstwa"
    short_name: "Krwiodawstwo"
    hint: "Odliczenie dla honorowych dawców krwi i osocza"
  - key: "pl_darowizna_kult_religijny"
    name: "Darowizna na cele kultu religijnego"
    short_name: "Kult relig."
    hint: "Darowizny na rzecz kościoła lub związku wyznaniowego"
  - key: "pl_darowizna_odbudowa_zabytkow"
    name: "Darowizna na odbudowę Pałacu Saskiego"
    short_name: "Pałac Saski"
    hint: "Darowizny na odbudowę Pałacu Saskiego, Pałacu Brühla i kamienic przy ul. Królewskiej"
  - key: "pl_darowizna_koscielna"
    name: "Darowizna na działalność charytatywno-opiekuńczą kościelnych osób prawnych"
    short_name: "Kościelna"
    hint: "Darowizny wynikające z odrębnych ustaw o stosunku państwa do kościołów"
  - key: "pl_skladki_spoleczne"
    name: "Składki na ubezpieczenie społeczne"
    short_name: "Składki ZUS"
    hint: "Zapłacone składki emerytalne, rentowe, chorobowe i wypadkowe"
  - key: "pl_skladki_zwiazki_zawodowe"
    name: "Składki na rzecz związków zawodowych"
    short_name: "Związki zaw."
    hint: "Składki członkowskie zapłacone na rzecz związków zawodowych"
  - key: "pl_1_5_proc_opp"
    name: "Przekazanie 1,5% podatku na rzecz OPP"
    short_name: "1,5% OPP"
    hint: "Wskazanie organizacji pożytku publicznego, której urząd przekaże część podatku"
