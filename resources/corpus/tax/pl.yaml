# Tax deduction categories — Poland
# Mirrors the ulgi i odliczenia of the PL zeznanie PIT (PIT-37 / PIT-36 + PIT/O).
# Source: Krajowa Administracja Skarbowa / Ministerstwo Finansów (podatki.gov.pl),
# "Ulgi i odliczenia", rozliczenie PIT za 2025 r.
# Business-only reliefs (ulga B+R, na terminal, na robotyzację, na ekspansję) are
# omitted — they attach to działalność gospodarcza, not to a private individual.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "pl_ulga_na_dzieci"
    name: "Ulga na dziecko (ulga prorodzinna)"
    short_name: "Na dzieci"
    hint: "Odliczenie od podatku dla rodziców, opiekunów prawnych i rodzin zastępczych"
    i18n:
      en:
        name: "Child relief (ulga prorodzinna)"
        short_name: "Child relief"
        hint: "Deduction from tax for parents, legal guardians and foster families"
      nl:
        name: "Kinderkorting (ulga prorodzinna)"
        short_name: "Kinderkorting"
        hint: "Aftrek van de belasting voor ouders, wettelijke voogden en pleeggezinnen"
