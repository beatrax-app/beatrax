# Tax deduction categories — Cyprus
# Mirrors ΜΕΡΟΣ 5 (Εκπτώσεις / Απαλλαγές) of the CY Δήλωση Εισοδήματος Ατόμου
# (form T.D.1 / Ε.Πρ.1), plus the deductible items named in the filing guide.
#
# Authority: Τμήμα Φορολογίας (Cyprus Tax Department), „Οδηγός Συμπλήρωσης
# Δήλωσης Εισοδήματος Ατόμου 2025" (published June 2026), and the Department's
# „Φορολογική Μεταρρύθμιση 2026" explanatory material for individuals.
# Tax year 2025, plus the new personal deductions that start in tax year 2026.
#
# Names are in Greek, the language of the Cypriot return.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "cy_syndromi_syntechnias"
    name: "Συνδρομή σε συντεχνία"
    short_name: "Συντεχνία"
    hint: "Συνδρομές σε συντεχνία, π.χ. ΠΑΣΥΔΥ, ΣΕΚ, ΠΕΟ"
  - key: "cy_epaggelmatiki_syndromi"
    name: "Επαγγελματική συνδρομή"
    short_name: "Επαγγ.συνδρ"
    hint: "Συνδρομή σε επαγγελματικό σώμα, αναγκαία για την κτήση εισοδήματος"
  - key: "cy_dorees"
    name: "Δωρεές σε εγκεκριμένους φιλανθρωπικούς σκοπούς"
    short_name: "Δωρεές"
