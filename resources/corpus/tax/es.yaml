      en:
        name: "Contributions to pension and social provision schemes"
        short_name: "Plan de pensiones"
        hint: "Contributions to a Plan de pensiones and other social provision schemes"
      nl:
        name: "Inleg in pensioenregelingen en sociale voorzieningen"
        short_name: "Plan de pensiones"
        hint: "Inleg in een Plan de pensiones en andere sociale voorzieningsregelingen"
