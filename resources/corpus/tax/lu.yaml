# Tax deduction categories — Luxembourg
# Mirrors the LU déclaration pour l'impôt sur le revenu (modèle 100) and the
# décompte annuel (modèle 163): frais d'obtention, dépenses spéciales
# (art. 109 LIR) and charges extraordinaires (art. 127 / 127bis LIR).
#
# Authority: Administration des contributions directes (ACD) — forms
# modèle 100 F and modèle 163 R F « Année 2025 », the ACD A-Z guidance pages
# and circulaire L.I.R. n° 105/2. Année d'imposition 2025 (déclarée en 2026).
#
# Names are in French throughout; the ACD also issues every form in German.
#
# Note: the abattement pour mobilité durable (art. 129d LIR, electric car and
# bicycle) was abolished from 2021 and is deliberately absent.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "lu_frais_de_deplacement"
    name: "Frais de déplacement (FD)"
    short_name: "Déplacement"
    hint: "Forfait kilométrique domicile-travail, selon unités d'éloignement"
  - key: "lu_cotisations_professionnelles"
    name: "Cotisations professionnelles et syndicales"
    short_name: "Syndicat"
    hint: "Cotisations aux chambres, ordres et syndicats professionnels"
  - key: "lu_perfectionnement_professionnel"
    name: "Dépenses de perfectionnement professionnel"
    short_name: "Formation"
    hint: "Formation continue actualisant les connaissances du métier exercé"
  - key: "lu_instruments_de_travail"
    name: "Dépenses pour instruments de travail"
    short_name: "Outils pro"
    hint: "Matériel, cabinet de travail et vêtements typiquement professionnels"
  - key: "lu_interets_habitation"
    name: "Intérêts débiteurs en rapport avec l'habitation personnelle"
    short_name: "Prêt immo"
    hint: "Intérêts du prêt finançant l'habitation occupée par le propriétaire"
  - key: "lu_interets_debiteurs"
    name: "Intérêts débiteurs sur crédit personnel"
    short_name: "Crédit perso"
    hint: "Intérêts d'un crédit personnel : voiture, meubles, consommation"
  - key: "lu_primes_assurance"
    name: "Primes d'assurance et cotisations"
    short_name: "Assurances"
    hint: "Primes vie, décès, accident, invalidité, maladie et responsabilité"
  - key: "lu_epargne_logement"
    name: "Cotisations d'épargne-logement"
    short_name: "Épargne-log."
    hint: "Versements à une caisse d'épargne-logement agréée"
  - key: "lu_prevoyance_vieillesse"
    name: "Cotisations de prévoyance-vieillesse"
    short_name: "Prévoyance"
    hint: "Versements sur un contrat de prévoyance-vieillesse, 3e pilier"
  - key: "lu_cotisations_sociales"
    name: "Cotisations sociales obligatoires"
    short_name: "Cotis. soc."
    hint: "Cotisations maladie et pension obligatoires, déductibles sans limite"
  - key: "lu_cotisations_personnelles"
    name: "Cotisations payées à titre personnel"
    short_name: "Assur. cont."
    hint: "Assurance continuée ou volontaire et achat de périodes"
  - key: "lu_rentes_conjoint_divorce"
    name: "Rentes payées au conjoint divorcé"
    short_name: "Pension alim"
    hint: "Rente alimentaire versée à l'ex-conjoint après divorce"
  - key: "lu_liberalites_et_dons"
    name: "Libéralités et dons"
    short_name: "Dons"
    hint: "Dons en espèces à des organismes reconnus d'utilité publique"
  - key: "lu_charges_extraordinaires"
    name: "Charges extraordinaires"
    short_name: "Maladie"
    hint: "Frais de maladie, invalidité, procès ou divorce restant à charge"
  - key: "lu_domesticite_aides_garde"
    name: "Frais de domesticité, d'aides et de soins et de garde d'enfant"
    short_name: "Garde/ménage"
    hint: "Femme de ménage, aides et soins et frais de garde d'enfant"
  - key: "lu_enfants_hors_menage"
    name: "Charges extraordinaires pour enfants hors du ménage"
    short_name: "Enfant ext."
    hint: "Frais d'entretien d'un enfant ne faisant pas partie du ménage"
