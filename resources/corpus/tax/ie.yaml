# Tax deduction categories — Ireland
# Mirrors the IE Income Tax Return (Form 11 for self-assessed, the PAYE Income
# Tax Return in myAccount) — personal tax credits, reliefs and exemptions.
#
# Authority: Revenue (Irish Tax and Customs), revenue.ie personal tax credits,
# reliefs and exemptions pages, plus the Revenue Budget 2026 Summary.
# Tax years 2025 (currently being filed) and 2026.
#
# Note: charitable donations are deliberately absent — in Ireland the approved
# body claims the relief on the grossed-up donation, not the donor. Trade union
# subscription relief and the Home Renovation Incentive are abolished.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#   i18n        map     required — the same three fields per shipped locale, so a
#                       reader outside this jurisdiction is not shown its language.
#                       `en` is the source and fallback locale and is required for
#                       every entry; a locale with no block here falls back to it.
#
entries:
  - key: "ie_health_expenses"
    name: "Health expenses"
    short_name: "Medical"
    hint: "Doctor, consultant, prescription and hospital costs"
    i18n:
      en:
