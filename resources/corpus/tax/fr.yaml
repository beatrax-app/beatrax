# Tax deduction categories — France
# Mirrors FR impôt sur le revenu (déclaration 2042) deduction items.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "fr_dons"
    name: "Dons aux associations"
    short_name: "Dons"
    hint: "Versements à des organismes d'intérêt général (réduction 66%)"
  - key: "fr_charges_deductibles"
    name: "Charges déductibles"
    short_name: "Charges déd."
    hint: "Pensions alimentaires versées, frais d'accueil de personnes âgées"
  - key: "fr_frais_professionnels"
    name: "Frais professionnels réels"
    short_name: "Frais prof."
    hint: "Frais de déplacement, repas, formation professionnelle"
  - key: "fr_epargne_retraite"
    name: "Épargne retraite (PER)"
    short_name: "Retraite PER"
    hint: "Versements sur un plan d'épargne retraite"
  - key: "fr_travaux_renovation"
    name: "Travaux de rénovation énergétique"
    short_name: "MaPrimeRénov"
    hint: "Dépenses éligibles à MaPrimeRénov' ou crédit d'impôt"
  - key: "fr_emploi_domicile"
    name: "Emploi à domicile"
    short_name: "Emploi dom."
    hint: "Crédit d'impôt pour emploi d'un salarié à domicile"
