# Tax deduction categories — Austria
# Mirrors AT Arbeitnehmerveranlagung / Einkommensteuererklärung deduction items
# (Werbungskosten, Sonderausgaben, außergewöhnliche Belastungen).
#
# Authority: Bundesministerium für Finanzen (BMF), „Das Steuerbuch 2026 —
# Tipps zur Arbeitnehmerveranlagung 2025", incl. the reproduced official forms
# L 1, L 1ab and L 1d. Tax year 2025 (filed 2026).
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "at_pendlerpauschale"
    name: "Pendlerpauschale und Pendlereuro"
    short_name: "Pendlerp."
    hint: "Fahrten Wohnung–Arbeitsstätte laut Pendlerrechner"
  - key: "at_arbeitsmittel"
    name: "Arbeitsmittel und Werkzeuge"
    short_name: "Arbeitsm."
    hint: "Beruflich genutzte Geräte, Computer und Werkzeuge"
  - key: "at_fortbildung"
    name: "Fortbildungs-, Ausbildungs- und Umschulungskosten"
    short_name: "Fortbildung"
    hint: "Kurse, Seminare und Umschulung mit Berufsbezug"
  - key: "at_fachliteratur"
    name: "Fachliteratur"
    short_name: "Fachlit."
    hint: "Berufsbezogene Fachbücher und Fachzeitschriften"
  - key: "at_reisekosten"
    name: "Beruflich veranlasste Reisekosten"
    short_name: "Reisekosten"
    hint: "Kilometergeld, Tagesgelder und Nächtigung bei Dienstreisen"
  - key: "at_doppelte_haushaltsfuehrung"
    name: "Doppelte Haushaltsführung und Familienheimfahrten"
