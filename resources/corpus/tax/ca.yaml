# Tax deduction categories — Canada
# Mirrors the deductions and non-refundable credits of the CRA T1 Income Tax and
# Benefit Return. Federal only; provincial and territorial credits are not covered.
# Source: Canada Revenue Agency, Form 5000-R "T1 2025 Income Tax and Benefit Return"
# and the accompanying schedules (S5, S9, S11, S12) and forms (T777, T778, T1-M),
# tax year 2025.
# The digital news subscription credit is absent — it expired after 2024. The
# temporary flat rate home-office method is gone; only the detailed method remains.
#
# Schema per entry:
#   key         string  required — machine slug used as corpus_key in DB
#   name        string  required — display name for the category management list
#   short_name  string  optional — badge label (≤12 chars)
#   hint        string  optional — one-line tooltip hint for the picker popover
#
entries:
  - key: "ca_rrsp_deduction"
    name: "RRSP deduction"
    short_name: "RRSP"
    hint: "Contributions to your own or a spousal registered retirement savings plan"
  - key: "ca_fhsa_deduction"
    name: "FHSA deduction"
    short_name: "FHSA"
    hint: "Contributions made to your first home savings account"
  - key: "ca_child_care_expenses"
    name: "Child care expenses"
    short_name: "Child care"
    hint: "Amounts paid to care for a child so you could work, run a business, or study"
  - key: "ca_union_professional_dues"
    name: "Annual union, professional, or like dues"
    short_name: "Union dues"
    hint: "Yearly union dues and mandatory professional or licensing body fees"
  - key: "ca_moving_expenses"
    name: "Moving expenses"
    short_name: "Moving"
    hint: "Costs of relocating for a new job, business, or full-time study"
  - key: "ca_support_payments_made"
    name: "Support payments made"
    short_name: "Support paid"
    hint: "Deductible spousal support paid under a court order or written agreement"
  - key: "ca_carrying_charges_interest"
    name: "Carrying charges, interest expenses and other expenses"
    short_name: "Carrying chg"
    hint: "Interest on money borrowed to earn investment income, plus investment management fees"
  - key: "ca_other_employment_expenses"
    name: "Other employment expenses"
    short_name: "Employment"
    hint: "Job-related costs your employer required you to pay and did not reimburse"
  - key: "ca_work_space_in_the_home"
    name: "Work-space-in-the-home expenses"
    short_name: "Home office"
    hint: "Employment-use share of home costs such as utilities, rent, and home internet access"
  - key: "ca_disability_supports_deduction"
    name: "Disability supports deduction"
    short_name: "Disab. supp"
    hint: "Costs of disability supports paid so you could work or attend school"
  - key: "ca_medical_expenses"
    name: "Medical expenses"
    short_name: "Medical"
    hint: "Eligible medical, dental, and health costs paid for yourself and your family"
  - key: "ca_donations_and_gifts"
    name: "Donations and gifts"
    short_name: "Donations"
    hint: "Receipted gifts to registered charities and other qualified donees"
  - key: "ca_federal_tuition_amount"
    name: "Your federal tuition amount"
    short_name: "Tuition"
    hint: "Eligible tuition fees paid to a certified educational institution"
  - key: "ca_student_loan_interest"
    name: "Interest paid on your student loans"
    short_name: "Student loan"
    hint: "Interest paid on a government student loan under a federal or provincial program"
  - key: "ca_home_accessibility_expenses"
    name: "Home accessibility expenses"
    short_name: "Home access"
    hint: "Renovation costs making a home safer or more accessible for a qualifying individual"
  - key: "ca_disability_amount_self"
    name: "Disability amount for self"
    short_name: "Disability"
    hint: "Claim for yourself when an approved Form T2201 certifies a severe and prolonged impairment"
  - key: "ca_canada_caregiver_amount"
    name: "Canada caregiver amount"
    short_name: "Caregiver"
    hint: "Claim for supporting a spouse, partner, or dependant with a physical or mental impairment"
  - key: "ca_mhrtc"
    name: "Multigenerational home renovation tax credit"
    short_name: "MHRTC"
    hint: "Renovation costs to create a secondary unit so a senior or adult with a disability can live with family"
