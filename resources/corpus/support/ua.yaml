# Support-resource corpus — Ukraine (UA merchants + government).
#
# See support/international.yaml for the full schema. Government entries lean on
# help_url / apply_url / rights_url / phone; merchant entries on cancel/support.
# Where a service has no online cancellation flow the method — registered letter,
# phone, in branch — is recorded in `notes` instead of linking a generic page.
entries:
  # --- Merchants ---
  - name: Київстар
    type: merchant
    cancel_url: "https://kyivstar.ua/support/mobile/chi-mozhlivo-anulyuvati-dogovir-i-yak-tse-zrobiti"
    support_url: "https://kyivstar.ua/support"
    notes: "Договір анулюють лише у фірмовому магазині Київстар — потрібні паспорт або ID-картка та ідентифікаційний код (підійде і додаток Дія з цифровими копіями), а заборгованість за номером треба спершу погасити; у магазинах-партнерах це роблять не всюди. Передплачений номер діє 365 днів: 274 дні активного стану від останнього поповнення чи оплати тарифу, далі ще 91 день у призупиненому стані, коли зв’язку немає, але номер ще можна відновити поповненням від 30 грн одним платежем. Телефони: 466 з мобільного Київстар і 0 800 300 466 з інших мереж; для домашнього інтернету та ТБ — 460 і 0 800 300 460."
  - name: Vodafone Україна
    type: merchant
    cancel_url: "https://www.vodafone.ua/company/terms-of-use"
    support_url: "https://www.vodafone.ua/support"
    notes: "За п. 14.2 Умов користування дія договору припиняється за ініціативою абонента на підставі письмової заяви — поданої особисто, дистанційно засобами електронного зв’язку або як електронний документ з КЕП — у строк, що не перевищує 7 календарних днів з моменту отримання заяви оператором, якщо в самій заяві не вказано довший строк. Оператор може розірвати договір сам, якщо абонент щонайменше три місяці не користувався послугами без щомісячної плати, попередивши про це не менш ніж за десять робочих днів. Після повідомлення про зміну договірних умов абонент має право розірвати договір без додаткових витрат."
  - name: lifecell
    type: merchant
    support_url: "https://www.lifecell.ua/uk/pidtrimka/"
    notes: "Онлайн-форми розірвання договору на сайті lifecell немає — сторінка підтримки веде або до служби підтримки, або пропонує отримати допомогу в магазині lifecell і вибрати найближчий у переліку магазинів. Телефони: 5433 з мобільного lifecell, 0 800 20 5433 безкоштовно зі стаціонарних та мобільних номерів по Україні, +38 063 5433 111 у роумінгу."
  - name: Київстар ТБ
    type: merchant
    cancel_url: "https://kyivstar.ua/support/kyivstar-tv/yak-pidklyuchiti-ta-vidklyuchiti-kiyivstar-tb"
    support_url: "https://kyivstar.ua/support"
    notes: "Відключити Київстар ТБ можна в застосунку Мій Київстар або дзвінком на 466 — окремої кнопки на сайті немає. Якщо телебачення підключене разом із домашнім інтернетом чи тарифом Все разом, заявку оформлюють через Мій Київстар або контакт-центр 460; без домашнього інтернету підписка оформлюється просто в застосунку для смартфона, у застосунку для Smart TV або у вебверсії."
  - name: MEGOGO
    type: merchant
    cancel_url: "https://megogo.net/ua/rules"
    support_url: "https://megogo.net/ua/contacts"
    notes: "За п. 6.2.8.1 Угоди користувач будь-коли відмовляється від передплати кнопкою «Відмовитися від передплати» в розділі «Управління передплатами» свого акаунта: доступ діє до останнього дня оплаченого періоду, а списання за наступний період не відбувається. Якщо передплату оформлено в застосунку MEGOGO на iOS, скасовувати її треба через App Store. Один місяць платного доступу дорівнює 30 календарним дням; підтримка — support@megogo.com і +44 (20) 3734 7773."
  - name: SWEET.TV
    type: merchant
    cancel_url: "https://sweet.tv/ua-uk/faq"
    support_url: "https://sweet.tv/ua-uk/contacts"
    notes: "Автоматичне продовження передплати вимикається відв’язуванням банківської картки в особистому кабінеті на сайті sweet.tv — саме на сайті, а не в застосунку. Якщо не відключити автопродовження заздалегідь, кошти за умовами договору поверненню не підлягають, бо послугу вже надано на 30 днів. Питання — на info@sweet.tv."
  - name: Volia
    type: merchant
    support_url: "https://volia.com/ukr/contacts/"
    notes: "Кнопки розірвання договору на сайті ВОЛІ немає — компанія наголошує, що всі питання розв’язуються без фізичної присутності через цілодобовий кол-центр або замовленням послуги онлайн. Номери підтримки залежать від вашого оператора: 380505022250, 380935022250 і 380685022250, лінія підключення — 0800203710. Тексти публічного договору та порядок розгляду звернень, заяв і скарг опубліковані окремим переліком документів."
  - name: monobank
    type: merchant
    cancel_url: "https://monobank.ua/account-removal"
    support_url: "https://monobank.ua/contacts"
    notes: "Клієнт має право припинити користуватися застосунком monobank і вимагати видалення облікового запису, але кнопки для цього немає — треба звернутися до підтримки через застосунок, на пошту info@monobank.ua або за телефоном 0 800 205 205 (безкоштовно по Україні) чи +38 044 237 20 60 з інших країн. Запит виконують у тій мірі, в якій АТ «Універсал Банк» не має юридичного або договірного обов’язку далі зберігати чи обробляти ці дані. Підтримка відповідає цілодобово."
  - name: ПриватБанк
    type: merchant
    support_url: "https://privatbank.ua/pytannya-skargy-propozytsij"
    notes: "Окремої онлайн-форми закриття рахунку чи картки на сайті банку немає — звернення подають через цілодобову підтримку 3700 (безкоштовно з мобільних у межах України) або +38-073-716-11-31 з-за кордону чи зі стаціонарних, через чат «Допомога онлайн» у Приват24 та на сайті, безпосередньо у відділенні або через меню «Скарги та пропозиції». Умови обслуговування зібрані в розділі «Публічні договори», а для військових і ветеранів працює окрема лінія 0 800 505 120."
  - name: УНІКА Україна
    type: merchant
    cancel_url: "https://uniqa.ua/faq/"
    support_url: "https://uniqa.ua/contacts/"
    notes: "Щоб припинити дію договору й повернути кошти, треба надіслати на online_boc@uniqa.ua номер телефону, ПІБ страхувальника, причину та дату припинення — але не раніше дати отримання листа страховою компанією; відповідь обіцяють протягом 4 робочих годин. Для повернення частини невикористаного платежу за припиненою автоцивілкою заповнюють окрему заяву і надсилають її разом зі скан-копією техпаспорта на boc@uniqa.ua. Гаряча лінія: +38 (044) 225 60 00."
  - name: Sport Life
    type: merchant
    support_url: "https://sportlife.ua/uk/clubs/"
    notes: "За п. 7.3 публічної оферти договір не може бути розірваний односторонньою відмовою клієнта, а за п. 2.5 кошти, сплачені за клубну картку, поверненню не підлягають, якщо клієнт сам відмовляється від договору чи розриває його. Пропорційне повернення — не більше 70% вартості договору за вирахуванням використаного періоду — можливе лише тоді, коли припинення ініціює сам клуб за п. 3.7.5. Заморозка на 30 днів входить лише в пакети Premium і Lux&SPA; телефон (044) 222-4-222."
  - name: Товариство Червоного Хреста України
    type: merchant
    cancel_url: "https://redcross.org.ua/faqs/"
    support_url: "https://redcross.org.ua/donate/"
    notes: "Щоб зупинити регулярні платежі, треба написати на friends@redcross.org.ua або залишити запит через форму на сторінці «Підтримати» — запит опрацьовують протягом 5 днів і підтверджують скасування. Зміна суми, платіжних чи контактних даних регулярної донації оформлюється тим самим способом. Інфо-центр: 0 800 332 656."

  # --- Government ---
  - name: Дія
    type: government
    help_url: "https://diia.gov.ua/faq"
    apply_url: "https://diia.gov.ua/services"
    notes: "Вхід до кабінету громадянина на diia.gov.ua — за електронним підписом, BankID або Дія.Підпис. Заява на отримання статусу безробітного подається до 5 хвилин і опрацьовується до 3 робочих днів безоплатно; спрощену форму можуть подати ВПО та люди з тимчасово окупованих територій чи територій бойових дій. Скасування статусу — окрема послуга: треба вибрати свій центр зайнятості та причину припинення реєстрації, статус скасують протягом трьох робочих днів, і виплати допомоги по безробіттю після цього припиняються."
  - name: Державна податкова служба України
    type: government
    help_url: "https://tax.gov.ua/others/kontakt-tsentr/"
    rights_url: "https://tax.gov.ua/dlya-gromadskosti/zvernennya-gromadyan/"
    phone: "0 800 501 007"
    notes: "Контакт-центр ДПС консультує щоденно з 8:00 до 19:00, у п’ятницю з 8:00 до 18:00, крім суботи та неділі: 0 800 501 007 безкоштовно зі стаціонарних, а також 0 500 501 007 (Vodafone), 0 770 501 007 (Київстар) і 0 730 501 007 (lifecell) за тарифами операторів. З-за кордону телефонують на +380 44 454 16 13, +380 50 050 10 07, +380 73 050 10 07 або +380 77 050 10 07; є також чат у Viber і на ресурсі zir.tax.gov.ua. Декларації, звірку та запити подають в Електронному кабінеті платника."
  - name: Пенсійний фонд України
    type: government
    help_url: "https://www.pfu.gov.ua/kontakty/"
    apply_url: "https://portal.pfu.gov.ua/"
    rights_url: "https://www.pfu.gov.ua/35067-prava-ta-obov-yazky-zastrahovanoyi-osoby/"
    phone: "0 800 503 753"
    notes: "Контакт-центр ПФУ: 0 800 503 753, (044) 281-08-70 і (044) 281-08-71, електронна пошта info@pfu.gov.ua. Призначення та перерахунок пенсії, листки непрацездатності й перегляд нарахованих виплат доступні в особистому кабінеті вебпорталу електронних послуг, а спірні питання подають як електронне звернення за аплікаційною формою."
  - name: Національна служба здоров’я України
    type: government
    help_url: "https://nszu.gov.ua/gromadianam/onlain-formi"
    rights_url: "https://nszu.gov.ua/gromadianam/programa-medicnix-garantii"
    phone: "16-77"
    notes: "Інформаційно-довідкова служба НСЗУ приймає будь-які пропозиції, звернення та скарги за номером 16-77 з понеділка по четвер з 9:00 до 18:00, у п’ятницю з 9:00 до 16:45. Правила отримання медичної допомоги за програмою медичних гарантій однакові для всіх: доступ до більшості безоплатних послуг починається з декларації із сімейним лікарем, а з електронним направленням людина вільно обирає лікарню, де проходитиме обстеження чи лікування."
  - name: Головний сервісний центр МВС
    type: government
    help_url: "https://hsc.gov.ua/kontakti/"
    apply_url: "https://hsc.gov.ua/e-zapis/"
    rights_url: "https://hsc.gov.ua/index/publichna-informatsiya/elektronne-zvernennya-gromadyan/"
    phone: "(044)290-19-88"
    notes: "Реєстрація транспорту, заміна посвідчення водія та іспити оформлюються за попереднім записом через сервіс Е-ЗАПИС, а стан власних документів і послуг видно в Кабінеті водія. Скарги, запити та звернення подають через форму електронного звернення громадян; телефон ГСЦ МВС — (044)290-19-88."
  - name: Державна служба зайнятості
    type: government
    phone: "1518"
    notes: "Заяву на отримання статусу безробітного і на його скасування подають онлайн у кабінеті громадянина на порталі Дія, обравши свій центр зайнятості. За консультацією щодо грантових програм служби зайнятості можна звернутися до будь-якого зручного центру зайнятості, онлайн через Facebook або на гарячу лінію 1518."
