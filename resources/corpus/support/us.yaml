# Support-resource corpus — United States (US merchants + government).
#
# See support/international.yaml for the full schema. Government entries lean on
# help_url / apply_url / rights_url / phone; merchant entries on cancel/support.
# Where a service has no online cancellation flow the method — registered letter,
# phone, in branch — is recorded in `notes` instead of linking a generic page.
lang: en
entries:
  # --- Merchants ---
  - name: Xfinity
    type: merchant
    cancel_url: "https://www.xfinity.com/support/articles/cancel-my-xfinity-services"
    notes: "There is no self-service cancel button — Xfinity asks you to call 1-800-934-6489, schedule a call back, or visit an Xfinity store. If you are moving, transferring the service is offered instead; transfer a mobile number before you cancel or you lose it."
  - name: SiriusXM
    type: merchant
    cancel_url: "https://www.siriusxm.com/help/manage-or-cancel-service"
    notes: "Cancellation depends on who bills you — a subscription bought through a car maker, Apple, Amazon or a dealer is cancelled at that provider, not at SiriusXM. Check the billing descriptor on your card statement first."
  - name: Spectrum
    type: merchant
    cancel_url: "https://www.spectrum.net/support/manage-account/cancel-spectrum-services"
    notes: "Spectrum has no online cancellation flow — the support article directs you to call or visit a store, and equipment must be returned afterwards to avoid an unreturned-equipment charge."

  # --- Government ---
  - name: IRS
    type: government
    help_url: "https://www.irs.gov/help/telephone-assistance"
    apply_url: "https://www.irs.gov/payments/online-account-for-individuals"
    rights_url: "https://www.irs.gov/appeals"
    notes: "Balances, payment plans and notices are in your IRS Online Account. If you disagree with an assessment, the Independent Office of Appeals is separate from the examiner who made the decision; deadlines run from the date on the notice."
  - name: Medicare
    type: government
    help_url: "https://www.medicare.gov/basics/get-started-with-medicare"
    notes: "Enrolment windows matter more than anything else here: missing your Initial Enrolment Period can mean a permanent late-enrolment penalty on Part B and Part D."
  - name: HealthCare.gov
    type: government
    apply_url: "https://www.healthcare.gov/"
    notes: "Marketplace coverage can normally only be started or changed during Open Enrolment, unless a life event (job loss, move, marriage, birth) opens a Special Enrolment Period."
  - name: USAGov
    type: government
    help_url: "https://www.usa.gov/"
    notes: "Federal directory: it routes you to the right agency and to the state office for benefits, unemployment, and motor-vehicle matters, which are administered by states rather than federally."
  - name: Veterans Affairs
    type: government
    help_url: "https://www.va.gov/health-care/"
    apply_url: "https://www.va.gov/disability/"
    notes: "VA health care and disability compensation are applied for separately on va.gov. A disability decision can be challenged three ways — supplemental claim, higher-level review, or a Board appeal — generally within one year of the decision letter."
  - name: Unemployment Insurance
    type: government
    help_url: "https://www.usa.gov/unemployment-benefits"
    notes: "Unemployment insurance is run by each state, not federally: you claim through the state where you worked, and eligibility, amount and duration all differ by state. USAGov routes you to the right state office."
