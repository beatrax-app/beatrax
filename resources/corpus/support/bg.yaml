# Support-resource corpus — Bulgaria (BG merchants + government).
#
# See support/international.yaml for the full schema. Government entries lean on
# help_url / apply_url / rights_url / phone; merchant entries on cancel/support.
# Where a service has no online cancellation flow the method — registered letter,
# phone, in branch — is recorded in `notes` instead of linking a generic page.
entries:
  # --- Merchants ---
  - name: A1 България
    type: merchant
    support_url: "https://www.a1.bg/contact-us"
    notes: "Няма онлайн бутон за прекратяване — по т. 52 от Общите условия договорът се прекратява едностранно от абоната с едномесечно писмено предизвестие до A1, а предоставено крайно устройство се връща в магазин, иначе се дължи стойността му. От 4.12.2023 г. срочен договор се продължава само с изрично писмено съгласие на абоната; при липса на такова той се преобразува в безсрочен при условията по договора и тогава се прекратява с едномесечно предизвестие без неустойки (т. 28.5 и т. 52.а). Обслужване: *88 или +359 88123."
  - name: Yettel България
    type: merchant
    cancel_url: "https://www.yettel.bg/bg/faqs/drugi-vprosi/prekratyavane-na-dogovor"
    support_url: "https://www.yettel.bg/bg/kontakti"
    notes: "При прекратяване на срочен договор преди изтичане на срока физическо лице дължи неустойка от 3 стандартни месечни абонаментни такси, намалена съразмерно, ако остават под 3 месеца, плюс ползваните отстъпки от абонаментния план за не повече от 18 месеца и част от отстъпката от цената на устройството. Размерите са одобрени с решение на Комисията за защита на потребителите, протокол №02/16.01.2026 г., в сила от 11.02.2026 г. Обслужване на клиенти: 123 от Yettel, 089 123 от други оператори, +359 89 123 от чужбина."
  - name: Vivacom
    type: merchant
    support_url: "https://www.vivacom.bg/pomosht/kontakti"
    notes: "Прекратяването не се заявява онлайн — минава се през контактната форма, магазин или обслужване на клиенти на кратък номер 123, а Общите условия стоят в раздел „Помощ“. За оплаквания и несъгласия адресът е София 1784, пощенска кутия № 44, за Vivacom обслужване на клиенти; споровете попадат в обхвата на Секторната помирителна комисия за електронни съобщения към КЗП, ул. „Врабча“ № 1, adr.els@kzp.bg."
  - name: Електрохолд
    type: merchant
    support_url: "https://electrohold.bg/bg/kontakti/kontakti-electrohold/"
    notes: "Битовият клиент не прекратява договор онлайн — при нов собственик или наемател се подава заявление по образец за пререгистрация (прехвърляне) на партидата заедно с документ за собственост или договор за наем; за наемател е нужна и декларация за съгласие от наемодателя, подписана пред служител, нотариално заверена или подадена с валиден КЕП. Услугата се заявява с КЕП или в търговски център. Информационна линия 0700 10 010 (денонощно, 7 дни в седмицата), sales@electrohold.bg; при незадоволителен отговор пишете на енергийния омбудсман — ombudsman@electrohold.bg, (02) 895 84 50."
  - name: EVN България
    type: merchant
    support_url: "https://www.evn.bg/SpecialPages/faq-support.aspx"
    notes: "Смяната на доставчик се администрира от електроразпределителното дружество, към чиято мрежа е присъединен обектът — за Югоизточна България това е Електроразпределение Юг, не EVN Електроснабдяване. При въведено дялово разпределение клиентите нямат право да прекратяват подаването на топлинна енергия чрез физическо отделяне на радиаторите от сградната инсталация (чл. 153, ал. 5 от Закона за енергетиката). Обслужване на клиенти: 070017777; автоматична проверка на сметка: 0700 10 207. Жалби и сигнали се подават лично в офис, на пощенския адрес за кореспонденция или по електронна поща."
  - name: Енерго-Про
    type: merchant
    support_url: "https://www.energo-pro.bg/bitovi-klienti/kontakti"
    notes: "Доставчикът може да се сменя по всяко време и процедурата е безплатна — не се плаща нищо за смяната на търговеца, но задължително се проверяват условията на текущия договор, защото може да има срок на предизвестие или неустойки при предсрочно прекратяване. Ако търговецът фалира или прекрати дейност, преминавате автоматично към доставчик от последна инстанция без прекъсване на тока. Обслужване: 0700 800 61, service@energo-pro.bg; денонощни телефони на мрежовия оператор 0700 161 61 и 0700 359 10."
  - name: Овергаз
    type: merchant
    support_url: "https://www.overgas.bg/kontakti/"
    notes: "Овергаз не предлага онлайн прекратяване — заявките минават през клиентските центрове или формата за контакт на сайта. Национален телефон 0700 11 110 (обажданията от стационарен телефон се таксуват на цената на един градски разговор от цялата страна), авариен телефон 0800 11 211, централен офис София 1407, ул. „Филип Кутев“ 5."
  - name: Топлофикация София
    type: merchant
    cancel_url: "https://toplo.bg/denial-of-service"
    support_url: "https://toplo.bg/contact-us"
    notes: "Ползването на парно и топла вода не е индивидуална услуга и по закон не можете да се откажете индивидуално — отказът е възможен само с решение на общото събрание на етажната собственост, когато собственици на най-малко две трети от собствеността по идеални части гласуват за това. Дори при трайно изключени радиатори продължавате да получавате сметки за сградна инсталация и дялово разпределение. Обслужване на клиенти 0700 111 11 (+359 2 902 49 50 от чужбина); за просрочия се сключва споразумение с първа вноска минимум 30% и остатък на 6 равни месечни вноски без лихва при спазване на плана."
  - name: ДЗИ
    type: merchant
    support_url: "https://www.dzi.bg/contact"
    notes: "На сайта на ДЗИ няма онлайн услуга за прекратяване на полица — връзката е през националния телефон 0700 16 166, +3592 811 2760 от чужбина, clients@dzi.bg, формата „Пишете ни“ или офис за обслужване, избран от картата на страницата „Контакти“. За допълнително здравно застраховане се ползва отделният номер 0700 11 555."
  - name: УниКредит Булбанк
    type: merchant
    support_url: "https://www.unicreditbulbank.bg/bg/kontakti/"
    notes: "Документът „Общи условия за откриване, обслужване и закриване на банкови сметки на физически лица и за предоставяне на платежни услуги и инструменти“ се публикува в раздел „Тарифи и общи условия → Физически лица“ — там се проверяват сроковете и таксите при закриване на сметка. Център за контакт с клиенти: 1 84 84 за местни мобилни оператори според тарифния план, 0700 1 84 84 на цената на един градски разговор (+359 700 1 84 84 извън страната); 24-часово съдействие за карти на 15 212 и 02/933 7 212."
  - name: ОББ
    type: merchant
    support_url: "https://ubb.bg/contact"
    notes: "ОББ не публикува онлайн услуга за закриване на сметка — обслужване на клиенти на 0700 1 17 17 (национална линия), кратък номер *71 71 за абонати на мобилни оператори и +3592 811 20 99 от страната и чужбина, или в клон. „Платежна сметка за основни операции“ е безсрочна, с такса за откриване 1,50 лв. / 0,77 €, като месечна такса за обслужване не се събира, когато по нея постъпват средства от социално подпомагане и стипендии за ученици, студенти и докторанти."
  - name: СБА
    type: merchant
    support_url: "https://www.sba.bg/contacts/all"
    cheaper_url: "https://www.sba.bg/membership"
    notes: "Абонаментът за пътна помощ е годишен и се плаща за цяла година напред — сребърна 59 лв. / 30,17 €, сребърна плюс 98 лв. / 50,11 €, златна 155 лв. / 79,25 €, платинена 285 лв. / 145,72 €. Няма онлайн прекратяване; смяна на нивото или отказ се уреждат на +359-2-9357935 или info@uab.org."
  - name: Български червен кръст
    type: merchant
    support_url: "https://www.redcross.bg/contacts"
    notes: "Даренията се заявяват чрез електронна форма на уебсайта (чл. 10 от Общите условия) и на сайта няма функция за спиране на периодично дарение — за целта се пише на БЧК, Национален съвет, бул. „Джеймс Баучер“ 76, 1407 София, или се използва някой от каналите в раздел „Контакти“. Отказ от рекламни съобщения може по всяко време чрез линка във всяко съобщение (чл. 26) и не е обвързан с възможността да се дарява."

  # --- Government ---
  - name: Национална агенция за приходите
    type: government
    help_url: "https://nra.bg/wps/portal/nra/kontakti"
    apply_url: "https://portal.nra.bg/"
    rights_url: "https://nra.bg/wps/portal/nra/kontrol/revizii"
    phone: "0700 18 700"
    notes: "Информационният център отговаря на 0700 18 700 и +359 2 9859 6801, имейл infocenter@nra.bg, адрес бул. „Княз Ал. Дондуков“ № 52, София. Декларациите и справките се подават през Портала за електронни услуги. Разделът „Ревизии“ описва реда при проверка и ревизия по общ ред и по аналог, а при просрочени задължения има отделни раздели за разсрочване и отсрочване и за разрешение за неотложно плащане."
  - name: Национален осигурителен институт
    type: government
    help_url: "https://www.noi.bg/kontakti/svyrjete-se-s-nas/"
    apply_url: "https://www.noi.bg/administrativno-obslujvane/epeu/"
    rights_url: "https://www.noi.bg/izplashtane-na-obezshteteniya-za-bezrabotitsa/"
    phone: "0700 14 802"
    notes: "Контактният център се търси на 0700 14 802 или 02 902 0506, имейл noi@nssi.bg. Заявления за административни услуги, жалби, сигнали и искания за справки, които изискват проверка по лични данни, не се обработват свободно по имейл. Единният портал за електронни услуги дава достъп до електронния регистър на болничните листове и решенията по обжалването им, до справка за размера на отпусната пенсия и до е-протокола за профилактика и рехабилитация."
  - name: Национална здравноосигурителна каса
    type: government
    help_url: "https://www.nhif.bg/bg/contacts"
    apply_url: "https://www.nhif.bg/bg/people/e-services"
    rights_url: "https://www.nhif.bg/bg/people/rights"
    phone: "0800 14 800"
    notes: "„Зеленият телефон“ 0800 14 800 се избира безплатно от стационарни телефони, от всички мобилни оператори и от чужбина, всеки работен ден от 09:00 до 17:30 ч., като едно обаждане трае до 8 минути. Приемната за консултации на граждани е в София 1407, кв. „Лозенец“, ул. „Любата“ № 15, тел. 02/965 9387. Предложения, сигнали и жалби се подават на отделен електронен адрес, а не на адреса по ЗДОИ."
  - name: Агенция по заетостта
    type: government
    help_url: "https://www.az.government.bg/bg/contacts/"
    apply_url: "https://www.az.government.bg/pages/administrativni-uslugi/"
    rights_url: "https://www.az.government.bg/faq/?cat=1"
    phone: "980 87 19"
    notes: "Централата е на адрес София 1000, бул. „Дондуков“ № 3, телефон 980 87 19, факс 986 78 02, az@az.government.bg, а на сайта има и форма за контакт. Издаденото решение за прекратяване на регистрацията като търсещо работа лице може да се обжалва по реда на Административнопроцесуалния кодекс пред непосредствено по-горестоящия административен орган."
  - name: egov.bg
    type: government
    help_url: "https://egov.bg/wps/portal/egov/helpdesk"
    apply_url: "https://egov.bg/wps/portal/egov/uslugi"
    phone: "070020341"
    notes: "Помощният контактен център на Министерството на електронното управление се търси на 070020341 или help@e-gov.bg. През портала се влиза в „Моето пространство“, ползва се каталогът с електронни административни услуги на всички доставчици, електронното плащане и валидирането на електронни документи; има раздели „Сигнали, жалби, предложения“, „Услуги чрез посредник“ и помощни видеоматериали за заявяване на е-услуги."
  - name: Пътна полиция
    type: government
    help_url: "https://www.mvr.bg/bg/contacts"
    apply_url: "https://www.mvr.bg/opp"
    phone: "029825000"
    notes: "Разделът на „Пътна полиция“ води към услугите по регистрация — първоначална регистрация, промяна в регистрацията, временно спиране от движение по желание на собственика, пускане в движение на временно спряно ППС, прекратяване на регистрацията с писмено заявление от собственика и възстановяване на прекратена регистрация — както и към издаване и подмяна на свидетелство за управление на МПС. При починал собственик регистрацията се прекратява служебно. Централа на МВР: 029825000, ул. „6-и септември“ № 29, София 1000."
  - name: Агенция за социално подпомагане
    type: government
    help_url: "https://asp.government.bg/bg/kontakti/"
    apply_url: "https://asp.government.bg/bg/administrativni-uslugi-glavni/elektronni-administrativni-uslugi/"
    rights_url: "https://asp.government.bg/bg/deynosti/sotsialno-podpomagane/sotsialni-pomoshti/"
    notes: "През АСП се подават заявления-декларации за месечни и еднократни социални помощи, семейни помощи, целева помощ за отопление за сезон 2026/2027 г. и компенсация за увеличените цени на горивата; образците се теглят от раздела „Социални помощи“. Сайтът има раздел „Най-често задавани въпроси“ и форма за удовлетвореността на гражданите от административното обслужване."
