# Government / public-agency classification rules — Iceland.
# (The RÚV útvarpsgjald is levied through the income-tax assessment rather
# than billed separately, so there is no broadcasting-fee rule. Tollstjóri
# was merged into Skatturinn in 2019 and is likewise omitted.)
