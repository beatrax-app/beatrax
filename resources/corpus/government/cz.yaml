# Government / public-agency classification rules — Czechia.
# Schema: see government/nl.yaml.
entries:
  - pattern: "FINANCNI URAD"
    name: "Finanční úřad"
  - pattern: "regex:\\bCSSZ\\b"
    name: "ČSSZ"
  - pattern: "FINANCNI SPRAVA"
    name: "Finanční správa"
  - pattern: "CESKA SPRAVA SOCIALNIHO ZABEZPECENI"
    name: "ČSSZ"
  # Celní správa also collects road tax and sells the motorway vignette.
  - pattern: "CELNI URAD"
    name: "Celní úřad"
  # Czech health insurers are public-law bodies.
  - pattern: "ZDRAVOTNI POJISTOVNA"
    name: "Zdravotní pojišťovna"
  - pattern: "regex:\\bVZP\\b"
    name: "VZP"
  - pattern: "URAD PRACE"
    name: "Úřad práce"
  # Municipal, city and regional offices.
  - pattern: "MAGISTRAT"
  - pattern: "MESTSKY URAD"
  - pattern: "OBECNI URAD"
  - pattern: "KRAJSKY URAD"
  - pattern: "DAN Z NEMOVITYCH VECI"
    name: "Daň z nemovitých věcí"
  - pattern: "DALNICNI ZNAMKA"
    name: "Dálniční známka"
  - pattern: "EDALNICE"
    name: "eDálnice"
  - pattern: "KATASTRALNI URAD"
    name: "Katastrální úřad"
  - pattern: "SOUDNI POPLATEK"
    name: "Soudní poplatek"
  - pattern: "EXEKUTORSKY URAD"
    name: "Exekutorský úřad"
  # Concession fees are still levied in 2026 (abolition takes effect 2027).
  - pattern: "regex:CESKA TELEVIZE|CESKY ROZHLAS"
    name: "Koncesionářský poplatek"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: financnisprava.cz, cssz.cz, celnisprava.cz, vzp.cz,
  # uradprace.cz, mvcr.cz, portal.gov.cz's institution list, cuzk.cz,
  # justice.cz, edalnice.cz and mfcr.cz. Czech descriptors appear both with
  # and without diacritics, so both spellings are listed.
  - pattern: "FINANČNÍ ÚŘAD"
    name: "Finanční úřad"
  - pattern: "FINANČNÍ SPRÁVA"
    name: "Finanční správa"
