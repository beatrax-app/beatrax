# Government / public-agency classification rules — Serbia.
# Serbian banks print Latin on statements far more often than Cyrillic, so
# the Latin form leads; the Cyrillic form is added for the two bodies that
# genuinely invoice in Cyrillic.
# (The RTS/RTV levy rides on the electricity bill and never appears as its
# own counterparty, so there is no broadcasting-fee rule.)
#
# Sources: purs.gov.rs (which publishes the authority's own name in both
# scripts — Пореска управа / Poreska uprava), carina.gov.rs, pio.rs,
# rfzo.rs, nsz.gov.rs, rgz.gov.rs, apr.gov.rs, trezor.gov.rs, mup.gov.rs,
# putevi-srbije.rs, koridorisrbije.rs, abs.gov.rs, pks.rs, infostan.rs,
# beograd.gov.rs, srbija.gov.rs institution register.
#
# Script coverage: every body added below is listed in Latin AND Cyrillic,
# because Serbian banks and public creditors genuinely issue both — the
# Cyrillic form is the one on a Poreska uprava or Objedinjena naplata
# invoice, the Latin form the one most banks re-print. All Cyrillic entries
# are plain substrings (never `regex:`) so mb_stripos folds them correctly.
# Serbian Latin is left ASCII-folded, matching the existing rows and the
# way domestic descriptors are actually generated; the few diacritic Latin
# forms that banks do print are added alongside.
# Rejected as too collision-prone: bare "APR" (the Serbian business
# registry, but also the month abbreviation), "APOTEKA" (most pharmacies
# are private), "TAKSA" and "SUD" on their own, and "PIO" unqualified.
# Schema: see government/nl.yaml.
entries:
  - pattern: "PORESKA UPRAVA"
    name: "Poreska uprava"
  - pattern: "ПОРЕСКА УПРАВА"
    name: "Poreska uprava"
  - pattern: "UPRAVA CARINA"
    name: "Uprava carina"
  - pattern: "REPUBLICKI FOND ZA PENZIJSKO"
    name: "PIO fond"
  - pattern: "PENZIJSKO I INVALIDSKO OSIGURANJE"
    name: "PIO fond"
  - pattern: "regex:\\bRFZO\\b"
    name: "RFZO"
  - pattern: "NACIONALNA SLUZBA ZA ZAPOSLJAVANJE"
    name: "Nacionalna služba za zapošljavanje"
  # City-run consolidated municipal billing — one of the most common
  # recurring public charges on a Serbian statement.
  - pattern: "OBJEDINJENA NAPLATA"
    name: "Objedinjena naplata"
  - pattern: "GRADSKA UPRAVA"
    name: "Gradska uprava"
  - pattern: "OPSTINA"
  - pattern: "ОПШТИНА"
  - pattern: "POREZ NA IMOVINU"
    name: "Porez na imovinu"
  - pattern: "MINISTARSTVO UNUTRASNJIH POSLOVA"
    name: "MUP Srbije"
  - pattern: "regex:\\bMUP\\b"
    name: "MUP Srbije"
  - pattern: "REPUBLICKI GEODETSKI ZAVOD"
    name: "Republički geodetski zavod"
  - pattern: "PUTEVI SRBIJE"
    name: "JP Putevi Srbije"
  - pattern: "UPRAVA ZA TREZOR"
