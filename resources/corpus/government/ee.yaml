    name: "Sotsiaalkindlustusamet"
  - pattern: "TOOTUKASSA"
    name: "Töötukassa"
  # Haigekassa was renamed Tervisekassa in 2023; both forms still appear.
  - pattern: "TERVISEKASSA"
    name: "Tervisekassa"
  - pattern: "HAIGEKASSA"
    name: "Tervisekassa (ex-Haigekassa)"
  # Maanteeamet merged into Transpordiamet in 2021.
