# Government / public-agency classification rules — North Macedonia.
# Macedonian is written in Cyrillic and domestic statements use it, but
# banks also print Latin transliterations — both are matched for the
# highest-value bodies.
# (The MRT broadcasting fee was abolished, so there is no licence rule.)
#
# Sources: ujp.gov.mk (which publishes the authority's own Cyrillic name
# "Управа за Јавни Приходи на Република Северна Македонија", abbreviation
# УЈП, English "Public Revenue Office", and names the Царинска управа and
# Министерство за Финансии alongside it), customs.gov.mk, piom.com.mk,
# fzo.org.mk, av.gov.mk, katastar.gov.mk, crm.com.mk, mvr.gov.mk,
# roads.org.mk, sud.mk, mchamber.mk, ukim.edu.mk, skopje.gov.mk.
#
# Script coverage: every body below is listed in Cyrillic AND in the Latin
# transliteration, because domestic invoices are Cyrillic while cross-border
# and card descriptors arrive transliterated. All Cyrillic entries are plain
# substrings, never `regex:`, so mb_stripos folds them correctly.
# Rejected as too collision-prone: "ДДВ" and any other bare three-letter
# Cyrillic token, "ТАКСА" and "СУД" on their own, and "ФОНД" unqualified.
# Schema: see government/nl.yaml.
entries:
  - pattern: "УПРАВА ЗА ЈАВНИ ПРИХОДИ"
    name: "УЈП (Управа за јавни приходи)"
  - pattern: "UPRAVA ZA JAVNI PRIHODI"
    name: "UJP (Public Revenue Office)"
  - pattern: "regex:\\bUJP\\b"
    name: "UJP (Public Revenue Office)"
  - pattern: "ЦАРИНСКА УПРАВА"
    name: "Царинска управа"
  - pattern: "ФОНД ЗА ПЕНЗИСКО"
    name: "Фонд ПИОМ"
  - pattern: "ФОНД ЗА ЗДРАВСТВЕНО ОСИГУРУВАЊЕ"
    name: "ФЗОМ"
  - pattern: "АГЕНЦИЈА ЗА ВРАБОТУВАЊЕ"
    name: "Агенција за вработување"
  # Municipalities bill property tax, waste and communal charges.
  - pattern: "ОПШТИНА"
  - pattern: "OPSTINA"
  - pattern: "ГРАД СКОПЈЕ"
    name: "Град Скопје"
  - pattern: "ДАНОК НА ИМОТ"
    name: "Данок на имот"
  - pattern: "МИНИСТЕРСТВО ЗА ВНАТРЕШНИ РАБОТИ"
    name: "МВР"
  - pattern: "АГЕНЦИЈА ЗА КАТАСТАР"
    name: "Агенција за катастар на недвижности"
  - pattern: "ЈАВНИ ПАТИШТА"
    name: "ЈП Државни патишта"
  - pattern: "АДМИНИСТРАТИВНА ТАКСА"
    name: "Административна такса"
  # --- Tax, customs and treasury -------------------------------------------
  - pattern: "CARINSKA UPRAVA"
    name: "Царинска управа"
  - pattern: "МИНИСТЕРСТВО ЗА ФИНАНСИИ"
    name: "Министерство за финансии"
  - pattern: "MINISTERSTVO ZA FINANSII"
    name: "Министерство за финансии"
  - pattern: "ДАНОК НА ДОДАДЕНА ВРЕДНОСТ"
    name: "ДДВ"
  - pattern: "ПЕРСОНАЛЕН ДАНОК НА ДОХОД"
    name: "Персонален данок на доход"
  - pattern: "DANOK NA IMOT"
    name: "Данок на имот"
  - pattern: "ADMINISTRATIVNA TAKSA"
    name: "Административна такса"
  - pattern: "СУДСКА ТАКСА"
    name: "Судска такса"
  - pattern: "SUDSKA TAKSA"
    name: "Судска такса"
  # --- Pensions, health insurance, employment and benefits --------------------
  - pattern: "ФОНД НА ПЕНЗИСКОТО И ИНВАЛИДСКОТО ОСИГУРУВАЊЕ"
    name: "Фонд ПИОМ"
  - pattern: "FOND ZA PENZISKO"
    name: "Фонд ПИОМ"
  - pattern: "FOND ZA ZDRAVSTVENO OSIGURUVANJE"
    name: "ФЗОМ"
  - pattern: "ФЗОМ"
    name: "ФЗОМ"
  - pattern: 'regex:\bFZOM\b'
    name: "ФЗОМ"
  - pattern: "AGENCIJA ZA VRABOTUVANJE"
    name: "Агенција за вработување"
  - pattern: "ЦЕНТАР ЗА СОЦИЈАЛНА РАБОТА"
    name: "Центар за социјална работа"
  - pattern: "CENTAR ZA SOCIJALNA RABOTA"
    name: "Центар за социјална работа"
  - pattern: "ДЕТСКИ ДОДАТОК"
