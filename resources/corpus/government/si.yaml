# Government / public-agency classification rules — Slovenia.
#
# Sources: gov.si register of "organi v sestavi" (which is where the exact
# forms Finančna uprava Republike Slovenije, Geodetska uprava Republike
# Slovenije, Uprava Republike Slovenije za javna plačila and Policija are
# taken from), fu.gov.si, zpiz.si, zzzs.si, ess.gov.si, dars.si, ajpes.si,
# rtvslo.si, sodisce.si, gzs.si, ozs.si, zdravniskazbornica.si.
#
# Diacritics: the matcher compares the descriptor as printed, and Slovenian
# banks print č/š/ž as often as they strip them, so a body whose distinctive
# word carries one is listed twice — ASCII-folded and as written.
# Rejected as too collision-prone: "GLOBA" (a substring of "GLOBAL"),
# "SNAGA" (the Ljubljana waste utility, but also an ordinary noun — the
# merged "VOKA SNAGA" form is used instead), bare "UJP" (it is also the
# North Macedonian tax office) and "VRTEC" on its own.
# Schema: see government/nl.yaml.
entries:
  - pattern: "regex:\\bFURS\\b"
    name: "FURS (finančna uprava)"
  - pattern: "RTV PRISPEVEK"
    name: "RTV Slovenija (prispevek)"
  - pattern: "regex:\\bZPIZ\\b"
    name: "ZPIZ (pokojninska)"
  - pattern: "FINANCNA UPRAVA"
    name: "Finančna uprava RS"
  - pattern: "regex:\\bZZZS\\b"
    name: "ZZZS (zdravstveno zavarovanje)"
  - pattern: "ZAVOD ZA ZAPOSLOVANJE"
    name: "Zavod RS za zaposlovanje"
  - pattern: "CENTER ZA SOCIALNO DELO"
    name: "Center za socialno delo"
  - pattern: "JAVNI STIPENDIJSKI"
    name: "Javni štipendijski sklad"
  # Občine bill NUSZ, waste and water charges.
  - pattern: "OBCINA"
  - pattern: "NADOMESTILO ZA UPORABO STAVBNEGA ZEMLJISCA"
    name: "NUSZ"
  # Upravne enote handle vehicle registration and identity documents.
  - pattern: "UPRAVNA ENOTA"
  - pattern: "regex:\\bDARS\\b"
    name: "DARS"
  - pattern: "E-VINJETA"
    name: "e-vinjeta"
  - pattern: "GEODETSKA UPRAVA"
    name: "GURS"
  - pattern: "SODNA TAKSA"
    name: "Sodna taksa"
  # --- Tax, treasury and public payments ---------------------------------
  - pattern: "FINANČNA UPRAVA"
    name: "Finančna uprava RS"
  - pattern: "MINISTRSTVO ZA FINANCE"
    name: "Ministrstvo za finance"
  - pattern: "MINISTRSTVO"
  - pattern: "UPRAVA REPUBLIKE SLOVENIJE"
    name: "Uprava Republike Slovenije"
  - pattern: "UPRAVA ZA JAVNA PLACILA"
    name: "UJP (Uprava RS za javna plačila)"
  - pattern: "UPRAVA ZA JAVNA PLAČILA"
    name: "UJP (Uprava RS za javna plačila)"
  - pattern: "DOHODNINA"
    name: "Dohodnina"
  - pattern: "PRISPEVKI ZA SOCIALNO VARNOST"
    name: "Prispevki za socialno varnost"
  # Dopolnilno zdravstveno zavarovanje was replaced on 1 Jan 2024 by a
  # compulsory health contribution; both names still occur on mandates.
  - pattern: "OBVEZNI ZDRAVSTVENI PRISPEVEK"
    name: "Obvezni zdravstveni prispevek"
  - pattern: "DOPOLNILNO ZDRAVSTVENO ZAVAROVANJE"
    name: "Dopolnilno zdravstveno zavarovanje"
  - pattern: "DAVCNA IZVRSBA"
    name: "Davčna izvršba"
  - pattern: "DAVČNA IZVRŠBA"
    name: "Davčna izvršba"
  - pattern: "UPRAVNA TAKSA"
    name: "Upravna taksa"
  # --- Pensions, health insurance, employment and benefits ---------------
  - pattern: "ZAVOD ZA POKOJNINSKO IN INVALIDSKO ZAVAROVANJE"
    name: "ZPIZ"
  - pattern: "ZAVOD ZA ZDRAVSTVENO ZAVAROVANJE SLOVENIJE"
    name: "ZZZS"
  - pattern: "ZAVOD REPUBLIKE SLOVENIJE ZA ZAPOSLOVANJE"
    name: "Zavod RS za zaposlovanje"
  - pattern: "OTROSKI DODATEK"
    name: "Otroški dodatek"
  - pattern: "OTROŠKI DODATEK"
    name: "Otroški dodatek"
  - pattern: "DENARNA SOCIALNA POMOC"
    name: "Denarna socialna pomoč"
  - pattern: "DENARNA SOCIALNA POMOČ"
    name: "Denarna socialna pomoč"
  # --- Public health providers -------------------------------------------
  - pattern: "ZDRAVSTVENI DOM"
    name: "Zdravstveni dom"
  - pattern: "UNIVERZITETNI KLINICNI CENTER"
    name: "Univerzitetni klinični center"
  - pattern: "UNIVERZITETNI KLINIČNI CENTER"
    name: "Univerzitetni klinični center"
  - pattern: "SPLOSNA BOLNISNICA"
    name: "Splošna bolnišnica"
  - pattern: "SPLOŠNA BOLNIŠNICA"
    name: "Splošna bolnišnica"
  - pattern: "NACIONALNI INSTITUT ZA JAVNO ZDRAVJE"
    name: "NIJZ"
  - pattern: "NACIONALNI INŠTITUT ZA JAVNO ZDRAVJE"
    name: "NIJZ"
  - pattern: 'regex:\bNIJZ\b'
    name: "NIJZ"
  # --- Local government and municipal utilities ---------------------------
  - pattern: "OBČINA"
  - pattern: "MESTNA OBCINA"
    name: "Mestna občina"
  - pattern: "MESTNA OBČINA"
