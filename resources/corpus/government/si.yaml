  - pattern: "DIREKCIJA REPUBLIKE SLOVENIJE ZA INFRASTRUKTURO"
    name: "DRSI"
  # --- Police and courts ---------------------------------------------------
  - pattern: "MINISTRSTVO ZA NOTRANJE ZADEVE"
    name: "Ministrstvo za notranje zadeve"
  - pattern: "POLICIJA"
    name: "Policija"
  - pattern: "OKRAJNO SODISCE"
    name: "Okrajno sodišče"
