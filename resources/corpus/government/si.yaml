  - pattern: "KRAJEVNA SKUPNOST"
    name: "Krajevna skupnost"
  - pattern: "NADOMESTILO ZA UPORABO STAVBNEGA ZEMLJIŠČA"
    name: "NUSZ"
  - pattern: "KOMUNALNI PRISPEVEK"
    name: "Komunalni prispevek"
  - pattern: "TURISTICNA TAKSA"
    name: "Turistična taksa"
  - pattern: "TURISTIČNA TAKSA"
    name: "Turistična taksa"
  - pattern: "JAVNO PODJETJE"
    name: "Javno podjetje"
  - pattern: "VOKA SNAGA"
    name: "JP VOKA SNAGA"
  - pattern: "KOMUNALA"
    name: "Komunala"
  # --- Roads, tolls and vehicles ------------------------------------------
  - pattern: "DRUZBA ZA AVTOCESTE"
