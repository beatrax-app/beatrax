# Government / public-agency classification rules — United States.
# US federal payments use standardized, highly distinctive ACH descriptors.
# (The USPS is a federal agency but behaves as an ordinary shipping merchant
# on a statement, so it is deliberately not classified as government.)
# Schema: see government/nl.yaml.
entries:
  # Outbound tax payment (IRS / EFTPS) — "IRS USATAXPYMT".
  - pattern: "USATAXPYMT"
    name: "IRS"
  # Inbound tax refund — "IRS TREAS 310 TAX REF".
  - pattern: "regex:IRS\\s+TREAS\\s+310"
    name: "IRS (refund)"
  # Inbound Social Security benefit — "SSA TREAS 310".
  - pattern: "regex:SSA\\s+TREAS\\s+310"
    name: "Social Security Administration"
  - pattern: "regex:\\bEFTPS\\b"
    name: "IRS (EFTPS)"
  - pattern: "IRS DIRECTPAY"
    name: "IRS (Direct Pay)"
  # Supplemental Security Income, VA compensation and federal retirement all
  # use the same TREAS 310 envelope with a distinct originator prefix.
  - pattern: "regex:SSI\\s+TREAS\\s+310"
    name: "Social Security Administration (SSI)"
  - pattern: "regex:VACP\\s+TREAS\\s+310"
    name: "Department of Veterans Affairs"
  - pattern: "regex:OPM1\\s+TREAS\\s+310"
    name: "Office of Personnel Management"
  - pattern: "US TREASURY"
    name: "US Treasury"
  # State revenue departments.
  - pattern: "FRANCHISE TAX BD"
    name: "California Franchise Tax Board"
  - pattern: "DEPT OF REVENUE"
    name: "State Department of Revenue"
  - pattern: "regex:\\bDMV\\b"
    name: "DMV"
  - pattern: "COUNTY TAX COLLECTOR"
    name: "County Tax Collector"
  - pattern: "CHILD SUPPORT"
    name: "Child Support Enforcement"
  # US toll roads are run by state and regional public authorities.
  - pattern: "regex:\\bE-?ZPASS\\b"
    name: "E-ZPass"
  - pattern: "SUNPASS"
    name: "SunPass"
  - pattern: "FASTRAK"
    name: "FasTrak"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: irs.gov (Direct Pay / EFTPS and the two authorised card
  # processors, Pay1040 and ACI Payments), fiscal.treasury.gov's "TREAS 310"
  # ACH company-name convention, ssa.gov, va.gov, opm.gov, studentaid.gov's
  # servicer list, uscis.gov, cbp.gov (Global Entry), tsa.gov, cms.gov
  # (Medicare premium billing), pay.gov, recreation.gov and the state
  # revenue/DMV bodies' own sites. Ordering matters less than shape here:
  # US federal ACH descriptors are highly standardised, state and local
  # ones are not, so the local rules lean on multi-word phrases that no
  # ordinary merchant descriptor carries.
  # Bare "IRS" is unusable: it is also Portugal's personal income tax
  # (imposto sobre o rendimento das pessoas singulares), so the token is
  # qualified by the words the US descriptor actually pairs it with.
  - pattern: 'regex:\bIRS\s+(PAYMENT|PYMT|TAX)\b'
    name: "IRS"
  # Every federal benefit and refund ACH credit carries "<agency> TREAS 310".
  - pattern: 'regex:\bTREAS\s+310\b'
    name: "US Treasury (federal payment)"
  - pattern: 'regex:RRB\s+TREAS\s+310'
    name: "Railroad Retirement Board"
  - pattern: "SOCIAL SECURITY ADMIN"
    name: "Social Security Administration"
  - pattern: "INTERNAL REVENUE SERVICE"
    name: "IRS"
  - pattern: "PAY.GOV"
    name: "Pay.gov"
  - pattern: "US DEPT OF EDUCATION"
    name: "U.S. Department of Education"
  - pattern: "DEPT OF ED"
    name: "U.S. Department of Education"
  # Federal loan servicers and the default-resolution contractor.
  - pattern: "MOHELA"
    name: "MOHELA"
  - pattern: "NELNET"
    name: "Nelnet"
  - pattern: "AIDVANTAGE"
    name: "Aidvantage"
  - pattern: "EDFINANCIAL"
    name: "Edfinancial Services"
  - pattern: "GREAT LAKES EDUCATIONAL LOAN"
    name: "Great Lakes (now Nelnet)"
  - pattern: "NAVIENT"
    name: "Navient"
  - pattern: "HEARTLAND ECSI"
    name: "Heartland ECSI"
  - pattern: "DEFAULT RESOLUTION GROUP"
    name: "Default Resolution Group (ED)"
  - pattern: 'regex:\bUSCIS\b'
    name: "USCIS"
  - pattern: "CITIZENSHIP AND IMMIGRATION"
    name: "USCIS"
  - pattern: "US DEPARTMENT OF STATE"
    name: "U.S. Department of State"
  - pattern: "VETERANS AFFAIRS"
    name: "Department of Veterans Affairs"
  - pattern: "TSA PRECHECK"
    name: "TSA PreCheck"
  - pattern: "GLOBAL ENTRY"
    name: "CBP Global Entry"
  - pattern: "NATIONAL PARK SERVICE"
    name: "National Park Service"
  - pattern: "RECREATION.GOV"
    name: "Recreation.gov"
  - pattern: "NATIONAL FLOOD INSURANCE"
    name: "FEMA NFIP"
  - pattern: "MEDICARE PREMIUM"
    name: "Medicare (CMS)"
  - pattern: "CMS MEDICARE"
    name: "Medicare (CMS)"
  - pattern: "SBA EIDL"
    name: "Small Business Administration"
  - pattern: "SBA LOAN"
    name: "Small Business Administration"
  - pattern: "PACER SERVICE CENTER"
    name: "PACER (U.S. Courts)"
  # Processors that carry government payments to the statement. ACI (which
  # absorbed Official Payments) and Pay1040 are the two IRS-authorised card
  # processors; the rest are court, DMV and municipal collectors.
  - pattern: "ACI PAYMENTS"
    name: "ACI Payments"
  - pattern: "OFFICIAL PAYMENTS"
    name: "ACI Payments (formerly Official Payments)"
  - pattern: "PAY1040"
    name: "Pay1040"
  - pattern: "PAYUSATAX"
    name: "payUSAtax"
  - pattern: "VALUE PAYMENT SYSTEMS"
    name: "Value Payment Systems"
  - pattern: "NCOURT"
    name: "nCourt"
  - pattern: "GOVPAYNET"
    name: "GovPayNet / AllPaid"
  - pattern: "ALLPAID"
    name: "AllPaid"
  - pattern: "POINTANDPAY"
    name: "Point & Pay"
  - pattern: "POINT AND PAY"
    name: "Point & Pay"
  - pattern: "MUNICIPAL SERVICES BUREAU"
    name: "Municipal Services Bureau"
  - pattern: "VITALCHEK"
    name: "VitalChek (vital records)"
  # State revenue and tax bodies.
  - pattern: "DEPARTMENT OF REVENUE"
    name: "State Department of Revenue"
  - pattern: "FRANCHISE TAX BOARD"
    name: "California Franchise Tax Board"
  - pattern: "NYS DTF"
    name: "NY State Dept of Taxation and Finance"
  - pattern: "NYC DEPARTMENT OF FINANCE"
    name: "NYC Department of Finance"
  - pattern: "COMPTROLLER OF MARYLAND"
    name: "Comptroller of Maryland"
  - pattern: "TEXAS COMPTROLLER"
    name: "Texas Comptroller of Public Accounts"
  - pattern: "COMPTROLLER OF PUBLIC ACCOUNTS"
    name: "Comptroller of Public Accounts"
  - pattern: "DEPT OF TAXATION"
    name: "State Department of Taxation"
  - pattern: "DEPARTMENT OF TAXATION"
    name: "State Department of Taxation"
  - pattern: "STATE TAX COMMISSION"
    name: "State Tax Commission"
  - pattern: "SECRETARY OF STATE"
    name: "Secretary of State"
  # Vehicle and licensing.
  - pattern: "DEPT OF MOTOR VEHICLES"
    name: "Department of Motor Vehicles"
  - pattern: "DEPARTMENT OF MOTOR VEHICLES"
    name: "Department of Motor Vehicles"
  - pattern: "BUREAU OF MOTOR VEHICLES"
    name: "Bureau of Motor Vehicles"
  - pattern: 'regex:\bBMV\b'
    name: "Bureau of Motor Vehicles"
  - pattern: "MOTOR VEHICLE ADMINISTRATION"
    name: "Motor Vehicle Administration"
  - pattern: "DEPARTMENT OF LICENSING"
    name: "Department of Licensing"
  - pattern: "VEHICLE REGISTRATION"
    name: "Vehicle registration"
  # Toll roads are run by state, county and regional public authorities.
  - pattern: "TXTAG"
    name: "TxTag"
  - pattern: 'regex:\bNTTA\b'
    name: "North Texas Tollway Authority"
  - pattern: 'regex:\bHCTRA\b'
    name: "Harris County Toll Road Authority"
  - pattern: "PIKEPASS"
    name: "PIKEPASS"
  - pattern: 'regex:\bI-?PASS\b'
    name: "I-PASS (Illinois Tollway)"
  - pattern: "ILLINOIS TOLLWAY"
    name: "Illinois Tollway"
  - pattern: "PEACH PASS"
    name: "Peach Pass"
  - pattern: 'regex:\bWSDOT\b'
    name: "WSDOT Good To Go!"
  - pattern: "EXPRESSTOLL"
    name: "ExpressToll (E-470)"
  - pattern: "RIVERLINK"
    name: "RiverLink"
  - pattern: "TOLL AUTHORITY"
    name: "Toll authority"
  # Bare "TURNPIKE" is a street name and appears in ordinary merchant
  # names, so only the named public authorities are matched.
  - pattern: "TURNPIKE AUTHORITY"
    name: "Turnpike Authority"
  - pattern: "TURNPIKE COMMISSION"
    name: "Turnpike Commission"
  - pattern: "FLORIDA TURNPIKE"
    name: "Florida's Turnpike"
  - pattern: "OHIO TURNPIKE"
    name: "Ohio Turnpike"
  - pattern: "KANSAS TURNPIKE"
    name: "Kansas Turnpike Authority"
  - pattern: "MAINE TURNPIKE"
    name: "Maine Turnpike Authority"
  - pattern: "TOLLWAY"
    name: "Tollway authority"
  - pattern: "PORT AUTHORITY"
    name: "Port Authority"
  # Labour, benefits and human services.
  - pattern: "DEPT OF LABOR"
    name: "Department of Labor"
  - pattern: "DEPARTMENT OF LABOR"
    name: "Department of Labor"
  - pattern: "EMPLOYMENT SECURITY"
    name: "Employment Security Department"
  - pattern: "WORKFORCE COMMISSION"
    name: "State Workforce Commission"
  # Bare "EDD" is also a given name on a person-to-person transfer, so the
  # department is matched only through its spelled-out name.
  - pattern: "EMPLOYMENT DEVELOPMENT DEPARTMENT"
    name: "CA Employment Development Department"
  - pattern: "STATE DISBURSEMENT UNIT"
