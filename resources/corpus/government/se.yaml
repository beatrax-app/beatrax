    name: "Fordonsskatt"
  - pattern: "TRANGSELSKATT"
    name: "Trängselskatt"
  - pattern: "TRAFIKVERKET"
    name: "Trafikverket"
  # Word-bounded so it does not swallow KOMMUNAL and similar words.
  - pattern: "regex:\\bKOMMUN\\b"
