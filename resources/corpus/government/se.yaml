    name: "Domstolsverket"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: the myndighetsregister on skatteverket.se and
  # regeringen.se/myndigheter, forsakringskassan.se benefit names, csn.se,
  # kronofogden.se, transportstyrelsen.se, skr.se (kommuner och regioner)
  # and the courts' own domstol.se. Swedish domestic descriptors keep å/ä/ö,
  # so the accented form is listed alongside the folded one.
  - pattern: "FÖRSÄKRINGSKASSAN"
    name: "Försäkringskassan"
  - pattern: "ARBETSFÖRMEDLINGEN"
    name: "Arbetsförmedlingen"
