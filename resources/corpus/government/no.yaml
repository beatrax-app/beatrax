# Government / public-agency classification rules — Norway.
# (The NRK licence fee was abolished in 2020 and replaced by a tax, so there
# is no broadcasting-fee rule. The municipal Skatteoppkrever/Kemner offices
# were absorbed by Skatteetaten in 2020 and are likewise omitted.)
# Schema: see government/nl.yaml.
entries:
  - pattern: "SKATTEETATEN"
    name: "Skatteetaten"
  # "NAV" is a short token — word-bounded so it cannot match NAVIGO and the
  # like. It is by far the most common welfare counterparty in Norway.
  - pattern: "regex:\\bNAV\\b"
    name: "NAV"
  - pattern: "STATENS VEGVESEN"
    name: "Statens vegvesen"
  - pattern: "STATENS INNKREVINGSSENTRAL"
    name: "Statens innkrevingssentral"
  - pattern: "LANEKASSEN"
    name: "Lånekassen"
  # Norwegian municipalities bill property tax, waste and kindergarten fees.
  - pattern: "KOMMUNE"
  - pattern: "KARTVERKET"
    name: "Kartverket"
  - pattern: "HUSBANKEN"
    name: "Husbanken"
  - pattern: "regex:\\bHELFO\\b"
    name: "Helfo"
  - pattern: "TOLLETATEN"
    name: "Tolletaten"
  - pattern: "UTLENDINGSDIREKTORATET"
    name: "UDI"
  - pattern: "POLITIET"
    name: "Politiet"
  - pattern: "NAMSMANNEN"
    name: "Namsmannen"
  # Norwegian road tolls are billed by county-owned toll companies under the
  # national AutoPASS scheme.
  - pattern: "AUTOPASS"
    name: "AutoPASS (bompenger)"
  - pattern: "BOMPENGER"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: skatteetaten.no, nav.no (ytelser), lanekassen.no,
  # vegvesen.no/autopass.no, brreg.no, domstol.no, politiet.no,
  # helsenorge.no, the four regional health trusts and regjeringen.no's
  # register of statlige etater. Norwegian domestic descriptors keep æ/ø/å;
  # the folded form is listed too where SEPA transfers strip them.
  - pattern: "LÅNEKASSEN"
    name: "Lånekassen"
  - pattern: "FORSKUDDSSKATT"
    name: "Forskuddsskatt"
  - pattern: "RESTSKATT"
    name: "Restskatt"
