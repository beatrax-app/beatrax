# Government / public-agency classification rules — Türkiye.
# Patterns are ASCII-folded; note the dotless "ı" and "İ" both fold to "I".
# (Bare "MTV" is not used — it collides with the broadcaster; the spelled-out
# motor vehicle tax is used instead.)
#
# Sources: gib.gov.tr (which publishes the exact form "Gelir İdaresi
# Başkanlığı (GİB)"), hmb.gov.tr, ticaret.gov.tr, sgk.gov.tr, iskur.gov.tr,
# saglik.gov.tr, nvi.gov.tr, goc.gov.tr, tkgm.gov.tr, kgm.gov.tr,
# egm.gov.tr, adalet.gov.tr, osym.gov.tr, gsb.gov.tr (KYK), meb.gov.tr,
# toki.gov.tr, dask.gov.tr, tobb.org.tr, vgm.gov.tr, iski.istanbul,
# aski.gov.tr, izsu.gov.tr, turkiye.gov.tr service directory.
#
# Casing: the existing rows are ASCII-folded, which is what a SEPA or card
# descriptor carries. Domestic Turkish descriptors, however, keep İ/ı/Ş/Ğ/Ü/
# Ö/Ç, and PHP's Unicode case folding maps "İ" to "i" + a combining dot —
# so an ASCII pattern cannot match a dotted-capital descriptor. Every body
# whose name contains a Turkish-specific letter is therefore listed TWICE:
# ASCII-folded, and exactly as Türkiye prints it.
#
# Rejected as too collision-prone: "ESKİ" (Eskişehir's water utility, but
# also the ordinary adjective "old"), "EGO" (Ankara's transport authority
# and an English noun), "ODA" ("room"), "HARÇ" ("mortar" as well as "fee"),
# "CEZA" and "VERGİ" on their own, bare "MEB" and "YÖK" ("yok" means "none"),
# and "PTT" (state-owned but billing commercially).
# Schema: see government/nl.yaml.
entries:
  - pattern: "GELIR IDARESI"
    name: "Gelir İdaresi Başkanlığı"
  - pattern: "regex:\\bGIB\\b"
    name: "GİB"
  - pattern: "VERGI DAIRESI"
    name: "Vergi Dairesi"
  - pattern: "HAZINE VE MALIYE"
    name: "Hazine ve Maliye Bakanlığı"
  - pattern: "SOSYAL GUVENLIK KURUMU"
    name: "Sosyal Güvenlik Kurumu"
  - pattern: "regex:\\bSGK\\b"
    name: "SGK"
  # Municipalities bill water, waste and property tax — the single
  # highest-value entry on a Turkish statement.
  - pattern: "BELEDIYE"
  - pattern: "EMLAK VERGISI"
    name: "Emlak Vergisi"
  - pattern: "MOTORLU TASITLAR VERGISI"
    name: "Motorlu Taşıtlar Vergisi"
  - pattern: "TRAFIK CEZASI"
    name: "Trafik cezası"
  - pattern: "regex:\\bHGS\\b"
