# Government / public-agency classification rules — Bosnia and Herzegovina.
# BiH is decentralised: indirect tax is state-level (UIO/ITA) while direct
# tax, pensions and health run separately in the Federation, Republika
# Srpska and Brčko District — hence the Bosnian/Croatian ("Porezna",
# "Općina") and Serbian ("Poreska", "Opština") spellings side by side.
# (The RTV taksa is collected through telecom bills, not as its own
# counterparty, so there is no broadcasting-fee rule.)
#
# Sources: uino.gov.ba (which publishes the authority's name in all three
# official variants — "Uprava za indirektno / neizravno oporezivanje BiH"
# and "Управа за индиректно опорезивање"), pufbih.ba, poreskaupravars.org,
# fzmiopio.ba, fondpiors.org, zzo.ba, fzors.org, fzzz.ba, zzzrs.net,
# iddeea.gov.ba, granpol.gov.ba, sps.gov.ba, rgurs.org, fgu.com.ba,
# jpautoceste.ba, putevirs.com, bdcentral.net (Brčko District), komorabih.ba.
#
# Layers: the four public purses collect separately, so state (UINO,
# Ministarstvo finansija i trezora, IDDEEA, Granična policija), Federation
# (Porezna uprava FBiH, federalni zavodi, kantoni/županije), Republika
# Srpska (Poreska uprava RS, Fond PIO RS, Fond zdravstvenog osiguranja RS)
# and Brčko District each get their own rows.
# Script coverage: RS institutions invoice in Cyrillic and the Federation
# in Latin, so RS bodies carry both forms as plain substrings; the
# Bosnian/Croatian/Serbian ijekavian spellings are also doubled where the
# distinctive word carries a diacritic.
# Rejected as too collision-prone: bare "UIO" and "RS", "TAKSA" alone,
# "DISTRIKT" alone, and "FOND" unqualified.
# Schema: see government/nl.yaml.
entries:
  - pattern: "UPRAVA ZA INDIREKTNO OPOREZIVANJE"
    name: "UIO BiH"
  - pattern: "UPRAVA ZA NEIZRAVNO OPOREZIVANJE"
    name: "UIO BiH"
  - pattern: "POREZNA UPRAVA"
    name: "Porezna uprava FBiH"
  - pattern: "PORESKA UPRAVA"
    name: "Poreska uprava RS"
  - pattern: "ZAVOD ZA PENZIJSKO I INVALIDSKO OSIGURANJE"
    name: "Zavod za PIO"
  - pattern: "regex:\\bFOND PIO\\b"
    name: "Fond PIO RS"
  - pattern: "ZAVOD ZDRAVSTVENOG OSIGURANJA"
    name: "Zavod zdravstvenog osiguranja"
  - pattern: "ZAVOD ZA ZAPOSLJAVANJE"
    name: "Zavod za zapošljavanje"
  - pattern: "OPCINA"
  - pattern: "OPSTINA"
  - pattern: "GRADSKA UPRAVA"
    name: "Gradska uprava"
  - pattern: "regex:\\bMUP\\b"
    name: "MUP"
  - pattern: "REGISTRACIJA VOZILA"
    name: "Registracija vozila"
  - pattern: "AUTOCESTE FBIH"
    name: "JP Autoceste FBiH"
  - pattern: "GEODETSKA UPRAVA"
    name: "Geodetska uprava"
  - pattern: "ADMINISTRATIVNA TAKSA"
    name: "Administrativna taksa"
  # --- State level (BiH) -----------------------------------------------------
  - pattern: "УПРАВА ЗА ИНДИРЕКТНО ОПОРЕЗИВАЊЕ"
    name: "UIO BiH"
  - pattern: 'regex:\bUINO\b'
    name: "UIO BiH"
  - pattern: "MINISTARSTVO FINANSIJA I TREZORA"
    name: "Ministarstvo finansija i trezora BiH"
  # IDDEEA issues ID cards, passports and vehicle registration documents.
  - pattern: "AGENCIJA ZA IDENTIFIKACIONE DOKUMENTE"
    name: "IDDEEA"
  - pattern: 'regex:\bIDDEEA\b'
    name: "IDDEEA"
  - pattern: "GRANICNA POLICIJA"
    name: "Granična policija BiH"
  - pattern: "GRANIČNA POLICIJA"
    name: "Granična policija BiH"
  - pattern: "SLUZBA ZA POSLOVE SA STRANCIMA"
    name: "Služba za poslove sa strancima"
  - pattern: "VANJSKOTRGOVINSKA KOMORA"
    name: "Vanjskotrgovinska komora BiH"
  # --- Federation of Bosnia and Herzegovina -----------------------------------
  - pattern: "POREZNA UPRAVA FEDERACIJE"
    name: "Porezna uprava FBiH"
  - pattern: "FEDERALNO MINISTARSTVO FINANSIJA"
    name: "Federalno ministarstvo finansija"
  - pattern: "FEDERALNI ZAVOD ZA PENZIJSKO I INVALIDSKO OSIGURANJE"
