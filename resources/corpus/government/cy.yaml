# Government / public-agency classification rules — Cyprus.
# Cyprus is bilingual: banks print Greek and Latin forms of the same body,
# so the high-value entries are listed in both scripts.
# (JCC Smart is a payment aggregator, not a public body — not listed.)
#
# Sources: gov.cy service directory, tax.gov.cy (Τμήμα Φορολογίας),
# mof.gov.cy, customs.gov.cy, mlsi.gov.cy (Υπηρεσίες Κοινωνικών
# Ασφαλίσεων and Υπηρεσίες Κοινωνικής Ευημερίας), gesy.org.cy,
# hio.org.cy, okypy.gov.cy, rtd.gov.cy, police.gov.cy, dls.gov.cy,
# moi.gov.cy (Τμήμα Αρχείου Πληθυσμού και Μετανάστευσης), wdd.gov.cy,
# ucy.ac.cy, cut.ac.cy, ouc.ac.cy, ccci.org.cy, etek.org.cy,
# cyprusbarassociation.org, hrdauth.org.cy, cybc.com.cy.
#
# Script coverage: every body is listed in Greek AND English, because the
# Republic issues both and Cypriot banks re-print whichever the creditor
# supplied. Every Greek entry is a plain substring, never a `regex:` — the
# matcher has no /u flag, so a Greek term inside a regex would fold on one
# casing only.
# Rejected as too collision-prone: "ΤΜΗΜΑ" ("department/section" on its
# own), "ΡΙΚ", "ΦΠΑ", "ΕΤΕΚ" and any other bare three-letter Greek token,
# and "GENERAL HOSPITAL" (private hospitals trade under it too).
# Schema: see government/nl.yaml.
entries:
  - pattern: "TAX DEPARTMENT"
    name: "Tax Department"
  - pattern: "ΤΜΗΜΑ ΦΟΡΟΛΟΓΙΑΣ"
    name: "Τμήμα Φορολογίας"
  - pattern: "TAXISNET"
    name: "TAXISnet"
  - pattern: "SOCIAL INSURANCE SERVICES"
    name: "Social Insurance Services"
  - pattern: "ΥΠΗΡΕΣΙΕΣ ΚΟΙΝΩΝΙΚΩΝ ΑΣΦΑΛΙΣΕΩΝ"
    name: "Υπηρεσίες Κοινωνικών Ασφαλίσεων"
  # General Healthcare System, run by the Health Insurance Organisation.
  - pattern: "regex:\\bGESY\\b"
    name: "GESY (GHS)"
  - pattern: "ROAD TRANSPORT DEPARTMENT"
    name: "Road Transport Department"
  - pattern: "ΤΜΗΜΑ ΟΔΙΚΩΝ ΜΕΤΑΦΟΡΩΝ"
    name: "Τμήμα Οδικών Μεταφορών"
  - pattern: "ΤΕΛΗ ΚΥΚΛΟΦΟΡΙΑΣ"
    name: "Τέλη κυκλοφορίας"
  # Municipalities and community councils bill rates and refuse charges.
  - pattern: "ΔΗΜΟΣ"
  - pattern: "MUNICIPALITY OF"
  - pattern: "COMMUNITY COUNCIL"
  - pattern: "WATER BOARD"
    name: "Water Board"
  - pattern: "ΣΥΜΒΟΥΛΙΟ ΥΔΑΤΟΠΡΟΜΗΘΕΙΑΣ"
    name: "Συμβούλιο Υδατοπρομήθειας"
  - pattern: "SEWERAGE BOARD"
    name: "Sewerage Board"
  - pattern: "DEPARTMENT OF LANDS AND SURVEYS"
    name: "Department of Lands and Surveys"
  - pattern: "CIVIL REGISTRY AND MIGRATION"
    name: "Civil Registry and Migration Department"
  # --- Tax and customs -------------------------------------------------------
  - pattern: "TAX FOR ALL"
    name: "Tax For All (Tax Department portal)"
  - pattern: "ΦΟΡΟΣ ΕΙΣΟΔΗΜΑΤΟΣ"
    name: "Φόρος εισοδήματος"
  - pattern: "CUSTOMS AND EXCISE"
    name: "Department of Customs and Excise"
  - pattern: "ΤΜΗΜΑ ΤΕΛΩΝΕΙΩΝ"
    name: "Τμήμα Τελωνείων"
  - pattern: "MINISTRY OF FINANCE"
    name: "Ministry of Finance"
  - pattern: "ΥΠΟΥΡΓΕΙΟ ΟΙΚΟΝΟΜΙΚΩΝ"
    name: "Υπουργείο Οικονομικών"
  - pattern: "TREASURY OF THE REPUBLIC"
    name: "Treasury of the Republic"
  - pattern: "ΓΕΝΙΚΟ ΛΟΓΙΣΤΗΡΙΟ"
    name: "Γενικό Λογιστήριο"
  # --- Social insurance, welfare and benefits ----------------------------------
  - pattern: "SOCIAL INSURANCE CONTRIBUTIONS"
    name: "Social insurance contributions"
  - pattern: "ΕΙΣΦΟΡΕΣ ΚΟΙΝΩΝΙΚΩΝ ΑΣΦΑΛΙΣΕΩΝ"
    name: "Εισφορές Κοινωνικών Ασφαλίσεων"
  - pattern: "ΤΑΜΕΙΟ ΚΟΙΝΩΝΙΚΩΝ ΑΣΦΑΛΙΣΕΩΝ"
    name: "Ταμείο Κοινωνικών Ασφαλίσεων"
  - pattern: "SOCIAL WELFARE SERVICES"
    name: "Social Welfare Services"
  - pattern: "ΥΠΗΡΕΣΙΕΣ ΚΟΙΝΩΝΙΚΗΣ ΕΥΗΜΕΡΙΑΣ"
    name: "Υπηρεσίες Κοινωνικής Ευημερίας"
  - pattern: "WELFARE BENEFITS ADMINISTRATION"
    name: "Welfare Benefits Administration Service"
  - pattern: "ΥΠΗΡΕΣΙΑ ΔΙΑΧΕΙΡΙΣΗΣ ΕΠΙΔΟΜΑΤΩΝ ΠΡΟΝΟΙΑΣ"
    name: "Υπηρεσία Διαχείρισης Επιδομάτων Πρόνοιας"
  - pattern: "GRANTS AND BENEFITS SERVICE"
