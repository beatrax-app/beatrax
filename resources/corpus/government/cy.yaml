  - pattern: "ΑΡΧΗ ΑΝΑΠΤΥΞΗΣ ΑΝΘΡΩΠΙΝΟΥ ΔΥΝΑΜΙΚΟΥ"
    name: "ΑνΑΔ"
  # --- Health --------------------------------------------------------------------
  - pattern: "ΓΕΣΥ"
    name: "ΓεΣΥ (GHS)"
  - pattern: "HEALTH INSURANCE ORGANISATION"
