# Government / public-agency classification rules — Denmark.
# (The Danish media licence was abolished in 2022 — no DR Licens rule.)
# (Bare "SU" for the student grant is two characters and unusable as a
# pattern; the paying agency is matched instead.)
# Schema: see government/nl.yaml.
entries:
  - pattern: "SKATTESTYRELSEN"
    name: "Skattestyrelsen"
  - pattern: "GAELDSSTYRELSEN"
    name: "Gældsstyrelsen"
  - pattern: "SKATTEFORVALTNINGEN"
    name: "Skatteforvaltningen"
  - pattern: "MOTORSTYRELSEN"
    name: "Motorstyrelsen"
  - pattern: "TOLDSTYRELSEN"
    name: "Toldstyrelsen"
  - pattern: "VURDERINGSSTYRELSEN"
    name: "Vurderingsstyrelsen"
  # Udbetaling Danmark pays pensions, housing and child benefit.
  - pattern: "UDBETALING DANMARK"
    name: "Udbetaling Danmark"
  - pattern: "regex:\\bATP\\b"
    name: "ATP"
  - pattern: "UDDANNELSES- OG FORSKNINGSSTYRELSEN"
    name: "Uddannelses- og Forskningsstyrelsen (SU)"
  # Danish municipalities bill property tax, childcare and waste.
  - pattern: "KOMMUNE"
  - pattern: "BORGERSERVICE"
  - pattern: "regex:EJENDOMSSKAT|GRUNDSKYLD"
    name: "Ejendomsskat"
  - pattern: "FAERDSELSSTYRELSEN"
    name: "Færdselsstyrelsen"
  - pattern: "POLITIET"
    name: "Politiet"
  - pattern: "FAMILIERETSHUSET"
    name: "Familieretshuset"
  - pattern: "DOMSTOLSSTYRELSEN"
    name: "Domstolsstyrelsen"
  - pattern: "TINGLYSNING"
    name: "Tinglysningsafgift"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: skat.dk (the Skatteforvaltningen agency list), borger.dk
  # (Udbetaling Danmark benefit names), virk.dk, domstol.dk, politi.dk,
  # danskeregioner.dk, sundogbaelt.dk and the state agency register on
  # stm.dk. Danish domestic descriptors keep æ/ø/å; SEPA credit transfers
  # fold them to ae/oe/aa, so both forms are listed where a word carries one.
  - pattern: "GÆLDSSTYRELSEN"
    name: "Gældsstyrelsen"
  - pattern: "SKAT.DK"
    name: "Skatteforvaltningen"
  - pattern: "SKATTEKONTO"
    name: "Skattekontoen"
  - pattern: "UDVIKLINGS- OG FORENKLINGSSTYRELSEN"
    name: "Udviklings- og Forenklingsstyrelsen"
  - pattern: "ADMINISTRATIONS- OG SERVICESTYRELSEN"
    name: "Administrations- og Servicestyrelsen"
  # "A-skat" is the withheld income tax; bare "SKAT" is an ordinary Danish
  # word (and English "skat" appears in merchant names), so it is not used.
  - pattern: 'regex:\bA-SKAT\b'
    name: "A-skat"
  - pattern: "AM-BIDRAG"
    name: "Arbejdsmarkedsbidrag"
  - pattern: "EJENDOMSVAERDISKAT"
    name: "Ejendomsværdiskat"
  - pattern: "EJENDOMSVÆRDISKAT"
    name: "Ejendomsværdiskat"
  - pattern: "TINGLYSNINGSRETTEN"
    name: "Tinglysningsretten"
  - pattern: "LONMODTAGERNES GARANTIFOND"
    name: "Lønmodtagernes Garantifond"
  - pattern: "LØNMODTAGERNES GARANTIFOND"
    name: "Lønmodtagernes Garantifond"
  - pattern: "FERIEKONTO"
    name: "FerieKonto"
  - pattern: "ARBEJDSMARKEDETS ERHVERVSSIKRING"
    name: "Arbejdsmarkedets Erhvervssikring"
  - pattern: "FOLKEPENSION"
    name: "Folkepension (Udbetaling Danmark)"
  - pattern: "FORTIDSPENSION"
    name: "Førtidspension"
  - pattern: "FØRTIDSPENSION"
    name: "Førtidspension"
  - pattern: "BORNE- OG UNGEYDELSE"
    name: "Børne- og ungeydelse"
  - pattern: "BØRNE- OG UNGEYDELSE"
    name: "Børne- og ungeydelse"
  - pattern: "BOLIGSTOTTE"
    name: "Boligstøtte"
  - pattern: "BOLIGSTØTTE"
    name: "Boligstøtte"
  - pattern: "KONTANTHJAELP"
    name: "Kontanthjælp"
  - pattern: "KONTANTHJÆLP"
    name: "Kontanthjælp"
  - pattern: "SYGEDAGPENGE"
    name: "Sygedagpenge"
  - pattern: "BARSELSDAGPENGE"
    name: "Barselsdagpenge"
  # The five regions run the hospitals and bill patient charges.
  - pattern: "REGION HOVEDSTADEN"
    name: "Region Hovedstaden"
  - pattern: "REGION MIDTJYLLAND"
    name: "Region Midtjylland"
  - pattern: "REGION SYDDANMARK"
    name: "Region Syddanmark"
  - pattern: "REGION SJAELLAND"
    name: "Region Sjælland"
  - pattern: "REGION SJÆLLAND"
    name: "Region Sjælland"
  - pattern: "REGION NORDJYLLAND"
    name: "Region Nordjylland"
  - pattern: "SUNDHEDSKORT"
    name: "Sundhedskort"
  # Municipal waste and water. Bare "RENOVATION" is the English word for
  # building works, so only the Danish compound "DAGRENOVATION" is used.
  - pattern: "DAGRENOVATION"
    name: "Dagrenovation"
  - pattern: "VESTFORBRAENDING"
    name: "Vestforbrænding"
  - pattern: "VESTFORBRÆNDING"
    name: "Vestforbrænding"
  - pattern: 'regex:\bHOFOR\b'
    name: "HOFOR"
  - pattern: "AARHUS VAND"
    name: "Aarhus Vand"
  - pattern: "NOVAFOS"
    name: "Novafos"
  - pattern: "SPILDEVAND"
    name: "Spildevandsafgift"
  - pattern: "NUMMERPLADE"
    name: "Nummerpladegebyr (Motorstyrelsen)"
  - pattern: "VAEGTAFGIFT"
    name: "Vægtafgift"
  - pattern: "VÆGTAFGIFT"
    name: "Vægtafgift"
  - pattern: "GRON EJERAFGIFT"
    name: "Grøn ejerafgift"
  - pattern: "GRØN EJERAFGIFT"
    name: "Grøn ejerafgift"
  # Sund & Bælt is the state company operating the Great Belt and Øresund
  # crossings; BroBizz A/S is its tag subsidiary.
  - pattern: "SUND OG BAELT"
    name: "Sund & Bælt"
  - pattern: "SUND OG BÆLT"
    name: "Sund & Bælt"
  - pattern: "STOREBAELT"
    name: "Storebælt (Sund & Bælt)"
  - pattern: "STOREBÆLT"
    name: "Storebælt (Sund & Bælt)"
  - pattern: "ORESUNDSBRON"
    name: "Øresundsbron"
  - pattern: "ØRESUNDSBRON"
    name: "Øresundsbron"
  - pattern: "BROBIZZ"
    name: "BroBizz"
  - pattern: "FÆRDSELSSTYRELSEN"
    name: "Færdselsstyrelsen"
  - pattern: "PARKERINGSAFGIFT"
    name: "Parkeringsafgift"
  - pattern: "RIGSPOLITIET"
    name: "Rigspolitiet"
  # "POLITI" on its own is a substring of English "politics"/"political",
  # so only the definite form "POLITIET" and named units are matched.
  - pattern: "DANMARKS DOMSTOLE"
    name: "Danmarks Domstole"
  - pattern: "OSTRE LANDSRET"
    name: "Østre Landsret"
  - pattern: "ØSTRE LANDSRET"
    name: "Østre Landsret"
  - pattern: "VESTRE LANDSRET"
    name: "Vestre Landsret"
  - pattern: "HOJESTERET"
    name: "Højesteret"
  - pattern: "HØJESTERET"
    name: "Højesteret"
  - pattern: "KRIMINALFORSORGEN"
    name: "Kriminalforsorgen"
  - pattern: "ANKLAGEMYNDIGHEDEN"
    name: "Anklagemyndigheden"
  # Statsforvaltningen closed in 2019; older statements still carry it.
  - pattern: "STATSFORVALTNINGEN"
    name: "Statsforvaltningen"
  - pattern: "ERHVERVSSTYRELSEN"
    name: "Erhvervsstyrelsen"
  - pattern: "VIRK.DK"
    name: "Virk (Erhvervsstyrelsen)"
  - pattern: "SIKKERHEDSSTYRELSEN"
    name: "Sikkerhedsstyrelsen"
  - pattern: "MILJOSTYRELSEN"
    name: "Miljøstyrelsen"
  - pattern: "MILJØSTYRELSEN"
    name: "Miljøstyrelsen"
  - pattern: "NATURSTYRELSEN"
    name: "Naturstyrelsen"
  - pattern: "LANDBRUGSSTYRELSEN"
    name: "Landbrugsstyrelsen"
  - pattern: "FODEVARESTYRELSEN"
    name: "Fødevarestyrelsen"
  - pattern: "FØDEVARESTYRELSEN"
    name: "Fødevarestyrelsen"
  - pattern: "ARBEJDSTILSYNET"
    name: "Arbejdstilsynet"
  - pattern: "STYRELSEN FOR ARBEJDSMARKED OG REKRUTTERING"
    name: "STAR"
  - pattern: "UDLAENDINGESTYRELSEN"
    name: "Udlændingestyrelsen"
  - pattern: "UDLÆNDINGESTYRELSEN"
    name: "Udlændingestyrelsen"
  # Bare "SIRI" collides with the Apple assistant, so SIRI is matched only
  # through its spelled-out name.
  - pattern: "STYRELSEN FOR INTERNATIONAL REKRUTTERING"
    name: "SIRI"
  - pattern: "GEODATASTYRELSEN"
    name: "Geodatastyrelsen"
  - pattern: "DANMARKS STATISTIK"
    name: "Danmarks Statistik"
  - pattern: "NEMKONTO"
    name: "NemKonto"
  - pattern: "KIRKESKAT"
    name: "Kirkeskat"
  - pattern: "VEJDIREKTORATET"
    name: "Vejdirektoratet"
  - pattern: "TRAFIKSTYRELSEN"
    name: "Trafikstyrelsen"
  - pattern: "BANEDANMARK"
    name: "Banedanmark"
  - pattern: "ENERGISTYRELSEN"
    name: "Energistyrelsen"
  - pattern: "SOCIALSTYRELSEN"
    name: "Socialstyrelsen"
  - pattern: "SUNDHEDSSTYRELSEN"
    name: "Sundhedsstyrelsen"
  - pattern: "STYRELSEN FOR PATIENTSIKKERHED"
    name: "Styrelsen for Patientsikkerhed"
  - pattern: "DIGITALISERINGSSTYRELSEN"
    name: "Digitaliseringsstyrelsen"
  - pattern: "KOBENHAVNS UNIVERSITET"
    name: "Københavns Universitet"
  - pattern: "KØBENHAVNS UNIVERSITET"
    name: "Københavns Universitet"
  - pattern: "AARHUS UNIVERSITET"
    name: "Aarhus Universitet"
  - pattern: "SYDDANSK UNIVERSITET"
    name: "Syddansk Universitet"
  - pattern: "AALBORG UNIVERSITET"
    name: "Aalborg Universitet"
  - pattern: "DANMARKS TEKNISKE UNIVERSITET"
    name: "Danmarks Tekniske Universitet"
