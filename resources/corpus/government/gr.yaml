# Government / public-agency classification rules — Greece.
# (Bare "ΔΟΥ" and "ΙΚΑ" are three-letter Greek tokens that collide inside
# ordinary words and are deliberately omitted. The ΕΡΤ levy and the
# municipal δημοτικά τέλη ride on the electricity bill rather than appearing
# as their own counterparty, so neither is listed.)
#
# Sources: aade.gr, gsis.gr (TAXISnet), efka.gov.gr, keao.gov.gr,
# opeka.gr, dypa.gov.gr, eopyy.gov.gr, eody.gov.gr, ktimatologio.gr,
# gsis.gr/e-paravolo, hellenicpolice.gr, fireservice.gr, hcg.gr,
# minedu.gov.gr, iky.gr, uoa.gr, auth.gr, ntua.gr, eap.gr, eydap.gr,
# eyath.gr, businessportal.gr (ΓΕΜΗ), tee.gr, opekepe.gr, elga.gr,
# kep.gov.gr, gov.gr service directory.
#
# Script: every Greek term is a plain substring — never a `regex:` — because
# the matcher delimits regex bodies without /u, so Greek case folding and
# \b would both misbehave inside one. Only the ASCII transliterations that
# Greek banks genuinely print (AADE, EFKA, EYDAP, EYATH, EOPYY, KEAO, DYPA,
# ENFIA) use the regex path.
#
# Accents: Greek upper-case drops accents, which is what a descriptor
# normally carries — but a mixed-case creditor name ("Δήμος Αθηναίων") keeps
# them, and mb_stripos folds case only, not accents, so "ΔΗΜΟΣ" would miss
# it. The highest-value single-word terms are therefore listed a second
# time in their accented form.
#
# Rejected as too collision-prone: bare "ΔΟΥ", "ΙΚΑ", "ΤΑΠ", "ΕΡΤ", "ΤΕΕ",
# "ΕΣΥ", "ΦΠΑ" and every other three-letter Greek token; "ΚΤΕΟ" (it is a
# substring of the private "ΙΚΤΕΟ" chains); "ΠΡΟΣΤΙΜΟ" on its own; the
# Latin "OPEKA" (it is the ordinary word for "brick" in the Balkans); and
# "ΠΑΙΔΙΚΟΣ ΣΤΑΘΜΟΣ" (private nurseries use the identical words).
# Schema: see government/nl.yaml.
entries:
  - pattern: "regex:\\bAADE\\b"
    name: "ΑΑΔΕ (AADE)"
  - pattern: "regex:\\bEFKA\\b"
    name: "e-EFKA"
  - pattern: "ΑΑΔΕ"
    name: "ΑΑΔΕ (AADE)"
  - pattern: "ΕΦΚΑ"
    name: "e-ΕΦΚΑ"
  - pattern: "ΕΦΟΡΙΑ"
    name: "Εφορία"
  - pattern: "TAXISNET"
    name: "TAXISnet"
  - pattern: "ΕΝΦΙΑ"
    name: "ΕΝΦΙΑ"
  - pattern: "ΤΕΛΗ ΚΥΚΛΟΦΟΡΙΑΣ"
    name: "Τέλη κυκλοφορίας"
  # Municipalities bill water, cemetery and permit charges directly.
  - pattern: "ΔΗΜΟΣ"
  - pattern: "ΟΠΕΚΑ"
    name: "ΟΠΕΚΑ"
  # ΟΑΕΔ was renamed ΔΥΠΑ in 2022; both still appear.
  - pattern: "ΔΥΠΑ"
    name: "ΔΥΠΑ"
  - pattern: "ΟΑΕΔ"
    name: "ΔΥΠΑ (πρώην ΟΑΕΔ)"
