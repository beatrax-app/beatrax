# Government / public-agency classification rules — Portugal.
# (Tax/"Finanças" is usually paid via Multibanco reference, which rarely
# shows the agency name on the descriptor — Segurança Social is the reliably
# named one; tax is often better matched by counterparty IBAN.)
# (The RTP contribuição audiovisual rides on the electricity bill and never
# appears as its own counterparty, so it is not listed. Via Verde is a
# private toll operator and is likewise omitted.)
#
# Sources: portaldasfinancas.gov.pt and info.portaldasfinancas.gov.pt,
# seg-social.pt, seg-social.pt/segurança-social-direta, cga.pt, sns.gov.pt,
# adse.pt, iefp.pt, imt-ip.pt, irn.justica.gov.pt, ansr.pt, igfej.mj.pt,
# dgaj.justica.gov.pt, psp.pt, gnr.pt, asae.gov.pt, dgterritorio.gov.pt,
# aima.gov.pt (the agency that took over the SEF's citizen functions in
# 2023), dges.gov.pt, igcp.pt, oa.pt, ordemengenheiros.pt, ordemdosmedicos
# .pt, occ.pt, iapmei.pt, infraestruturasdeportugal.pt, adp.pt (Águas de
# Portugal group), epal.pt, bportugal.pt.
#
# Diacritics: Multibanco "pagamentos ao Estado" descriptors arrive
# ASCII-folded and upper-cased, but SEPA direct debits and homebanking
# transfers keep ã/ç/é/í/ó/ú. Every body whose name carries a diacritic is
# therefore listed twice — folded and as written.
# Rejected as too collision-prone: bare "IVA" (an ordinary word and a given
# name across the Nordics and the Balkans), "PSP" (the games console),
# "GNR" (also a well-known band), "AT", "SEF", "CGA", "ARS" and "SNS" as
# bare tokens, and "ORDEM", "CAMARA", "JUNTA", "MUNICIPIO", "TRIBUNAL",
# "REGISTO" and "TESOURO" on their own — only the qualified forms are used.
# Schema: see government/nl.yaml.
entries:
  - pattern: "SEGURANCA SOCIAL"
    name: "Segurança Social"
  - pattern: "AUTORIDADE TRIBUTARIA"
    name: "Autoridade Tributária e Aduaneira"
  - pattern: "regex:\\bFINANCAS\\b"
    name: "Finanças"
  - pattern: "regex:\\bIMI\\b|\\bIUC\\b"
    name: "IMI / IUC"
  # Câmaras municipais and juntas de freguesia are the local counterparties.
  - pattern: "CAMARA MUNICIPAL"
  - pattern: "JUNTA DE FREGUESIA"
  - pattern: "INSTITUTO DA MOBILIDADE E DOS TRANSPORTES"
    name: "IMT"
