# Government / public-agency classification rules — Finland.
# (The Yle licence fee became a tax in 2013, so there is no broadcasting-fee
# rule. Työttömyyskassat are private associations and are not listed.)
# Schema: see government/nl.yaml.
entries:
  - pattern: "VEROHALLINTO"
    name: "Verohallinto"
  - pattern: "regex:\\bKELA\\b"
    name: "Kela"
  - pattern: "regex:\\bTULLI\\b"
    name: "Tulli"
  - pattern: "TRAFICOM"
    name: "Traficom"
  - pattern: "AJONEUVOVERO"
    name: "Ajoneuvovero"
  - pattern: "KIINTEISTOVERO"
    name: "Kiinteistövero"
  # Finnish municipalities bill water, waste and daycare fees; bilingual
  # areas print the Swedish "kommun" instead.
  - pattern: "regex:\\bKUNTA\\b"
  - pattern: "KAUPUNKI"
  - pattern: "ULOSOTTOLAITOS"
    name: "Ulosottolaitos"
  # The Legal Register Centre collects court fines.
  - pattern: "OIKEUSREKISTERIKESKUS"
    name: "Oikeusrekisterikeskus"
  - pattern: "DIGI- JA VAESTOTIETOVIRASTO"
    name: "Digi- ja väestötietovirasto"
  - pattern: "MAANMITTAUSLAITOS"
    name: "Maanmittauslaitos"
  - pattern: "MAAHANMUUTTOVIRASTO"
    name: "Maahanmuuttovirasto"
  - pattern: "ELAKETURVAKESKUS"
    name: "Eläketurvakeskus"
  - pattern: "regex:\\bKEVA\\b"
    name: "Keva"
  - pattern: "POLIISI"
    name: "Poliisi"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: vero.fi, kela.fi (etuudet), suomi.fi's viranomaishakemisto,
  # traficom.fi, oikeus.fi, poliisi.fi, dvv.fi, hyvinvointialueet.fi and
  # valtioneuvosto.fi's list of virastot. Finnish domestic descriptors keep
  # ä/ö, so the accented form is listed next to the folded one.
  - pattern: "VEROTOIMISTO"
    name: "Verotoimisto"
  - pattern: "VERO.FI"
    name: "Verohallinto"
  - pattern: "OMAVERO"
    name: "OmaVero (Verohallinto)"
