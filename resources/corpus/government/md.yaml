# Government / public-agency classification rules — Moldova.
# Moldova writes Romanian in Latin script; patterns are diacritic-folded, as
# elsewhere in this corpus.
# (Bare "SFS" and "ASP" are too collision-prone — the full agency names are
# used instead.)
# Schema: see government/nl.yaml.
entries:
  - pattern: "SERVICIUL FISCAL DE STAT"
    name: "Serviciul Fiscal de Stat"
  - pattern: "SERVICIUL VAMAL"
    name: "Serviciul Vamal"
  - pattern: "CASA NATIONALA DE ASIGURARI SOCIALE"
    name: "CNAS"
  - pattern: "regex:\\bCNAS\\b"
    name: "CNAS"
  - pattern: "COMPANIA NATIONALA DE ASIGURARI IN MEDICINA"
    name: "CNAM"
  - pattern: "regex:\\bCNAM\\b"
    name: "CNAM"
  # ASP is the merged one-stop agency: ID cards, passports, vehicle
  # registration, civil status and cadastre.
  - pattern: "AGENTIA SERVICII PUBLICE"
    name: "Agenția Servicii Publice"
  - pattern: "AGENTIA NATIONALA PENTRU OCUPAREA FORTEI DE MUNCA"
    name: "ANOFM"
  # The mayoralty is the local-government counterparty in Moldova.
  - pattern: "PRIMARIA"
  - pattern: "CONSILIUL RAIONAL"
  - pattern: "IMPOZIT PE BUNURILE IMOBILIARE"
    name: "Impozit pe bunurile imobiliare"
  - pattern: "TAXA DE STAT"
    name: "Taxa de stat"
  - pattern: "VINIETA"
    name: "Vinieta"
  - pattern: "INSPECTORATUL GENERAL AL POLITIEI"
    name: "Inspectoratul General al Poliției"
  - pattern: "MINISTERUL FINANTELOR"
    name: "Ministerul Finanțelor"
  - pattern: "TREZORERIA DE STAT"
    name: "Trezoreria de Stat"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: sfs.md, customs.gov.md, cnas.md, cnam.md, asp.gov.md,
  # anofm.md, politia.md, instante.justice.md, chisinau.md and mf.gov.md.
  # Two script conventions genuinely appear on Moldovan statements: the
  # Latin Romanian form (with and without diacritics) and, on Russian-
  # language statements from MAIB/MICB and friends, the Russian name of the
  # same body. Both are listed, always as plain substrings.
  - pattern: "AGENȚIA SERVICII PUBLICE"
    name: "Agenția Servicii Publice"
  - pattern: "INSPECTORATUL GENERAL AL POLIȚIEI"
    name: "Inspectoratul General al Poliției"
  - pattern: "MINISTERUL FINANȚELOR"
    name: "Ministerul Finanțelor"
  - pattern: "VINIETĂ"
    name: "Vinieta"
  - pattern: "IMPOZIT PE VENIT"
    name: "Impozit pe venit"
  - pattern: "CONTRIBUTII DE ASIGURARI SOCIALE DE STAT"
    name: "Contribuții de asigurări sociale de stat"
  - pattern: "CONTRIBUȚII DE ASIGURĂRI SOCIALE DE STAT"
    name: "Contribuții de asigurări sociale de stat"
  - pattern: "PRIMA DE ASIGURARE OBLIGATORIE DE ASISTENTA MEDICALA"
    name: "Prima de asigurare obligatorie de asistență medicală"
  - pattern: "PRIMA DE ASIGURARE OBLIGATORIE DE ASISTENȚĂ MEDICALĂ"
    name: "Prima de asigurare obligatorie de asistență medicală"
  - pattern: "CASA TERITORIALA DE ASIGURARI SOCIALE"
    name: "Casa Teritorială de Asigurări Sociale"
  - pattern: "CASA TERITORIALĂ DE ASIGURĂRI SOCIALE"
    name: "Casa Teritorială de Asigurări Sociale"
  - pattern: "INDEMNIZATIE PENTRU COPII"
    name: "Indemnizație pentru copii"
  - pattern: "INDEMNIZAȚIE PENTRU COPII"
    name: "Indemnizație pentru copii"
  - pattern: "CAMERA INREGISTRARII DE STAT"
    name: "Camera Înregistrării de Stat (acum ASP)"
  - pattern: "CAMERA ÎNREGISTRĂRII DE STAT"
    name: "Camera Înregistrării de Stat (acum ASP)"
  - pattern: "REGISTRUL BUNURILOR IMOBILE"
    name: "Registrul bunurilor imobile"
  - pattern: "CADASTRU"
    name: "Cadastru"
  - pattern: "CURTEA DE APEL CHISINAU"
    name: "Curtea de Apel Chișinău"
  - pattern: "CURTEA DE APEL CHIȘINĂU"
    name: "Curtea de Apel Chișinău"
  - pattern: "AMENDA DE CIRCULATIE"
    name: "Amendă de circulație"
  - pattern: "AMENDĂ DE CIRCULAȚIE"
    name: "Amendă de circulație"
  - pattern: "INSPECTORATUL NATIONAL DE PATRULARE"
    name: "Inspectoratul Național de Patrulare"
  - pattern: "INSPECTORATUL NAȚIONAL DE PATRULARE"
    name: "Inspectoratul Național de Patrulare"
  - pattern: "BIROUL MIGRATIE SI AZIL"
    name: "Biroul Migrație și Azil"
  - pattern: "BIROUL MIGRAȚIE ȘI AZIL"
    name: "Biroul Migrație și Azil"
  - pattern: "AGENTIA NATIONALA TRANSPORT AUTO"
    name: "Agenția Națională Transport Auto"
  - pattern: "AGENȚIA NAȚIONALĂ TRANSPORT AUTO"
    name: "Agenția Națională Transport Auto"
  - pattern: "PRIMARIA MUNICIPIULUI CHISINAU"
    name: "Primăria municipiului Chișinău"
  - pattern: "PRIMĂRIA MUNICIPIULUI CHIȘINĂU"
    name: "Primăria municipiului Chișinău"
  - pattern: "CONSILIUL MUNICIPAL"
    name: "Consiliul Municipal"
  - pattern: "APA-CANAL CHISINAU"
    name: "Apă-Canal Chișinău"
  - pattern: "APĂ-CANAL CHIȘINĂU"
    name: "Apă-Canal Chișinău"
  - pattern: "TERMOELECTRICA"
    name: "Termoelectrica"
  - pattern: "REGIA AUTOSALUBRITATE"
    name: "Regia Autosalubritate"
  - pattern: "UNIVERSITATEA DE STAT DIN MOLDOVA"
    name: "Universitatea de Stat din Moldova"
  - pattern: "UNIVERSITATEA TEHNICA A MOLDOVEI"
    name: "Universitatea Tehnică a Moldovei"
  - pattern: "UNIVERSITATEA TEHNICĂ A MOLDOVEI"
    name: "Universitatea Tehnică a Moldovei"
  - pattern: "UNIVERSITATEA DE STAT DE MEDICINA SI FARMACIE"
    name: "USMF Nicolae Testemițanu"
  # Russian-language forms of the same bodies.
  - pattern: "ГОСУДАРСТВЕННАЯ НАЛОГОВАЯ СЛУЖБА"
    name: "Serviciul Fiscal de Stat"
  - pattern: "ТАМОЖЕННАЯ СЛУЖБА"
    name: "Serviciul Vamal"
  - pattern: "НАЦИОНАЛЬНАЯ КАССА СОЦИАЛЬНОГО СТРАХОВАНИЯ"
    name: "CNAS"
  - pattern: "НАЦИОНАЛЬНАЯ КОМПАНИЯ МЕДИЦИНСКОГО СТРАХОВАНИЯ"
