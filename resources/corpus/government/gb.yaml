  - pattern: "METROPOLITAN POLICE"
    name: "Metropolitan Police"

  # Health bodies that actually bill an individual.
  - pattern: "NHS BUSINESS SERVICES"
    name: "NHS Business Services Authority"
  - pattern: 'regex:\bNHSBSA\b'
    name: "NHS Business Services Authority"
  - pattern: "NHS PRESCRIPTION"
