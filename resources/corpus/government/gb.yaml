  - pattern: "UK VISAS"
    name: "UK Visas and Immigration"
  - pattern: "IMMIGRATION HEALTH SURCHARGE"
    name: "Immigration Health Surcharge"
  - pattern: "GENERAL REGISTER OFFICE"
    name: "General Register Office"
  - pattern: "COMPANIES HOUSE"
    name: "Companies House"
  - pattern: "REGISTERS OF SCOTLAND"
    name: "Registers of Scotland"

  # Student finance across the four nations.
  - pattern: "STUDENT FINANCE ENGLAND"
    name: "Student Finance England"
  - pattern: "STUDENT FINANCE WALES"
