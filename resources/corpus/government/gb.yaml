  - pattern: "LOW EMISSION ZONE"
    name: "Low Emission Zone"
  - pattern: "ROAD USER CHARGING"
    name: "TfL Road User Charging"
  - pattern: "DARTFORD CROSSING"
    name: "Dartford Crossing"
  - pattern: "MERSEY GATEWAY"
    name: "Mersey Gateway"
  - pattern: "TYNE TUNNEL"
    name: "Tyne Tunnel"
  - pattern: "HUMBER BRIDGE"
    name: "Humber Bridge"
  - pattern: "NATIONAL HIGHWAYS"
    name: "National Highways"
  - pattern: "BLUE BADGE"
    name: "Blue Badge"

  # Fines, courts, prosecution and legal aid.
  - pattern: "FIXED PENALTY NOTICE"
    name: "Fixed Penalty Notice"
  - pattern: "COURT FINE"
    name: "Court fine"
  - pattern: "MAGISTRATES COURT"
    name: "Magistrates' Court"
  - pattern: "CROWN COURT"
