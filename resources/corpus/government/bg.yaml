# Government / public-agency classification rules — Bulgaria.
# (Bare "NRA"/"НАП" are risky; use the full agency name.)
# (Bare "КАТ" and "МВР" are three-letter Cyrillic tokens that collide inside
# ordinary words — the spelled-out bodies are used instead.)
# Bulgarian statements are mostly Cyrillic; the Latin transliteration is
# added for the municipality, which banks do print both ways.
# Schema: see government/nl.yaml.
entries:
  - pattern: "НАЦИОНАЛНА АГЕНЦИЯ ЗА ПРИХОДИТЕ"
    name: "НАП (NRA)"
  - pattern: "АГЕНЦИЯ МИТНИЦИ"
    name: "Агенция Митници"
  - pattern: "НАЦИОНАЛЕН ОСИГУРИТЕЛЕН ИНСТИТУТ"
    name: "НОИ (NOI)"
  - pattern: "НАЦИОНАЛНА ЗДРАВНООСИГУРИТЕЛНА КАСА"
    name: "НЗОК (NZOK)"
  - pattern: "АГЕНЦИЯ ПО ЗАЕТОСТТА"
    name: "Агенция по заетостта"
  # Municipalities bill local taxes, waste and property charges.
  - pattern: "ОБЩИНА"
  - pattern: "OBSHTINA"
  - pattern: "МЕСТНИ ДАНЪЦИ И ТАКСИ"
    name: "Местни данъци и такси"
  - pattern: "ПЪТНА ПОЛИЦИЯ"
    name: "Пътна полиция"
  - pattern: "МИНИСТЕРСТВО НА ВЪТРЕШНИТЕ РАБОТИ"
    name: "МВР"
  - pattern: "АГЕНЦИЯ ПЪТНА ИНФРАСТРУКТУРА"
    name: "АПИ (винетки)"
  - pattern: "BGTOLL"
    name: "БГ ТОЛ (винетка)"
  - pattern: "АГЕНЦИЯ ПО ВПИСВАНИЯТА"
    name: "Агенция по вписванията"
  - pattern: "АГЕНЦИЯ ПО ГЕОДЕЗИЯ"
    name: "АГКК (кадастър)"
  - pattern: "ДЪРЖАВНА ТАКСА"
    name: "Държавна такса"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: nra.bg (НАП), noi.bg, nhif.bg (НЗОК), az.government.bg,
  # customs.bg, api.bg (винетки/тол), registryagency.bg, cadastre.bg,
  # mvr.bg and the courts on justice.bg. Every entry here stays a plain
  # substring: a `regex:` body must be ASCII, and Cyrillic case-folds
  # correctly only through mb_stripos.
  - pattern: "ДАНЪК ВЪРХУ ДОХОДИТЕ"
    name: "Данък върху доходите"
  - pattern: "ДАНЪК СГРАДИ"
    name: "Данък сгради"
  - pattern: "ДАНЪК ВЪРХУ ПРЕВОЗНИТЕ СРЕДСТВА"
    name: "Данък върху превозните средства"
  - pattern: "ТАКСА БИТОВИ ОТПАДЪЦИ"
    name: "Такса битови отпадъци"
  - pattern: "ТАКСА СМЕТ"
    name: "Такса смет"
  - pattern: "ОСИГУРИТЕЛНИ ВНОСКИ"
    name: "Осигурителни вноски"
  - pattern: "ЗДРАВНИ ОСИГУРОВКИ"
    name: "Здравни осигуровки"
  - pattern: "ЗДРАВНООСИГУРИТЕЛНИ ВНОСКИ"
    name: "Здравноосигурителни вноски"
  - pattern: "ПЕНСИЯ"
    name: "Пенсия (НОИ)"
  - pattern: "ДЕТСКИ НАДБАВКИ"
    name: "Детски надбавки"
  - pattern: "ОБЕЗЩЕТЕНИЕ ЗА БЕЗРАБОТИЦА"
