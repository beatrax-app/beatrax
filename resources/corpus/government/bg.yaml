  - pattern: "ТОЛ ТАКСА"
    name: "Тол такса"
  - pattern: "БГ ТОЛ"
    name: "БГ ТОЛ (винетка)"
  - pattern: "РАЙОНЕН СЪД"
    name: "Районен съд"
  - pattern: "ОКРЪЖЕН СЪД"
    name: "Окръжен съд"
  - pattern: "АПЕЛАТИВЕН СЪД"
    name: "Апелативен съд"
  - pattern: "АДМИНИСТРАТИВЕН СЪД"
