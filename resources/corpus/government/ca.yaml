# Government / public-agency classification rules — Canada.
# (Bare "CITY OF" is not used — it matches too many ordinary merchant names.)
# Schema: see government/nl.yaml.
entries:
  - pattern: "CANADA REVENUE"
    name: "Canada Revenue Agency"
  # Inbound federal benefit credits (Canada Child Benefit, GST/HST credit,
  # Canada Workers Benefit) — "CANADA FED" / "CANADA PRO" / "CANADA FPT".
  - pattern: "regex:CANADA\\s+(FED|PRO|FPT)"
    name: "Canada Revenue Agency (benefit)"
  # Inbound income-tax refund — "CANADA RIT".
  - pattern: "regex:CANADA\\s+RIT"
    name: "Canada Revenue Agency (refund)"
  - pattern: "SERVICE CANADA"
    name: "Service Canada"
  - pattern: "REVENU QUEBEC"
    name: "Revenu Québec"
  - pattern: "regex:\\bRAMQ\\b"
    name: "RAMQ"
  - pattern: "CANADA PENSION PLAN"
    name: "Canada Pension Plan"
  - pattern: "OLD AGE SECURITY"
    name: "Old Age Security"
  - pattern: "EMPLOYMENT INSURANCE"
    name: "Employment Insurance"
  - pattern: "NATIONAL STUDENT LOAN"
    name: "NSLSC"
  # Provincial vehicle and insurance bodies (SAAQ and ICBC are Crown
  # corporations with a statutory monopoly).
  - pattern: "regex:\\bSAAQ\\b"
    name: "SAAQ"
  - pattern: "regex:\\bICBC\\b"
    name: "ICBC"
  - pattern: "SERVICEONTARIO"
    name: "ServiceOntario"
  - pattern: "MINISTRY OF FINANCE"
    name: "Ministry of Finance"
  - pattern: "PROPERTY TAX"
    name: "Municipal property tax"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: canada.ca (CRA payee names, the "CANADA FED/PRO/FPT/RIT" ACH
  # deposit conventions and ESDC benefit names), revenuquebec.ca,
  # retraitequebec.gouv.qc.ca, ramq.gouv.qc.ca, cnesst.gouv.qc.ca,
  # saaq.gouv.qc.ca, icbc.com, mpi.mb.ca, sgi.sk.ca, ontario.ca/ServiceOntario,
  # novascotia.ca/sns, wsib.ca, worksafebc.com, mpac.ca and the largest
  # municipalities' own tax pages. Québec descriptors print accents, so the
  # accented form is listed next to the folded one.
  - pattern: 'regex:CRA\s*\(REVENUE\)'
    name: "Canada Revenue Agency"
  - pattern: "AGENCE DU REVENU DU CANADA"
    name: "Agence du revenu du Canada"
  - pattern: "RECEIVER GENERAL"
    name: "Receiver General for Canada"
