    name: "Receveur général du Canada"
  - pattern: "RECEVEUR GÉNÉRAL"
    name: "Receveur général du Canada"
  - pattern: "GST/HST"
    name: "GST/HST (CRA)"
  - pattern: "CANADA CHILD BENEFIT"
    name: "Canada Child Benefit"
  - pattern: "ALLOCATION CANADIENNE POUR ENFANTS"
