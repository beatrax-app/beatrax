# Government / public-agency classification rules — Spain.
# (Bare "IBI" and "IVTM" are too collision-prone — the spelled-out tax names
# are used instead.)
#
# Sources: sede.agenciatributaria.gob.es, hacienda.gob.es, inclusion.gob.es
# (which lists TGSS, INSS and ISM as its dependent bodies), sepe.es,
# imserso.es, muface.es, mugeju.es, atc.gencat.cat, atriga.gal,
# agenciatributaria.carm.es, atib.es, juntadeandalucia.es, navarra.es,
# gobiernodecanarias.org, and each autonomous community's own portal;
# dgt.es, policia.es, web.guardiacivil.es, interior.gob.es, mjusticia.gob.es,
# catastro.hacienda.gob.es, registradores.org, fnmt.es, boe.es, tesoro.es,
# puertos.es, suma.es, canaldeisabelsegunda.es/accionistas and
# emasesa.com/accionistas (both checked for 100% public ownership), and the
# consolidated TRLRHL at boe.es/buscar/act.php?id=BOE-A-2004-4214 for the
# statutory names of the local taxes; a second pass added bizkaia.eus,
# gipuzkoa.eus, web.araba.eus, ovhacienda.cantabria.es, tributasenasturias
# .es, hisenda.gva.es, portaltributario.juntaex.es, suma.es, regtsa.es,
# gestrisam.malaga.eu, xalocgirona.cat, base.cat, oar.dip-badajoz.es,
# lanbide.euskadi.eus, serveiocupacio.gencat.cat, sefcarm.es,
# ingesa.sanidad.gob.es, aca.gencat.cat, epsar.gva.es, esamur.com,
# nilsa.com, augasdegalicia.xunta.gal, emaya.es, patrimonionacional.es and
# cervantes.es, plus Ley 7/2022 art. 11.3 and RDL 1/2015 on BOE.
#
# Ownership checks that changed the outcome: EMIVASA is 80% private (Global
# Omnium) and EMUASA/Aguas de Murcia is 49% Veolia, so neither is listed;
# Canal de Isabel II, EMASESA, EMASA and EMAYA were each confirmed wholly
# municipal or regional and are. Renfe, Adif, Correos, AENA and SELAE bill
# commercially and stay out.
#
# Diacritics: Spanish descriptors reach the bank ASCII-folded and
# upper-cased (Ñ→N, á→a, Catalan d'→d), so every pattern below is the
# folded form and only the display name keeps its accents.
#
# Rejected as too collision-prone — each is an ordinary word or a private
# business name, so only the qualified form is used:
#   JUNTA          "junta de propietarios" is a homeowners' association, one
#                  of the most frequent recurring debits in Spain — only the
#                  exact "JUNTA DE <comunidad>" bigrams are listed.
#   HACIENDA       also "estate/ranch"; hotels and venues trade under it.
#   SUMA           an ordinary noun and a Spanish supermarket banner — only
#                  "SUMA GESTION TRIBUTARIA" is used.
#   AGUAS / CANAL  private concessionaires (Aqualia, Hidraqua, Global
#                  Omnium) all trade as "Aguas de X"; only the operators
#                  verified as fully public are listed.
#   MUTUA          dominated by private insurers; only MUFACE, ISFAS and
#                  MUGEJU qualify.
#   CAMARA, TASA, MULTA, PATRONATO, REGISTRO, SERVICIO, INSTITUTO, AGENCIA,
#   GOBIERNO, CONSELL, COMARCA, VADO, PLUSVALIA, CORREOS — all require a
#   qualifier and are only ever listed inside one.
#   SAS, SMS, SCS, SES, ATC, ISM, IMV, TIE, BOE, SALUD — acronyms that
#   collide with SAS Institute, text messages, satellite operators, air
#   traffic control and the ordinary noun "salud"; the spelled-out service
#   names are used instead.
# RTVE is deliberately absent: Spain abolished the household TV licence in
# 2009 (Ley 8/2009), so no consumer debit to RTVE is a public levy.
# Correos, Loterias y Apuestas del Estado and AENA are state-owned but bill
# commercially, not as a levy, so they are out of scope too.
# Schema: see government/nl.yaml.
