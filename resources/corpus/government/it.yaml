# Government / public-agency classification rules — Italy.
# (Bare "ACI" is too collision-prone — the Pubblico Registro Automobilistico
# is matched instead.)
#
# Sources: agenziaentrate.gov.it and agenziaentrateriscossione.gov.it,
# adm.gov.it (Dogane e Monopoli), gdf.gov.it, mef.gov.it, inps.it,
# inail.it, salute.gov.it, pagopa.gov.it, aci.it (PRA),
# mit.gov.it (Motorizzazione Civile), stradeanas.it, interno.gov.it,
# poliziadistato.it, carabinieri.it, giustizia.it, mim.gov.it,
# camcom.gov.it and registroimprese.it, agenziademanio.it,
# cassaforense.it, inarcassa.it, enpam.it, enasarco.it, aqp.it,
# regione.<nome>.it for each Regione, and the Province autonome di Trento
# and Bolzano.
#
# Diacritics and apostrophes: Italian descriptors keep à/è/ì/ò/ù and the
# apostrophe about as often as they strip them, so any body whose name
# carries one is listed twice (CITTA/CITTÀ, UNIVERSITA/UNIVERSITÀ,
# COMUNITA/COMUNITÀ, DELL ECONOMIA/DELL'ECONOMIA).
#
# Ownership: the listed multi-utilities (ACEA, HERA, IREN, A2A, AMSA,
# Publiacqua) are stock-exchange companies with public shareholders and
# bill commercially, so they are NOT classified as government — only the
# wholly public water operators are. Telepass and Autostrade per l'Italia
# are likewise out.
# Rejected as too collision-prone: "REGIONE", "PROVINCIA", "AZIENDA",
# "CAMERA" ("room"), "UFFICIO", "ENTRATE", "TASSA", "CANONE", "BOLLO",
# "AMA" ("loves"), and the three-letter tokens ACI, MEF, ATS, DSU, MAV and
# RAV — each is listed only inside a qualified form. "ASILO NIDO" is out
# too: privately run nidi use exactly the same words as municipal ones.
# Schema: see government/nl.yaml.
entries:
  - pattern: "AGENZIA DELLE ENTRATE"
    name: "Agenzia delle Entrate"
  - pattern: "INPS"
    name: "INPS"
  - pattern: "CANONE RAI"
    name: "Canone RAI"
  # pagoPA is the national public-payment platform; almost every payment to
  # an Italian public body now clears through it.
  - pattern: "PAGOPA"
    name: "pagoPA"
  - pattern: "regex:\\bF24\\b"
    name: "Modello F24"
  - pattern: "CARTELLA ESATTORIALE"
    name: "Agenzia delle Entrate-Riscossione"
  # Comuni bill IMU, TARI and school/waste charges.
  - pattern: "COMUNE DI"
  - pattern: "regex:\\bIMU\\b|\\bTARI\\b"
    name: "IMU / TARI"
  - pattern: "TASSA AUTOMOBILISTICA"
    name: "Tassa automobilistica (bollo auto)"
  - pattern: "PUBBLICO REGISTRO AUTOMOBILISTICO"
    name: "PRA"
  - pattern: "MOTORIZZAZIONE CIVILE"
    name: "Motorizzazione Civile"
  - pattern: "regex:\\bINAIL\\b"
    name: "INAIL"
  - pattern: "AZIENDA SANITARIA"
    name: "Azienda Sanitaria"
  - pattern: "PREFETTURA"
    name: "Prefettura"
