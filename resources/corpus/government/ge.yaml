# Government / public-agency classification rules — Georgia.
# Georgian banks print Latin/English descriptors on most statements, so the
# English agency names lead and the Mkhedruli form is added where it is
# genuinely used on invoices.
# (Bare "MIA" and "NAPR" are too collision-prone — the full names are used.)
# Schema: see government/nl.yaml.
entries:
  - pattern: "REVENUE SERVICE"
    name: "Revenue Service of Georgia"
  - pattern: "შემოსავლების სამსახური"
    name: "შემოსავლების სამსახური"
  - pattern: "PUBLIC SERVICE HALL"
    name: "Public Service Hall"
  - pattern: "იუსტიციის სახლი"
    name: "იუსტიციის სახლი"
  - pattern: "NATIONAL AGENCY OF PUBLIC REGISTRY"
    name: "National Agency of Public Registry"
  - pattern: "საჯარო რეესტრი"
    name: "საჯარო რეესტრის ეროვნული სააგენტო"
  - pattern: "NATIONAL BUREAU OF ENFORCEMENT"
    name: "National Bureau of Enforcement"
  # The funded pension scheme launched in 2019.
  - pattern: "PENSION AGENCY"
    name: "Pension Agency"
  - pattern: "საპენსიო სააგენტო"
    name: "საპენსიო სააგენტო"
  - pattern: "MINISTRY OF INTERNAL AFFAIRS"
    name: "Ministry of Internal Affairs"
  - pattern: "TBILISI CITY HALL"
    name: "Tbilisi City Hall"
  - pattern: "მერია"
  # Georgian descriptors put the word after the name ("Tbilisi Municipality"),
  # so this stays a bare literal rather than the "MUNICIPALITY OF" form used
  # in cy.yaml.
  - pattern: "MUNICIPALITY"
  # ── Depth pass ─────────────────────────────────────────────────────────
  # Sources: rs.ge (Revenue Service), sda.gov.ge and psh.gov.ge (Public
  # Service Hall / PSDA), napr.gov.ge, nbe.gov.ge (Enforcement Bureau),
  # pensions.ge, police.ge, ssa.gov.ge, tbilisi.gov.ge, mof.ge and
  # georoad.ge. Both the English and the Mkhedruli form are listed where
  # banks genuinely print both; Georgian stays a plain substring, since a
  # `regex:` body must be ASCII.
  - pattern: "აღსრულების ეროვნული ბიურო"
    name: "National Bureau of Enforcement"
  - pattern: "შინაგან საქმეთა სამინისტრო"
    name: "Ministry of Internal Affairs"
  - pattern: "სერვისების სააგენტო"
    name: "Service Agency (MIA)"
  - pattern: "საპატრულო პოლიცია"
    name: "Patrol Police"
  - pattern: "PATROL POLICE"
    name: "Patrol Police"
  - pattern: "ჯარიმა"
    name: "ჯარიმა (fine)"
  - pattern: "საჯარიმო ქვითარი"
    name: "საჯარიმო ქვითარი"
  - pattern: "სახელმწიფო ბაჟი"
    name: "State duty"
  - pattern: "სოციალური მომსახურების სააგენტო"
    name: "Social Service Agency"
  - pattern: "SOCIAL SERVICE AGENCY"
    name: "Social Service Agency"
  - pattern: "საარსებო შემწეობა"
    name: "Subsistence allowance"
  - pattern: "პენსია"
    name: "Pension"
  - pattern: "საშემოსავლო გადასახადი"
    name: "Income tax"
  - pattern: "ქონების გადასახადი"
    name: "Property tax"
  - pattern: "დამატებული ღირებულების გადასახადი"
    name: "VAT"
  - pattern: "თბილისის მუნიციპალიტეტი"
    name: "Tbilisi Municipality"
  - pattern: "თბილისის მერია"
    name: "Tbilisi City Hall"
  - pattern: "ბათუმის მერია"
    name: "Batumi City Hall"
  - pattern: "ქუთაისის მერია"
    name: "Kutaisi City Hall"
  - pattern: "ბათუმის მუნიციპალიტეტი"
    name: "Batumi Municipality"
  - pattern: "სახელმწიფო ხაზინა"
    name: "State Treasury"
  - pattern: "STATE TREASURY"
    name: "State Treasury"
  - pattern: "ფინანსთა სამინისტრო"
    name: "Ministry of Finance"
  - pattern: "იუსტიციის სამინისტრო"
    name: "Ministry of Justice"
  - pattern: "MINISTRY OF JUSTICE"
    name: "Ministry of Justice"
  - pattern: "საავტომობილო გზების დეპარტამენტი"
    name: "Roads Department of Georgia"
  - pattern: "ROADS DEPARTMENT"
    name: "Roads Department of Georgia"
  - pattern: "საქპატენტი"
    name: "Sakpatenti"
  - pattern: "SAKPATENTI"
    name: "Sakpatenti"
  - pattern: "სახელმწიფო სერვისების განვითარების სააგენტო"
    name: "Public Service Development Agency"
  - pattern: "PUBLIC SERVICE DEVELOPMENT AGENCY"
    name: "Public Service Development Agency"
  - pattern: "სამოქალაქო რეესტრი"
    name: "Civil Registry"
  - pattern: "CIVIL REGISTRY"
    name: "Civil Registry"
  - pattern: "სასამართლო"
    name: "Court"
  - pattern: "საქალაქო სასამართლო"
    name: "City Court"
  - pattern: "საბაჟო დეპარტამენტი"
    name: "Customs Department (Revenue Service)"
  - pattern: "დასაქმების ხელშეწყობის სააგენტო"
    name: "Employment Support Agency"
  - pattern: "სახელმწიფო ბიუჯეტი"
    name: "State budget"
  - pattern: "თბილისის სახელმწიფო უნივერსიტეტი"
    name: "Tbilisi State University"
  - pattern: "TBILISI STATE UNIVERSITY"
    name: "Tbilisi State University"
  - pattern: "ილიას სახელმწიფო უნივერსიტეტი"
    name: "Ilia State University"
  - pattern: "ILIA STATE UNIVERSITY"
    name: "Ilia State University"
  - pattern: "საქართველოს ტექნიკური უნივერსიტეტი"
    name: "Georgian Technical University"
  - pattern: "GEORGIAN TECHNICAL UNIVERSITY"
    name: "Georgian Technical University"
