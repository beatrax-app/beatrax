# Government / public-agency classification rules — Croatia.
#
# Sources: porezna-uprava.gov.hr (Porezna uprava, Ministarstvo financija),
# carina.gov.hr, mirovinsko.hr (HZMO), hzzo.hr, hzz.hr, fina.hr, hzsr.hr
# (Hrvatski zavod za socijalni rad, the 2023 successor to the centri za
# socijalnu skrb), hac.hr (Hrvatske autoceste d.o.o.), hrvatske-ceste.hr,
# arz.hr, voda.hr (Hrvatske vode), dgu.gov.hr, mup.gov.hr, hgk.hr, hok.hr,
# hrt.hr, gov.hr institution register.
#
# Diacritics: the haystack is matched as printed, and Croatian internet
# banking descriptors carry č/ć/š/ž about as often as they are stripped, so
# a body whose distinctive word carries a diacritic is listed TWICE — once
# ASCII-folded, once as written. Only the diacritic-bearing forms are
# doubled; nothing else is.
# Rejected as too collision-prone: bare "HRT" (also the English medical
# abbreviation), "ČISTOĆA"/"KOMUNALA" on their own (ordinary nouns — the
# qualified company forms are used), "OVRHA", "MIROVINA" and "GLOBA"
# ("GLOBA" is a substring of "GLOBAL").
# Schema: see government/nl.yaml.
entries:
  - pattern: "POREZNA UPRAVA"
    name: "Porezna uprava"
  - pattern: "HRVATSKA RADIOTELEVIZIJA"
    name: "HRT (pristojba)"
  - pattern: "CARINSKA UPRAVA"
    name: "Carinska uprava"
  - pattern: "regex:\\bHZMO\\b"
    name: "HZMO"
  - pattern: "ZAVOD ZA MIROVINSKO OSIGURANJE"
    name: "HZMO"
  - pattern: "regex:\\bHZZO\\b"
    name: "HZZO"
  - pattern: "ZAVOD ZA ZDRAVSTVENO OSIGURANJE"
    name: "HZZO"
  - pattern: "regex:\\bHZZ\\b"
    name: "HZZ (zapošljavanje)"
  # FINA processes public payments and enforcement orders.
  - pattern: "regex:\\bFINA\\b"
    name: "Financijska agencija (FINA)"
  # Cities and municipalities bill the komunalna naknada.
  - pattern: "GRADSKA UPRAVA"
  - pattern: "OPCINA"
  - pattern: "KOMUNALNA NAKNADA"
    name: "Komunalna naknada"
  - pattern: "MINISTARSTVO UNUTARNJIH POSLOVA"
    name: "MUP RH"
  - pattern: "regex:\\bMUP\\b"
    name: "MUP RH"
  - pattern: "HRVATSKE AUTOCESTE"
    name: "Hrvatske autoceste (cestarina)"
  - pattern: "DRZAVNA GEODETSKA UPRAVA"
    name: "Državna geodetska uprava"
  - pattern: "ZEMLJISNE KNJIGE"
    name: "Zemljišne knjige"
  - pattern: "SUDSKA PRISTOJBA"
    name: "Sudska pristojba"
  - pattern: "DRZAVNA RIZNICA"
    name: "Državna riznica"
  # --- Tax, customs and treasury ---------------------------------------
  - pattern: "DRŽAVNA RIZNICA"
    name: "Državna riznica"
  - pattern: "MINISTARSTVO FINANCIJA"
    name: "Ministarstvo financija"
  - pattern: "FINANCIJSKA AGENCIJA"
    name: "Financijska agencija (FINA)"
  - pattern: "POREZ NA DOHODAK"
    name: "Porez na dohodak"
  - pattern: "POREZ NA PROMET NEKRETNINA"
    name: "Porez na promet nekretnina"
  - pattern: "UPRAVNA PRISTOJBA"
    name: "Upravna pristojba"
  # --- Pensions, health insurance and employment ------------------------
  - pattern: "HRVATSKI ZAVOD ZA MIROVINSKO OSIGURANJE"
    name: "HZMO"
  - pattern: "HRVATSKI ZAVOD ZA ZDRAVSTVENO OSIGURANJE"
    name: "HZZO"
  # HZZO's dopunsko policy is a monthly direct debit in most households.
  - pattern: "DOPUNSKO ZDRAVSTVENO OSIGURANJE"
    name: "HZZO (dopunsko osiguranje)"
  - pattern: "HRVATSKI ZAVOD ZA ZAPOSLJAVANJE"
    name: "HZZ (zapošljavanje)"
  - pattern: "HRVATSKI ZAVOD ZA ZAPOŠLJAVANJE"
    name: "HZZ (zapošljavanje)"
  - pattern: "SREDISNJI REGISTAR OSIGURANIKA"
    name: "REGOS"
  - pattern: "SREDIŠNJI REGISTAR OSIGURANIKA"
    name: "REGOS"
  - pattern: 'regex:\bREGOS\b'
    name: "REGOS"
  # The centri za socijalnu skrb were merged into the HZSR in 2023; both
  # names still appear on standing orders.
  - pattern: "HRVATSKI ZAVOD ZA SOCIJALNI RAD"
    name: "Hrvatski zavod za socijalni rad"
  - pattern: "CENTAR ZA SOCIJALNU SKRB"
    name: "Centar za socijalnu skrb"
  - pattern: "DOPLATAK ZA DJECU"
    name: "Doplatak za djecu"
