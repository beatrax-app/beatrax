# Bank-fee classification rules — Austria (German).
#
# A transaction whose description matches one of these patterns resolves to
# type=bank with metadata.subcategory=fee (step 6 of
# CounterpartyResolverService). The list is deliberately narrow — broad
# matching fights the merchant resolver (step 3).
#
# German fee words are compound heads, so the boundary that matters is the
# TRAILING \b: `SPESEN\b` matches "Kontoführungsspesen" and "Buchungsspesen"
# but not "SPESENABRECHNUNG" or "SPESENERSATZ" (an expense claim being
# reimbursed), and `ENTGELT\b` matches "Kontoführungsentgelt" but not
# "ENTGELTFORTZAHLUNG" (sick pay) or "ENTGELTUMWANDLUNG". Umlauts stay out
# of `regex:` bodies — the matcher runs PCRE without /u, so `#i` case-folds
# ASCII only; "GEBÜHR" is therefore a plain substring, which is matched
# case-insensitively and multibyte-aware, with the ASCII "GEBUEHR"
# transliteration listed alongside it. Regex bodies must be SINGLE-quoted in
# YAML so the backslash reaches the matcher instead of being read as a YAML
# escape.
#
# Schema per entry:
#   pattern  string  required — case-insensitive substring or `regex:` body.
#   name     string  optional — canonical display name for the fee row, in
#                               the jurisdiction's own language. Stored as
#                               written; the reader sees `key` resolved.
#   key      string  required with a name — the fee kind, resolved through
#                               counterparties::components.default_name.
entries:
  - pattern: 'regex:SPESEN\b'
    name: "Bankspesen"
    key: bank_fee
  - pattern: 'regex:ENTGELT\b'
    name: "Bankentgelt"
    key: bank_fee
  - pattern: "KONTOFÜHRUNG"
    name: "Kontoführungsgebühr"
    key: account_maintenance
  - pattern: "GEBÜHR"
    name: "Bankgebühr"
    key: bank_fee
  - pattern: "GEBUEHR"
    name: "Bankgebühr"
    key: bank_fee
  - pattern: 'regex:ZINSEN\b'
    name: "Zinsen"
    key: debit_interest
