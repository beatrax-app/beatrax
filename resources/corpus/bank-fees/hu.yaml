# Bank-fee classification rules — Hungary (Hungarian).
#
# A transaction whose description matches one of these patterns resolves to
# type=bank with metadata.subcategory=fee (step 6 of
# CounterpartyResolverService). The list is deliberately narrow — broad
# matching fights the merchant resolver (step 3).
#
# The bare "DÍJ" (fee) is never used on its own — it is the everyday word in
# "tagdíj" (membership fee) and "belépődíj" (entrance fee) — so it only
# appears as part of the fixed statement phrases. "KAMAT" is the one short
# word, and it uses `regex:` with \b word boundaries plus its suffixes
# spelled out: `\bKAMAT(OK|OT)?\b` matches "kamat", "kamatok" and "kamatot"
# but not "KAMATMENTES" (interest-free). Accents stay out of `regex:`
# bodies — the matcher runs PCRE without /u, so `#i` case-folds ASCII only
# and \b never sees "Í" or "É" as a word character; the accented terms are
# plain substrings, which are matched case-insensitively and multibyte-aware
# and cover their own suffixes ("jutalékot" contains "jutalék"). Regex
# bodies must be SINGLE-quoted in YAML so the backslash reaches the matcher
# instead of being read as a YAML escape.
#
# Schema per entry:
#   pattern  string  required — case-insensitive substring or `regex:` body.
#   name     string  optional — canonical display name for the fee row, in
#                               the jurisdiction's own language. Stored as
#                               written; the reader sees `key` resolved.
#   key      string  required with a name — the fee kind, resolved through
#                               counterparties::components.default_name.
entries:
  - pattern: "SZÁMLAVEZETÉSI DÍJ"
    name: "Számlavezetési díj"
    key: account_maintenance
  - pattern: "TRANZAKCIÓS DÍJ"
    name: "Tranzakciós díj"
    key: transaction_fee
  - pattern: "TRANZAKCIÓS ILLETÉK"
    name: "Tranzakciós illeték"
    key: transaction_levy
  - pattern: "KÁRTYADÍJ"
    name: "Kártyadíj"
    key: card_fee
  - pattern: "JUTALÉK"
    name: "Jutalék"
    key: commission
  - pattern: 'regex:\bKAMAT(OK|OT)?\b'
    name: "Kamat"
    key: debit_interest
