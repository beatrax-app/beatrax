# Bank-fee classification rules — Romania (Romanian).
#
# A transaction whose description matches one of these patterns resolves to
# type=bank with metadata.subcategory=fee (step 6 of
# CounterpartyResolverService). The list is deliberately narrow — broad
# matching fights the merchant resolver (step 3).
#
# `\bCOMISIO` uses `regex:` with a LEADING \b on the stem so it covers
# "comision" and "comisioane" in one entry while the boundary keeps it
# anchored at the start of a word. Romanian core-banking systems print with
# and without diacritics, and case-insensitive matching does not fold "Â"
# onto "A", so the interest word is listed both ways: the plain substring
# "DOBÂNDĂ" (matched case-insensitively and multibyte-aware) and the ASCII
# `\bDOBANDA\b`, fenced on both sides so it stays a standalone word.
# Diacritics never go inside a `regex:` body — the matcher runs PCRE without
# /u, so `#i` case-folds ASCII only and \b never sees "Â" or "Ă" as a word
# character. Regex bodies must be SINGLE-quoted in YAML so the backslash
# reaches the matcher instead of being read as a YAML escape.
#
# Schema per entry:
#   pattern  string  required — case-insensitive substring or `regex:` body.
#   name     string  optional — canonical display name for the fee row.
entries:
  - pattern: "ADMINISTRARE CONT"
    name: "Comision administrare cont"
  - pattern: 'regex:\bCOMISIO'
    name: "Comision bancar"
  - pattern: "DOBÂNDĂ"
    name: "Dobândă"
  - pattern: 'regex:\bDOBANDA\b'
    name: "Dobândă"
