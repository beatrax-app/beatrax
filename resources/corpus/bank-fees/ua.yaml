# Bank-fee classification rules — Ukraine (Ukrainian, Cyrillic).
#
# A transaction whose description matches one of these patterns resolves to
# type=bank with metadata.subcategory=fee (step 6 of
# CounterpartyResolverService). The list is deliberately narrow — broad
# matching fights the merchant resolver (step 3).
#
# No `regex:` entries here: the matcher runs PCRE without /u, so \b only
# recognises ASCII word characters and a Cyrillic word can never be fenced
# by one. Cyrillic terms are plain substrings instead — those are matched
# case-insensitively and multibyte-aware — and precision comes from
# multi-word phrases, because the bare "ПЛАТА" (payment) would fire on
# ordinary transfer titles. "КОМІСІ" is left as a stem so it covers
# "комісія", "комісії" and "комісійна". Any regex body added later must be
# SINGLE-quoted in YAML so the backslash reaches the matcher instead of
# being read as a YAML escape.
#
# Schema per entry:
#   pattern  string  required — case-insensitive substring or `regex:` body.
#   name     string  optional — canonical display name for the fee row, in
#                               the jurisdiction's own language. Stored as
#                               written; the reader sees `key` resolved.
#   key      string  required with a name — the fee kind, resolved through
#                               counterparties::components.default_name.
entries:
  - pattern: "РОЗРАХУНКОВО-КАСОВЕ ОБСЛУГОВУВАННЯ"
    name: "Розрахунково-касове обслуговування"
    key: account_maintenance
  - pattern: "ПЛАТА ЗА ОБСЛУГОВУВАННЯ"
    name: "Плата за обслуговування"
    key: account_maintenance
  - pattern: "ЩОМІСЯЧНА ПЛАТА"
    name: "Щомісячна плата"
    key: monthly_fee
  - pattern: "КОМІСІ"
    name: "Комісія"
    key: commission
  - pattern: "ВІДСОТКИ"
    name: "Відсотки"
    key: debit_interest
