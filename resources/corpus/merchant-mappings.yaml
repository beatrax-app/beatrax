# Bundled crowd-sourced merchant identification corpus.
#
# Every entry maps a raw bank-statement description pattern to the
# friendly merchant name a beatrax user expects to see in their
# import preview / triage row / transactions list. Rows are seeded
# into the community_merchant_mappings table on UserInstalled with
# `user_id` left NULL — they apply globally to every user on this
# install. Re-running the seeder is idempotent: the loader keys on
# `(user_id=null, pattern)` and updates name/category/region/contributor
# in place when the row already exists.
#
# Schema per entry:
#   pattern      string  required — verbatim raw bank-statement description
#                                   prefix or full token block the bank emits
#   name         string  required — friendly merchant name shown to the user
#   category     string  optional — name of a category in the default tree
#                                   (Modules/Categorization/Database/Seeders/
#                                   DefaultCategoryTreeSeeder); unknown
#                                   categories log a warning at load time
#                                   and still seed (graceful degradation)
#   region       string  optional — ISO country code (NL, BE, DE, ...) the
#                                   merchant operates in
#   contributor  string  required — provenance string; "beatrax-bot" for
#                                   bundled corpus rows
entries:
