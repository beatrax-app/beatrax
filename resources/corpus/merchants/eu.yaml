# Merchant corpus — pan-European / global services that bill across borders.
# region defaults to EU. Schema: see merchants/nl.yaml.
#
# This file also carries the single authoritative row for a brand whose
# statement descriptor reads the same in several countries (LIDL, VODAFONE,
# CARREFOUR, …). Two properties of the lookup decide what such a row may say:
# patterns are matched with no region filter, and
# CommunityCorpusQuery::contactForMerchant resolves contact data by merchant
# NAME rather than by the row that matched. A row here is therefore answered to
# every country at once — so carry only contact data that holds group-wide. One
# country's cancellation or support page on a shared row is handed to all the
# other countries' customers, which is worse than leaving the field empty.
