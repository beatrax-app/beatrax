# Merchant corpus — Liechtenstein. region defaults to LI.
# Microstate: only genuinely domestic billers. Swiss chains trading in
# Liechtenstein (Migros, Coop, Denner, Swisscom, Salt, Concordia, SWICA) are
# excluded — they bill under their Swiss entity, not a distinct LI descriptor.
entries:
  - pattern: "LGT BANK"
    name: "LGT Bank"
    category: "Fees & charges"
    website: "https://www.lgt.com/"
  - pattern: "LIECHTENSTEIN WAERME"
    name: "Liechtenstein Wärme"
    category: "Utilities"
    website: "https://www.waerme.li/"
  - pattern: "LIECHTENSTEINISCHE KRAFTWERKE"
    name: "Liechtensteinische Kraftwerke (LKW)"
    category: "Utilities"
    website: "https://www.lkw.li/"
    support_url: "https://www.lkw.li/hilfe-und-service.html"
  - pattern: "LIECHTENSTEINISCHE POST"
    name: "Liechtensteinische Post"
    website: "https://post.li/"
    support_url: "https://post.li/kontakt/"
  - pattern: "LIEMOBIL"
    name: "LIEmobil"
    category: "Public transport"
    website: "https://liemobil.li/"
    support_url: "https://liemobil.li/de/Hilfe+Kontakt/"
  - pattern: "TELECOM LIECHTENSTEIN"
    name: "Telecom Liechtenstein"
    category: "Internet & Phone"
    website: "https://www.fl1.li/"
  - pattern: "VATERLAND"
    name: "Liechtensteiner Vaterland"
    category: "Subscriptions"
    website: "https://www.vaterland.li/"
  - pattern: "VP BANK"
    name: "VP Bank"
    category: "Fees & charges"
    website: "https://www.vpbank.com/"
  - pattern: "regex:\\bFKB\\b"
    name: "FKB — Die liechtensteinische Gesundheitskasse"
    category: "Insurance"
    website: "https://www.fkb.li/"
    support_url: "https://www.fkb.li/kontakt"
  - pattern: "regex:\\bFL1\\b"
    name: "FL1 (Telecom Liechtenstein)"
    category: "Internet & Phone"
    website: "https://www.fl1.li/"
    support_url: "https://www.fl1.li/kontakt/"
  - pattern: "regex:\\bLKW\\b"
    name: "Liechtensteinische Kraftwerke (LKW)"
    category: "Utilities"
    website: "https://www.lkw.li/"
  - pattern: "regex:\\bLLB\\b"
    name: "Liechtensteinische Landesbank"
    category: "Fees & charges"
    website: "https://llb.li/"
