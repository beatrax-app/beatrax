# Merchant corpus — Monaco. region defaults to MC.
# Microstate: only genuinely domestic billers. French chains trading in Monaco
# (Carrefour, Monoprix, SFR, Orange, ...) are excluded — they bill under their
# French entity and are already covered by fr.yaml / eu.yaml.
entries:
  - pattern: "AS MONACO"
    name: "AS Monaco"
    category: "Memberships"
    website: "https://www.asmonaco.com/"
  - pattern: "AUTOBUS DE MONACO"
    name: "Compagnie des Autobus de Monaco (CAM)"
    category: "Public transport"
    website: "https://www.cam.mc/"
    support_url: "https://www.cam.mc/nous-contacter"
  - { pattern: "CFM INDOSUEZ", name: "CFM Indosuez Wealth", category: "Fees & charges" }
  - pattern: "CMB MONACO"
    name: "Compagnie Monégasque de Banque"
    category: "Fees & charges"
    website: "https://www.cmb.mc/"
  - pattern: "MONACO HEBDO"
    name: "Monaco Hebdo"
    category: "Subscriptions"
    website: "https://monaco-hebdo.com/"
  - pattern: "MONACO PARKINGS"
    name: "Monaco Parkings"
    category: "Transport"
    website: "https://www.parkings.mc/"
  - pattern: "MONACO TELECOM"
    name: "Monaco Telecom"
    category: "Internet & Phone"
    website: "https://monaco-telecom.mc/"
    support_url: "https://monaco-telecom.mc/contactez-nous/"
  - pattern: "SMEAUX"
    name: "Société Monégasque des Eaux"
    category: "Utilities"
    website: "https://www.smeaux.mc/"
  - pattern: "regex:MONTE.?CARLO COUNTRY CLUB"
    name: "Monte-Carlo Country Club"
    category: "Memberships"
    website: "https://www.mccc.mc/"
  - pattern: "regex:\\bSMEG\\b"
    name: "SMEG — Société Monégasque de l'Électricité et du Gaz"
    category: "Utilities"
    website: "https://www.smeg.mc/"
    support_url: "https://www.smeg.mc/contact"
