# Merchant corpus — Andorra. region defaults to AD.
# Microstate: only genuinely domestic billers are listed. Spanish/French chains
# that also trade in Andorra (Caprabo, Condis, Carrefour, Repsol, ...) are
# deliberately excluded — they do not bill under a distinct Andorran descriptor.
entries:
  - pattern: "ANDBANK"
    name: "Andbank"
    category: "Fees & charges"
    website: "https://www.andbank.com/"
  - pattern: "ANDORRA 2000"
    name: "Carrefour Andorra 2000"
    category: "Groceries"
    website: "https://alimentacio.andorra2000.ad/"
  - pattern: "ANDORRA TELECOM"
    name: "Andorra Telecom"
    category: "Internet & Phone"
    website: "https://www.andorratelecom.ad/"
    support_url: "https://www.andorratelecom.ad/contacta/"
