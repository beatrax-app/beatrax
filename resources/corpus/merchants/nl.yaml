# Merchant corpus — Netherlands.
#
# Seeded into the global tier of the community_merchant_mappings table on
# install. Region defaults to NL (this filename); contributor defaults to
# "beatrax-bot". Patterns are case-insensitive substrings unless prefixed
# with `regex:` (see CorpusPatternMatcher).
#
# Schema per entry:
#   pattern   string  required — statement-descriptor substring or regex: body
#                                (must be unique across EVERY merchants file —
#                                the global corpus tier is keyed on pattern, so
#                                a second file reusing one overwrites the first)
#   name      string  required — friendly merchant name
#   category  string  optional — a category in the default tree
#   region    string  optional — overrides the filename-derived country
#   contributor string optional — provenance (defaults to beatrax-bot)
#
# Contact / cancellation fields (all optional). These are shown to a user who
# is trying to reach or leave a subscription, so an unverified value is worse
# than an absent one — omit anything you have not loaded yourself:
#   website       string  official homepage, https:// only
#   cancel_url    string  the deepest page that performs or documents cancelling
#   support_url   string  official help / contact page
#   support_phone string  the service number as the merchant publishes it
#   support_email string  official support mailbox
# MerchantContactReader drops any value that is not https, not a dialable
# number, or not a mailbox — a dropped value ships as a missing link, so
# BundledCorpusIntegrityTest fails the build rather than letting that happen.
entries:
  - { pattern: "ACTION", name: "Action" }
