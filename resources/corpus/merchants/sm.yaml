# Merchant corpus — San Marino. region defaults to SM.
# Microstate: only genuinely domestic billers. Italian chains trading in San
# Marino (Conad, Esselunga, TIM Italia, ...) are excluded — they are already in
# it.yaml and do not bill under a distinct Sammarinese descriptor.
entries:
  - pattern: "BANCA AGRICOLA COMMERCIALE"
    name: "Banca Agricola Commerciale (BAC)"
    category: "Fees & charges"
    website: "https://www.bac.sm/"
  - pattern: "BANCA DI SAN MARINO"
    name: "Banca di San Marino"
    category: "Fees & charges"
    website: "https://www.bsm.sm/"
  - pattern: "BONELLI BUS"
    name: "Bonelli Bus"
    category: "Public transport"
    website: "https://www.bonellibus.it/"
  - pattern: "CARISP"
    name: "Cassa di Risparmio della Repubblica di San Marino"
    category: "Fees & charges"
    website: "https://www.carisp.sm/"
  - pattern: "ISS SAN MARINO"
    name: "ISS — Istituto per la Sicurezza Sociale"
    category: "Healthcare"
    website: "https://www.iss.sm/"
  - pattern: "POSTE SAN MARINO"
    name: "Poste San Marino"
    website: "https://www.poste.sm/"
    support_url: "https://www.poste.sm/contatti/"
  - pattern: "TIM SAN MARINO"
    name: "TIM San Marino"
    category: "Internet & Phone"
    website: "https://www.telecomitalia.sm/"
  - pattern: "TITANCOOP"
    name: "Titancoop"
    category: "Groceries"
    website: "https://www.titancoop.sm/"
  - pattern: "regex:\\bAASS\\b"
    name: "AASS — Azienda Autonoma di Stato per i Servizi Pubblici"
    category: "Utilities"
    website: "https://www.aass.sm/"
  - pattern: "regex:\\bSUMS\\b"
    name: "SUMS — Società Unione Mutuo Soccorso"
    category: "Memberships"
    website: "https://www.sums.sm/"
