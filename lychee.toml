# Link-check configuration. A broken link in the documentation is a real
# defect: the comment policy's M6 rule means source files link into `.docs/`,
# so a dead path is not cosmetic.
exclude_path = [
  "vendor",
  "node_modules",
  "mobile-app",
  "storage",
  "public/build",
  "nativephp",
  "composer.lock",
  "package-lock.json",
  ".planning",
]
exclude = [
  # The community invite. It redirects to Discord, which rejects
  # unauthenticated invite HEAD requests; the invite is verified by hand.
  "^https://discord\\.nightworks\\.io",
  # Release and compare URLs that only exist once a release is cut, and
  # settings pages that require authentication to resolve.
  "^https://github\\.com/beatrax-app/beatrax/(releases|compare|security|settings|discussions)",
  # Badge endpoints rate-limit aggressively under CI, and they cannot resolve
  # until their first publish: Scorecard has no entry until its workflow runs
  # on the default branch, and SonarCloud has no project until a scan lands on
  # main. They 404 or hang meanwhile, which says nothing about the readme.
  "^https://img\\.shields\\.io/",
  "^https://api\\.scorecard\\.dev/",
  "^https://scorecard\\.dev/",
  "^https://sonarcloud\\.io/",
  # The Hippocratic License text, linked from NOTICE.md. The URL is live — it
  # answers 200 from a browser and from a developer machine — but the host
  # refuses connections from GitHub's runner ranges, which failed this check on
  # consecutive runs with "Connection failed" while the link was fine. Checking
  # it from CI measures the host's firewall, not the licence reference.
  "^https://firstdonoharm\\.dev/",
  # The Contributor Covenant, linked from CODE_OF_CONDUCT.md. Same shape as the
  # licence above: 200 from a developer machine on three consecutive requests,
  # "Connection reset by peer (os error 104)" from the runner even with the
  # action's five retries. The host resets the runner ranges, so the check was
  # reporting on its firewall rather than on the code of conduct.
  "^https://www\\.contributor-covenant\\.org/",
]
exclude_loopback = true
max_retries = 2
accept = ["200", "206", "429"]
