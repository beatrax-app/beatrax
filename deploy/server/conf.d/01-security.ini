; Loaded into $PHP_INI_DIR/conf.d by deploy/server/Dockerfile. The FrankenPHP
; base image installs no php.ini at all, so every directive here is otherwise
; the interpreter's compiled default.

; Off by default, and then getTraceAsString() renders the first 15 characters
; of every string argument -- on a parse frame, a row of the reader's bank
; statement. SafeTrace assembles its own frames and does not depend on this;
; the directive is here so nothing ELSE that renders a trace can leak one. The
; desktop shell publishes the same directive through NativeAppServiceProvider
; and the suite loads it from tools/test-php-ini; this is the third runtime,
; and it was the one shipping without it.
zend.exception_ignore_args=1
