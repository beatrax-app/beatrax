# Production-style self-host stack for Beatrax (single user / household).
#
# Setup:
#   cp deploy/server/.env.example deploy/server/.env     # then edit it
#   # generate an app key and paste it into deploy/server/.env as APP_KEY:
#   docker compose -f deploy/server/docker-compose.yml run --rm app php artisan key:generate --show
#   docker compose -f deploy/server/docker-compose.yml up -d --build
#   docker compose -f deploy/server/docker-compose.yml exec app php artisan beatrax:install
#
# All app processes read the SAME deploy/server/.env via env_file, so APP_KEY
# stays consistent across containers. (Use `beatrax:install` here, not
# `beatrax:setup` — setup is for the bare-metal single-process path; in Docker
# the env_file is the source of truth.)
#
# SQLite, not a database server. The schema is SQLite-only: thirty-two
# migrations use RAISE(ABORT) triggers and search is an FTS5 virtual table, so
# `migrate` against PostgreSQL fails on the first substantive table. That is the
# product's position rather than an omission — see ADR-0022. The database file
# lives on a named volume so it survives `down` and image rebuilds.
name: beatrax

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/server/Dockerfile
  image: beatrax-app:latest
  env_file: .env
  volumes:
    - app-data:/app/database
  restart: unless-stopped

services:
  # One-shot, and everything else waits on it. Previously the workers started
  # alongside the app and crash-looped on a missing cache table until a human
  # ran step 4, because the documented order brings the stack up before
  # migrating.
  #
  # Not `--isolated`. That takes its lock through the cache store, the cache
  # store here is the database, and the `cache_locks` table it locks in is one
  # this very command creates. On a first boot against an empty volume it died
  # on `no such table: cache_locks` and took the whole stack down with it,
  # because the other three services wait on this one completing. Being the
  # only migrator is what `depends_on` already guarantees.
  migrate:
    <<: *app
    restart: "no"
    command: php artisan migrate --force

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8000}:80"
    # Fetches a real route and reads the body, rather than testing that the
    # port accepts a connection. This stack once 404'd every request while all
    # four containers were up and `migrate` had succeeded, because FrankenPHP
    # publishes no SERVER_ADDR and the address gate fell through to its
    # no-bind-address branch. A TCP check would have reported that as healthy.
    #
    # From inside the container, so REMOTE_ADDR is loopback and the check
    # passes on an install nobody has widened — which is the shipped default.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  queue:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: php artisan queue:work --tries=3 --backoff=60 --sleep=3

  scheduler:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: php artisan schedule:work

volumes:
  app-data:
