# Dependabot version-update config for beatrax-app/beatrax.
#
# Security updates are configured separately via the repo's
# "Automated security fixes" toggle (enabled via API during the Phase 17
# GitHub security walkthrough). This file controls VERSION updates only.
#
# Cadence: weekly on Monday morning Europe/Amsterdam — a small-but-not-tiny
# stream of PRs that don't pile up over months.

version: 2
updates:
  # Composer (PHP backend dependencies — Laravel, modules, brick/money, etc.)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "livewire/*"
          - "spatie/*"
          - "nwidart/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "larastan/*"
          - "phpstan/*"
          - "pestphp/*"
          - "laravel/pint"

  # npm (root package.json — Vite, Tailwind, ApexCharts, Axios, Fuse.js)
  # Excludes the gitignored nativephp/electron/ subtree (Electron + electron-builder
  # are vendor-managed by NativePHP and tracked there, not here).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "laravel-vite-plugin"
          - "concurrently"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # GitHub Actions (the workflow files themselves: actions/checkout, etc.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
