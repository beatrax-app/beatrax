# Coverage, measured here and reported to SonarCloud.
#
# Deliberately a separate workflow rather than a step in the PR gate: coverage
# needs an instrumenting extension, and running the full suite under pcov costs
# several minutes the gate should not pay on every push. The gate answers "is
# this correct"; this answers "how much is covered", and the two can move at
# different speeds.
#
# Coverage reaches SonarCloud only through a CI-run scan: automatic analysis
# does not accept an imported report, so the two are mutually exclusive. If the
# coverage figure on the badge stays empty, automatic analysis is still on for
# the project and needs turning off in SonarCloud's settings.
name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Each shard measures its own slice and uploads a clover report; the
  # `coverage` job below hands all of them to SonarCloud at once. Sonar takes a
  # comma-separated list of report paths and unions them, so a sharded run
  # produces the same picture as a single one.
  coverage-shard:
    name: coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Shallow on purpose. Only the scan needs history, to attribute new
          # code to the commits that introduced it, and it runs in the job
          # below; a shard just runs tests.

      - name: Install poppler-utils (pdftotext)
        run: |
            set -euo pipefail
            # apt hangs on a bad mirror often enough to have cost a day of CI: the
            # job sits here until its own timeout and reports as CANCELLED with no
            # output, which reads as an externally killed run rather than a stalled
            # download. Bounded and retried, a stall costs a minute, not the job.
            for attempt in 1 2 3; do
                if sudo timeout 120 apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                    && sudo timeout 180 apt-get install -y --no-install-recommends \
                        -o Acquire::Retries=3 -o Acquire::http::Timeout=20 poppler-utils; then
                    exit 0
                fi
                echo "::warning::apt attempt ${attempt} stalled or failed; retrying."
                sleep 5
            done
            echo "::error::poppler-utils could not be installed after three attempts."
            exit 1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
          # pcov rather than xdebug: markedly faster for line coverage, which
          # is all an imported clover report carries.
          coverage: pcov
          tools: composer:v2
          # pcov instruments one directory tree and defaults to app/. Almost
          # every line of this codebase is under Modules/, so the report was
          # measuring 2 covered statements out of 72882 and SonarCloud read it,
          # correctly, as 0.4% coverage. These go in php.ini rather than on the
          # command line because `artisan test` runs Pest in a child process,
          # which does not inherit the parent's -d flags.
          ini-values: pcov.directory=., pcov.exclude="~(vendor|node_modules)~"

      # vendor/ as well as the archives — restoring downloads still leaves
      # composer ~34s of unpacking on each of the three shards.
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-coverage-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-coverage-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # PhpStanBoundaryRuleTest runs PHPStan over Modules/ from inside the
      # suite, and under pcov it is slower still. ~125s cold, ~3s warm.
      - name: Cache PHPStan result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpstan-cache
          key: phpstan-coverage-${{ runner.os }}-${{ hashFiles('**/composer.lock', 'phpstan.neon') }}-${{ github.sha }}
          restore-keys: |
            phpstan-coverage-${{ runner.os }}-${{ hashFiles('**/composer.lock', 'phpstan.neon') }}-
            phpstan-coverage-${{ runner.os }}-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build Vite assets
        # Feature tests render views that resolve URLs through the Vite
        # manifest, so it has to exist before the suite runs.
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p database
          touch database/database.sqlite
          mkdir -p storage/app/inbox storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache

      - name: Resolve this shard's testsuites
        id: shard
        run: |
          suites=$(python3 .github/scripts/shard-testsuites.py --shard "${{ matrix.shard }}" --of 3)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "shard ${{ matrix.shard }}/3: $suites"

      - name: Pest with coverage
        env:
          APP_ENV: testing
        # Parallel within the shard as well. paratest merges the per-worker
        # coverage rather than sampling it: serial and parallel runs of the same
        # suite both reported 6512/72872 covered statements and 569 covered
        # methods, identical rather than close. A fast report that undercounts
        # would be worse than a slow one, which is the failure this job just
        # came out of.
        run: php artisan test --parallel --testsuite="${{ steps.shard.outputs.suites }}" --coverage-clover=coverage.xml

      - name: Keep this shard's report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  # The name the branch ruleset requires, and the only place the scan runs:
  # SonarCloud takes one analysis per commit, so three shards scanning
  # independently would race and the last writer would report a third of the
  # coverage as if it were all of it.
  coverage:
    needs: coverage-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collapse the shard results
        env:
          RESULT: ${{ needs.coverage-shard.result }}
        run: |
          echo "shards: $RESULT"
          [ "$RESULT" = success ] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needs the full history: Sonar attributes new code to the commits
          # that introduced it, and a shallow clone leaves it guessing.
          fetch-depth: 0

      - name: Collect the shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: List what arrived
        run: |
          find coverage-reports -name '*.xml' | sort
          count=$(find coverage-reports -name '*.xml' | wc -l)
          # A missing report is silent otherwise: Sonar would import what it was
          # given and publish a confident number covering two thirds of the run.
          [ "$count" -eq 3 ] || { echo "::error::expected 3 clover reports, found $count"; exit 1; }

      # SonarCloud refuses a CI analysis while automatic analysis is on, and
      # automatic analysis will not accept an imported coverage report — so the
      # two are mutually exclusive and CI has to be the one that wins. This is
      # the API call the Analysis Method page makes; it is idempotent.
      - name: Make CI analysis authoritative
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # The credential goes in on stdin rather than argv: a token passed as
          # `curl -u` is readable in the process table for the life of the call,
          # and gitleaks flags the pattern for exactly that reason.
          printf 'user = "%s:"\n' "$SONAR_TOKEN" | curl -sS -X POST --config - \
            "https://sonarcloud.io/api/autoscan/activation?projectKey=beatrax-app_beatrax&enable=false" \
            -w '\nHTTP %{http_code}\n'

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=coverage-reports/coverage-1/coverage.xml,coverage-reports/coverage-2/coverage.xml,coverage-reports/coverage-3/coverage.xml

      # A check nobody has watched fail is what let twenty issues through, so
      # the step below is put through its failure paths against a loopback stub
      # before its verdict is trusted. About a second, and it catches the
      # regression that matters: a gate edited into always passing.
      - name: Prove the gate still fails
        run: python3 .github/scripts/sonar-gate-selftest.py

      # The scan uploads a report and returns success; the verdict is computed
      # afterwards and, until this step existed, nothing read it.
      #
      # `-Dsonar.qualitygate.wait=true` would only re-check the gate, and the
      # gate is the built-in "Sonar way": it cannot be edited, and it conditions
      # on ratings rather than on issue count. Forty-five new code smells sat
      # under an A maintainability rating, which is why it stayed green. This
      # asks for the issue list itself.
      #
      # It lives in the `coverage` job on purpose: that job name is already a
      # required status check, so the enforcement starts blocking on merge
      # rather than once someone remembers to edit the ruleset.
      - name: Fail on new SonarCloud issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 .github/scripts/sonar-gate.py
