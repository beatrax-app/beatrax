# OpenSSF Scorecard — supply-chain posture, published to the public
# scorecard.dev viewer and uploaded to code scanning.
#
# `branch_protection_rule` is one of the triggers because several checks read
# the branch protection, so a protection change should re-score immediately
# rather than wait for the weekly run.
#
# The token falls back. This repository is protected by a repository ruleset,
# not classic branch protection — `branches/main/protection` answers "Branch not
# protected" while `rulesets` returns the active "main protection" rule — and
# Scorecard reads rulesets with the workflow's own GITHUB_TOKEN. So the default
# is sufficient here and the expression degrades to it when no secret is set.
#
# SCORECARD_TOKEN is used when present: it is a classic PAT with `repo` scope,
# which additionally covers classic branch protection should any repository in
# the organisation use it. That scope is broad and long-lived, which is the
# trade being made knowingly — the fallback exists so a rotation that empties
# the secret degrades to a working run rather than a broken one.
#
# The failure mode is worth knowing because it is silent: the action exits zero
# and the workflow goes green while a check it could not perform scores -1 with
# "internal error: error during branchesHandler.setup". The verify step below
# turns that into a visible warning instead of a quietly wrong badge.
name: scorecard

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the badge resolve on scorecard.dev.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: results.sarif

      - name: Verify the admin-scoped checks actually ran
        # Scorecard reports a check it could not perform as score -1 and still
        # exits zero, so without this the badge silently under-reports and
        # nobody finds out. A warning rather than a failure: the score is
        # informational, and a token problem should not block a merge.
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open('results.sarif', encoding='utf-8') as fh:
              sarif = json.load(fh)

          broken = []
          for run in sarif.get('runs', []):
              for result in run.get('results', []):
                  rule = result.get('ruleId', '')
                  text = (result.get('message', {}) or {}).get('text', '')
                  if 'internal error' in text.lower():
                      broken.append(f'{rule}: {text.strip()[:140]}')

          if not broken:
              print('every check produced a real result.')
              sys.exit(0)

          for entry in broken:
              print(f'::warning::scorecard check could not run — {entry}')
          print('::warning::if this names Branch-Protection, check the repository is still ruleset-protected — Scorecard reads rulesets with the default token.')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('### Scorecard checks that could not run\n\n')
                  for entry in broken:
                      fh.write(f'- `{entry}`\n')
                  fh.write('\nThese score -1 and drag the published badge down. '
                           'Branch-Protection reads repository rulesets with the default '
                           'GITHUB_TOKEN; if it appears here, confirm the default branch '
                           'is still ruleset-protected rather than reaching for a PAT.\n')
          PY
