# OpenSSF Scorecard — supply-chain posture, published to the public
# scorecard.dev viewer and uploaded to code scanning.
#
# `branch_protection_rule` is one of the triggers because several checks read
# the branch protection, so a protection change should re-score immediately
# rather than wait for the weekly run.
#
# The token falls back. This repository is protected by a repository ruleset,
# not classic branch protection — `branches/main/protection` answers "Branch not
# protected" while `rulesets` returns the active "main protection" rule — and
# Scorecard reads rulesets with the workflow's own GITHUB_TOKEN. So the default
# is sufficient here and the expression degrades to it when no secret is set.
#
# SCORECARD_TOKEN is used when present: it is a classic PAT with `repo` scope,
# which additionally covers classic branch protection should any repository in
# the organisation use it. That scope is broad and long-lived, which is the
# trade being made knowingly — the fallback exists so a rotation that empties
# the secret degrades to a working run rather than a broken one.
#
# PUBLISHING IS FRAGILE AND FAILS QUIETLY. The OpenSSF API verifies the
# workflow before accepting a result and refuses one whose scorecard job holds
# anything but `uses:` steps drawn from a fixed allow-list — checkout,
# upload-artifact, codeql-action/upload-sarif, scorecard-action,
# harden-runner. No `run:` steps, no job-level env or defaults, no containers.
# A rejected publish is a `::warning::` and an exit code of zero, so the
# workflow stays green while api.scorecard.dev answers 404 and the README
# badge does not render. That is what happened here: the verify step used to
# live in this job and cost every publish for as long as it did.
#
# So the analysis job holds nothing but allow-listed actions, and the SARIF
# travels to the verify job as an artifact.
name: scorecard

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the badge resolve on scorecard.dev.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: results.sarif

      # Hands the SARIF to the verify job. upload-artifact is on the OpenSSF
      # allow-list, so carrying the file out this way costs nothing, where an
      # inline `run:` step would cost the publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

  verify:
    # A separate job because the analysis job may not contain a `run:` step
    # without the OpenSSF API refusing to publish. Scorecard reports a check
    # it could not perform as score -1 and still exits zero, so without this
    # the badge silently under-reports and nobody finds out. A warning rather
    # than a failure: the score is informational, and a token problem should
    # not block a merge.
    needs: analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorecard-results

      - name: Verify the admin-scoped checks actually ran
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open('results.sarif', encoding='utf-8') as fh:
              sarif = json.load(fh)

          broken = []
          for run in sarif.get('runs', []):
              for result in run.get('results', []):
                  rule = result.get('ruleId', '')
                  text = (result.get('message', {}) or {}).get('text', '')
                  if 'internal error' in text.lower():
                      broken.append(f'{rule}: {text.strip()[:140]}')

          if not broken:
              print('every check produced a real result.')
              sys.exit(0)

          for entry in broken:
              print(f'::warning::scorecard check could not run — {entry}')
          print('::warning::if this names Branch-Protection, check the repository is still ruleset-protected — Scorecard reads rulesets with the default token.')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('### Scorecard checks that could not run\n\n')
                  for entry in broken:
                      fh.write(f'- `{entry}`\n')
                  fh.write('\nThese score -1 and drag the published badge down. '
                           'Branch-Protection reads repository rulesets with the default '
                           'GITHUB_TOKEN; if it appears here, confirm the default branch '
                           'is still ruleset-protected rather than reaching for a PAT.\n')
          PY
