# Tag-triggered installer pipeline. Push a v*.*.* tag for a stable
# draft release; push any tag with a semver prerelease suffix
# (e.g. v1.0.0-beta, v1.0.0-rc.1, v1.0.0-alpha.2) for an immediate
# preview release.
#
# Workflow shape: a quality gate (the same Pint + Larastan + Pest
# matrix that ci.yml runs) fails fast on a broken main before any
# platform job spins up; macOS-14 + Windows-2025 + Ubuntu-24.04 build
# in parallel; the publish job creates a GitHub Release with every
# platform artifact attached.
#
# Tag is the single source of truth for the shipped version string.
# The release workflow strips the leading `v` from the pushed tag
# (so `v0.1.0` becomes `0.1.0`) and exports it as
# NATIVEPHP_APP_VERSION before invoking `php artisan native:build`;
# the bundle reads that value via env('NATIVEPHP_APP_VERSION', ...)
# in config/nativephp.php and surfaces it through the /health probe
# at runtime on real installs.
#
# Every third-party action is pinned to a full 40-char commit SHA;
# tag-only references are a supply-chain risk because mutable tags
# can be repointed at malicious commits without the workflow file
# changing. The trigger is `push: tags: [v*]` only — never
# pull_request_target — so fork PRs cannot reach this workflow.
#
# Auto-update integrity chain:
#   1. macOS builds register the `nativephp_inject_macos_update_settings`
#      prebuild hook so the generated electron-builder config carries
#      `disableDifferentialDownload: true` — full-binary auto-update
#      bypasses OS-signature validation that ad-hoc-signed bundles
#      would otherwise fail.
#   2. The publish job signs the publisher manifests (`latest.yml` +
#      per-platform variants) with the Ed25519 private key sourced from
#      the `ED25519_PRIVATE_KEY` repo secret; the matching public hex
#      lives in `config/auto_update.php` so installed bundles verify
#      the signature via `sodium_crypto_sign_verify_detached` on every
#      poll.
#   3. A manifest binds only the one installer its `path:` names, so the
#      publish job also writes a SHA-256 checksum file over every
#      downloaded artefact and signs that with the same key. It is what
#      the `.msi`, the `.deb` and the `.apk` are checked against.
#   4. The verify-published job re-downloads the published manifests and
#      the checksum file, re-runs the Ed25519 verification, and asserts
#      that every asset on the page appears in the checksum file —
#      catches CDN partial-upload races, silently-skipped upload steps,
#      and an artefact nothing vouches for, before a release goes
#      "green" to humans while broken in flight.

name: release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

env:
    TZ: Europe/Amsterdam
    # Wire NativePHP's updater config to the GitHub publisher.
    # `php artisan native:build` reads these via the Updater
    # facade and JSON-encodes them as NATIVEPHP_UPDATER_CONFIG
    # for electron-builder, which makes electron-builder emit
    # the auto-update manifests (`latest.yml`, `latest-mac.yml`,
    # `latest-linux.yml`) alongside the installer artifacts.
    # Those manifests are what the Ed25519 signing step in the
    # publish job signs, and what electron-updater polls at
    # runtime in the installed bundle. The repo is public, so
    # the read-only GITHUB_TOKEN GitHub injects is enough for
    # electron-builder's pre-publish dry-runs; `-p never` keeps
    # it from pushing directly — softprops/action-gh-release
    # owns the actual upload.
    # Owner and repo are read from the GitHub context rather than
    # hardcoded, so an organisation move cannot silently point the
    # updater feed at the previous owner.
    NATIVEPHP_UPDATER_PROVIDER: github
    # Read twice from one name, and the two readers disagreed while it was
    # unset: electron-builder.mjs compares it to the STRING 'true' and so
    # dropped the `publish` block entirely — no `app-update.yml` in the bundle,
    # nothing for electron-updater to poll — while config/nativephp.php
    # defaulted it to true and had the Electron boot hook poll anyway. It is
    # set explicitly here and written into the bundled .env below so neither
    # side is left on a default. The reader's own switch narrows the runtime
    # half at `native:config` time; this only ever says the bundle HAS a feed.
    NATIVEPHP_UPDATER_ENABLED: 'true'
    GITHUB_OWNER: ${{ github.repository_owner }}
    GITHUB_REPO: ${{ github.event.repository.name }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # The origin the app's own Ed25519 pre-check fetches the signed
    # publisher manifest from before any download or install (read at
    # runtime as `config('auto_update.manifest_feed_url')`). Derived from
    # the GitHub context — same reason as the owner/repo above: an
    # organisation move re-points the feed with the repo, never at a
    # hardcoded owner. `releases/latest/download` resolves the newest
    # *published* (non-draft) release, so a drafted stable release surfaces
    # nothing until a human publishes it. Appended to the bundled `.env` in
    # each desktop staging step below.
    AUTO_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download

jobs:
    spec-gate:
        # release-preflight.yml runs this same check, but it is
        # workflow_dispatch-only while this workflow fires on any `v*` tag
        # push — so a human pushing a tag bypassed the spec entirely and the
        # pipeline would build and draft a release for a version the spec does
        # not consider releasable. Its own job, ahead of the builds,
        # so it costs seconds and fails before anything is compiled.
        name: spec gate
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out the canonical spec
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
                  repository: beatrax-app/spec
                  ref: main
                  path: .spec-canonical

            - name: The tagged version is releasable in the spec
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  VERSION="${REF_NAME#v}"
                  printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
                    || { echo "::error::tag must be vX.Y.Z or vX.Y.Z-<prerelease>, got '${REF_NAME}'."; exit 1; }
                  export VERSION
                  python3 - <<'PY'
                  import os, sys, tomllib, pathlib
                  version = os.environ["VERSION"]
                  base, _, pre = version.partition("-")
                  path = pathlib.Path(".spec-canonical/70-operations/versions") / f"{base}.toml"
                  if not path.exists():
                      sys.exit(f"::error::no manifest at 70-operations/versions/{base}.toml — stage the version first.")
                  m = tomllib.loads(path.read_text(encoding="utf-8"))
                  status, repos, goals = m.get("status"), m.get("repos", []), m.get("goals", [])
                  if "beatrax" not in repos:
                      sys.exit(f"::error::{base}.toml does not cut this repo (repos = {repos}).")
                  # A preview tag rides a staged version — the point of a preview is to
                  # exercise goals that are not all satisfied yet. A stable tag needs
                  # every goal satisfied, which is what `releasable` means (staging.md).
                  wanted = ("staged", "releasable") if pre else ("releasable",)
                  if status not in wanted:
                      sys.exit(f"::error::{base}.toml is '{status}'; a {'preview' if pre else 'stable'} tag needs one of {wanted}.")
                  kind = f"preview ({pre})" if pre else "stable"
                  print(f"{base}.toml is '{status}' with {len(goals)} locked goals — {kind} tag accepted.")
                  PY

    gate:
        name: gate (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: true
            matrix:
                php: ['8.5']
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Install poppler-utils (pdftotext)
              run: |
                  set -euo pipefail
                  # apt hangs on a bad mirror often enough to have cost a day of CI: the
                  # job sits here until its own timeout and reports as CANCELLED with no
                  # output, which reads as an externally killed run rather than a stalled
                  # download. Bounded and retried, a stall costs a minute, not the job.
                  for attempt in 1 2 3; do
                      if sudo timeout 120 apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                          && sudo timeout 180 apt-get install -y --no-install-recommends \
                              -o Acquire::Retries=3 -o Acquire::http::Timeout=20 poppler-utils; then
                          exit 0
                      fi
                      echo "::warning::apt attempt ${attempt} stalled or failed; retrying."
                      sleep 5
                  done
                  echo "::error::poppler-utils could not be installed after three attempts."
                  exit 1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: ~/.composer/cache
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-${{ matrix.php }}-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              run: npm run build

            - name: Prepare environment for Larastan + Pest
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi
                  mkdir -p database
                  touch database/database.sqlite
                  mkdir -p storage/app/inbox storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  chmod -R u+rwX storage bootstrap/cache

            - name: Pint (code-style)
              run: vendor/bin/pint --test

            - name: Larastan level 10 strict
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Pest (full suite)
              env:
                  APP_ENV: testing
              run: php artisan test

    build-macos:
        # macOS Intel (x64) is intentionally skipped from the
        # prebuilt installer pipeline. GitHub deprecated all
        # native macOS-Intel hosted runners earlier this year,
        # so an x64 leg on macos-14 (Apple Silicon) has to run
        # @electron/rebuild under Rosetta 2 — observed wall-clock
        # is 18–25+ min vs ~9 min native arm64, and the silent
        # subprocesses regularly trip the job timeout. Intel Mac
        # users build from source per the README's
        # "Installing on macOS" section. arm64 is the only
        # prebuilt arch shipped from CI.
        name: build (macOS, arm64)
        needs: [gate, spec-gate]
        runs-on: macos-14
        timeout-minutes: 20
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # Blade layouts call `@vite([...])` which resolves URLs via
              # `public/build/manifest.json`. `public/build/` is
              # gitignored, so each per-platform build runner must
              # regenerate it before `native:build` copies the app tree
              # into the bundle — otherwise the shipped installer
              # boots into Laravel's `ViteManifestNotFoundException` on
              # the first request.
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              # `nativephp/electron/` is gitignored — the desktop build's
              # prebuild hooks (patch-imports, inject-tray) need it on
              # disk first, and the bundler copies the project `.env`
              # into `vendor/nativephp/desktop/resources/build/app/.env`
              # so the packaged runtime has a base config to load.
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  # A shipped bundle must never answer an error with Laravel's
                  # debug page: it prints file paths, the framework version and a
                  # full stack trace. .env.example carries APP_DEBUG=true for
                  # local work, so it is overridden here, portably.
                  { grep -Ev '^(APP_ENV|APP_DEBUG)=' .env; printf 'APP_ENV=production\nAPP_DEBUG=false\n'; } > .env.release
                  mv .env.release .env
                  # The desktop updater's Ed25519 pre-check reads this feed at
                  # runtime; the bundled .env is this file, so the origin has to
                  # be written in before native:build copies the app tree.
                  printf 'AUTO_UPDATE_FEED_URL=%s\n' "$AUTO_UPDATE_FEED_URL" >> .env
                  # The runtime half of the same variable electron-builder read
                  # at build time: unwritten, the bundle would carry a feed the
                  # boot hook was told nothing about.
                  printf 'NATIVEPHP_UPDATER_ENABLED=%s\n' "$NATIVEPHP_UPDATER_ENABLED" >> .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the macOS bundle (arm64)
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
                  # electron-builder imports CSC_LINK into a temporary keychain
                  # and signs with it; the APPLE_* trio is what notarize.js
                  # submits with. Absent either half the build degrades to an
                  # ad-hoc signature, which the verify step below then rejects.
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  NATIVEPHP_MAC_IDENTITY: ${{ vars.NATIVEPHP_MAC_IDENTITY }}
                  NATIVEPHP_APPLE_ID: ${{ secrets.NATIVEPHP_APPLE_ID }}
                  NATIVEPHP_APPLE_ID_PASS: ${{ secrets.NATIVEPHP_APPLE_ID_PASS }}
                  NATIVEPHP_APPLE_TEAM_ID: ${{ vars.NATIVEPHP_APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  for required in CSC_LINK CSC_KEY_PASSWORD NATIVEPHP_MAC_IDENTITY NATIVEPHP_APPLE_ID NATIVEPHP_APPLE_ID_PASS NATIVEPHP_APPLE_TEAM_ID; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned macOS build."
                          exit 1
                      fi
                  done
                  # Strip the leading `v` so the bundle's reported version
                  # matches the tag without the prefix (v0.1.0 → 0.1.0).
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build mac arm64

            # The identity the verify step below checks the bundle against.
            # It is not optional there: an absent one is treated exactly like
            # a wrong one, because a notarised bundle carrying the framework's
            # scaffold id is a correctly signed lie.
            - name: Resolve the bundle identifier the build was given
              id: app-identity
              run: |
                  set -euo pipefail
                  identifier=$(php artisan tinker --execute="echo config('nativephp.app_id');" 2>/dev/null | tail -n 1 | tr -d '[:space:]')
                  if [ -z "${identifier}" ]; then
                      echo "::error::could not resolve config('nativephp.app_id'); refusing to verify a bundle against an unknown identity."
                      exit 1
                  fi
                  echo "identifier=${identifier}" >> "$GITHUB_OUTPUT"

            # A green build proves nothing about the signature here: the
            # Developer ID prebuild hook's non-zero exit is swallowed by
            # NativePHP's runProcess(), electron-builder then falls back to
            # an ad-hoc signature, and notarize.js skips notarisation — all
            # three with a warning and a zero exit code. Interrogate the
            # artifact instead. Kept in lockstep with release-build.yml,
            # which carries the same step in the same position.
            - name: Verify the macOS bundle is genuinely signed
              uses: ./.github/actions/verify-signature
              with:
                  platform: macos
                  artifact-path: nativephp/electron/dist/*.dmg
                  expected-identifier: ${{ steps.app-identity.outputs.identifier }}

            - name: Emit auto-update manifest (latest-mac.yml)
              # electron-builder skips writing the publisher manifest
              # when invoked with `-p never` (NativePHP's default
              # build:* npm scripts). Switching to `-p always` would
              # have electron-builder push installers + manifest to a
              # GitHub Release directly, racing softprops/action-gh-
              # release in the publish job. Cheaper to emit the
              # manifest ourselves: compute the DMG's SHA-512
              # (base64-encoded, as electron-updater expects) plus
              # size, write the minimal UpdateInfo schema, and let
              # the existing upload-artifact + Ed25519 Sign chain
              # carry it through.
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  INSTALLER=$(find . -maxdepth 1 -name "*.dmg" -print -quit)
                  INSTALLER=${INSTALLER#./}
                  if [ -z "$INSTALLER" ]; then
                      echo "No .dmg found in nativephp/electron/dist/"
                      exit 1
                  fi
                  SHA512_B64=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 | tr -d '\n')
                  SIZE=$(wc -c < "$INSTALLER" | tr -d ' ')
                  VERSION="${TAG_REF#v}"
                  RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  {
                      echo "version: ${VERSION}"
                      echo "files:"
                      echo "  - url: ${INSTALLER}"
                      echo "    sha512: ${SHA512_B64}"
                      echo "    size: ${SIZE}"
                      echo "path: ${INSTALLER}"
                      echo "sha512: ${SHA512_B64}"
                      echo "releaseDate: '${RELEASE_DATE}'"
                  } > latest-mac.yml
                  echo "--- latest-mac.yml ---"
                  cat latest-mac.yml

            - name: Upload macOS artifacts (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: macos-arm64
                  path: |
                      nativephp/electron/dist/*.dmg
                      nativephp/electron/dist/latest-mac.yml
                  if-no-files-found: error

    build-windows:
        name: build (Windows)
        needs: [gate, spec-gate]
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  # Windows additions: ext-zip + ext-sodium are needed
                  # by nativephp/desktop and the libsodium-backed
                  # auto-update signing. ext-pcntl + ext-posix are
                  # POSIX-only and cannot be installed on Windows; we
                  # tell composer to ignore those platform requirements
                  # below since the desktop runtime does not invoke the
                  # signal-handled queue worker on this platform.
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              shell: bash
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # See the macOS leg above — the manifest must exist on
              # this runner before `native:build` copies the app tree
              # into the bundle, or the shipped installer boots into
              # `ViteManifestNotFoundException`.
              shell: bash
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              shell: bash
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  # A shipped bundle must never answer an error with Laravel's
                  # debug page: it prints file paths, the framework version and a
                  # full stack trace. .env.example carries APP_DEBUG=true for
                  # local work, so it is overridden here, portably.
                  { grep -Ev '^(APP_ENV|APP_DEBUG)=' .env; printf 'APP_ENV=production\nAPP_DEBUG=false\n'; } > .env.release
                  mv .env.release .env
                  # The desktop updater's Ed25519 pre-check reads this feed at
                  # runtime; the bundled .env is this file, so the origin has to
                  # be written in before native:build copies the app tree.
                  printf 'AUTO_UPDATE_FEED_URL=%s\n' "$AUTO_UPDATE_FEED_URL" >> .env
                  # The runtime half of the same variable electron-builder read
                  # at build time: unwritten, the bundle would carry a feed the
                  # boot hook was told nothing about.
                  printf 'NATIVEPHP_UPDATER_ENABLED=%s\n' "$NATIVEPHP_UPDATER_ENABLED" >> .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Windows bundle
              shell: bash
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
                  # Azure Trusted Signing. electron-builder.mjs omits
                  # azureSignOptions entirely when any one of the three
                  # NATIVEPHP_AZURE_* values is empty, so a missing secret
                  # ships an UNSIGNED installer from a green build — hence the
                  # guard below rather than trusting the build to complain.
                  NATIVEPHP_AZURE_ENDPOINT: ${{ vars.NATIVEPHP_AZURE_ENDPOINT }}
                  NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
                  NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME }}
                  NATIVEPHP_AZURE_PUBLISHER_NAME: ${{ vars.NATIVEPHP_AZURE_PUBLISHER_NAME }}
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
              run: |
                  set -euo pipefail
                  for required in NATIVEPHP_AZURE_ENDPOINT NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME NATIVEPHP_AZURE_PUBLISHER_NAME AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned Windows build."
                          exit 1
                      fi
                  done
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            # The guard above proves the six Azure values reached the build;
            # only the artifact proves electron-builder actually signed with
            # them. Kept in lockstep with release-build.yml.
            - name: Verify the Windows installer is genuinely signed
              uses: ./.github/actions/verify-signature
              with:
                  platform: windows
                  artifact-path: nativephp/electron/dist/*.exe

            - name: Emit auto-update manifest (latest.yml)
              shell: bash
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  INSTALLER=$(find . -maxdepth 1 -name "*.exe" -print -quit)
                  INSTALLER=${INSTALLER#./}
                  if [ -z "$INSTALLER" ]; then
                      echo "No .exe found in nativephp/electron/dist/"
                      exit 1
                  fi
                  SHA512_B64=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 | tr -d '\n')
                  SIZE=$(wc -c < "$INSTALLER" | tr -d ' ')
                  VERSION="${TAG_REF#v}"
                  RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  {
                      echo "version: ${VERSION}"
                      echo "files:"
                      echo "  - url: ${INSTALLER}"
                      echo "    sha512: ${SHA512_B64}"
                      echo "    size: ${SIZE}"
                      echo "path: ${INSTALLER}"
                      echo "sha512: ${SHA512_B64}"
                      echo "releaseDate: '${RELEASE_DATE}'"
                  } > latest.yml
                  echo "--- latest.yml ---"
                  cat latest.yml

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: windows
                  path: |
                      nativephp/electron/dist/*.exe
                      nativephp/electron/dist/*.msi
                      nativephp/electron/dist/latest.yml
                  if-no-files-found: error

    build-linux:
        name: build (Linux)
        needs: [gate, spec-gate]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # See the macOS leg above — the manifest must exist on
              # this runner before `native:build` copies the app tree
              # into the bundle, or the shipped installer boots into
              # `ViteManifestNotFoundException`.
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  # A shipped bundle must never answer an error with Laravel's
                  # debug page: it prints file paths, the framework version and a
                  # full stack trace. .env.example carries APP_DEBUG=true for
                  # local work, so it is overridden here, portably.
                  { grep -Ev '^(APP_ENV|APP_DEBUG)=' .env; printf 'APP_ENV=production\nAPP_DEBUG=false\n'; } > .env.release
                  mv .env.release .env
                  # The desktop updater's Ed25519 pre-check reads this feed at
                  # runtime; the bundled .env is this file, so the origin has to
                  # be written in before native:build copies the app tree.
                  printf 'AUTO_UPDATE_FEED_URL=%s\n' "$AUTO_UPDATE_FEED_URL" >> .env
                  # The runtime half of the same variable electron-builder read
                  # at build time: unwritten, the bundle would carry a feed the
                  # boot hook was told nothing about.
                  printf 'NATIVEPHP_UPDATER_ENABLED=%s\n' "$NATIVEPHP_UPDATER_ENABLED" >> .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Linux bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            # This is the position the macOS and Windows legs hold their
            # signing guard and their artifact interrogation, and Linux
            # deliberately has neither. There is no desktop equivalent of
            # Developer ID or Authenticode that a `.deb` or an AppImage
            # carries and a Linux desktop checks on launch, so a signing
            # identity here would be one nothing verifies. What stands in
            # for it is the project's own chain: the Ed25519-signed
            # `latest-linux.yml` emitted below covers the AppImage, and the
            # Ed25519-signed checksum file the publish job writes covers
            # both artefacts.
            #
            # That leaves one thing worth asserting, because nothing else
            # does: the upload step's `if-no-files-found: error` fires only
            # when the whole path list matches nothing, so a Linux build
            # that stopped producing a `.deb` would publish an AppImage and
            # look green.
            - name: Linux carries no OS-level signature, and this is what stands in for it
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  missing=()
                  compgen -G '*.AppImage' > /dev/null || missing+=('*.AppImage')
                  compgen -G '*.deb' > /dev/null || missing+=('*.deb')
                  if [ "${#missing[@]}" -gt 0 ]; then
                      echo "::error::the Linux build produced no ${missing[*]}, so that artefact would be missing from the release rather than unsigned."
                      exit 1
                  fi
                  {
                      echo '### Linux integrity'
                      echo
                      echo 'No OS-level code signature, by design — Linux has no equivalent a desktop verifies.'
                      echo 'The AppImage is covered by the Ed25519-signed latest-linux.yml; both it and'
                      echo 'the .deb are covered by the Ed25519-signed checksum file.'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Emit auto-update manifest (latest-linux.yml)
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  INSTALLER=$(find . -maxdepth 1 -name "*.AppImage" -print -quit)
                  INSTALLER=${INSTALLER#./}
                  if [ -z "$INSTALLER" ]; then
                      echo "No .AppImage found in nativephp/electron/dist/"
                      exit 1
                  fi
                  SHA512_B64=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 | tr -d '\n')
                  SIZE=$(wc -c < "$INSTALLER" | tr -d ' ')
                  VERSION="${TAG_REF#v}"
                  RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  {
                      echo "version: ${VERSION}"
                      echo "files:"
                      echo "  - url: ${INSTALLER}"
                      echo "    sha512: ${SHA512_B64}"
                      echo "    size: ${SIZE}"
                      echo "path: ${INSTALLER}"
                      echo "sha512: ${SHA512_B64}"
                      echo "releaseDate: '${RELEASE_DATE}'"
                  } > latest-linux.yml
                  echo "--- latest-linux.yml ---"
                  cat latest-linux.yml

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: linux
                  path: |
                      nativephp/electron/dist/*.AppImage
                      nativephp/electron/dist/*.deb
                      nativephp/electron/dist/latest-linux.yml
                  if-no-files-found: error

    build-android:
        # The public, sideloadable APK. Bifrost builds the store-shaped
        # artifacts from its own credentials; this leg exists so a signed
        # download sits alongside the desktop ones on the Release page.
        name: build (Android)
        needs: [gate, spec-gate]
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            # The nativephp/mobile-* plugins are a paid, private Composer
            # repository; the mobile root cannot install without these.
            COMPOSER_AUTH: >-
                {"http-basic":{"plugins.nativephp.com":{"username":"${{ secrets.NATIVEPHP_LICENSE_EMAIL }}","password":"${{ secrets.NATIVEPHP_LICENSE_KEY }}"}}}
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # public/build is served on-device, so the bundle needs it before
              # the Laravel tree is copied into the APK.
              run: npm run build

            - name: Lay down the mobile environment
              working-directory: mobile-app
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  # A shipped bundle must never answer an error with Laravel's
                  # debug page: it prints file paths, the framework version and a
                  # full stack trace. .env.example carries APP_DEBUG=true for
                  # local work, so it is overridden here, portably.
                  { grep -Ev '^(APP_ENV|APP_DEBUG)=' .env; printf 'APP_ENV=production\nAPP_DEBUG=false\n'; } > .env.release
                  mv .env.release .env
                  mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  touch database/database.sqlite
                  chmod -R u+rwX storage bootstrap/cache

            - name: Install Composer dependencies (mobile-app/ root)
              working-directory: mobile-app
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Mint the mobile application key
              working-directory: mobile-app
              run: php artisan key:generate --ansi

            - name: Restore the release keystore
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 is empty — refusing to publish an unsigned Android build."
                      exit 1
                  fi
                  mkdir -p mobile-app/credentials
                  printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile-app/credentials/app-release-key.jks
                  chmod 600 mobile-app/credentials/app-release-key.jks

            - name: Build and sign the APK
              working-directory: mobile-app
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
                  # Read from the environment rather than passed as --flags:
                  # command-line arguments are visible in the process list.
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  for required in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned Android build."
                          exit 1
                      fi
                  done
                  export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/mobile-app/credentials/app-release-key.jks"
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  # mobile:package-android, never native:package directly and
                  # never native:run --build=release. native:package returns
                  # success whatever goes wrong — including with no Android
                  # project to build, which is the state a `composer install`
                  # checkout is in. The wrapper generates the project, applies
                  # the shell patches and fails unless an artifact exists.
                  php artisan mobile:package-android --build-type=release --no-interaction

            - name: Verify the APK is signed by the release key
              env:
                  EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
              run: |
                  set -euo pipefail
                  # Scoped to Gradle's release output rather than the whole
                  # mobile root, so an intermediate or stale APK elsewhere in
                  # the tree cannot stand in for the one just built.
                  apk=$(find mobile-app/nativephp/android/app/build/outputs/apk/release \
                      -name '*.apk' -not -name '*unsigned*' -print -quit 2>/dev/null || true)
                  if [ -z "$apk" ]; then
                      echo "::error::no signed APK was produced."
                      exit 1
                  fi
                  echo "verifying $apk"

                  apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -print -quit)
                  if [ -z "$apksigner" ]; then
                      echo "::error::apksigner not found — cannot verify the signature."
                      exit 1
                  fi

                  "$apksigner" verify --verbose "$apk"

                  # apksigner verify passes on a DEBUG-signed APK too, so the
                  # signer identity is the check that matters.
                  actual=$("$apksigner" verify --print-certs "$apk" \
                      | grep -i 'SHA-256 digest:' | head -1 \
                      | sed 's/.*digest: *//' | tr -d ' :' | tr '[:lower:]' '[:upper:]')
                  expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')

                  if [ -z "$expected" ]; then
                      echo "::error::ANDROID_SIGNING_CERT_SHA256 is not set — cannot prove which key signed this."
                      exit 1
                  fi
                  if [ "$actual" != "$expected" ]; then
                      echo "::error::APK is signed by an unexpected key."
                      exit 1
                  fi
                  echo "signed by the expected release key"
                  echo "APK_PATH=$apk" >> "$GITHUB_ENV"

            - name: Upload Android artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: android
                  path: ${{ env.APK_PATH }}
                  if-no-files-found: error

    smoke-server:
        # The shipped self-host recipe, launched and asked for its health
        # endpoint before anything is uploaded. The four desktop and mobile
        # legs above cannot be launched this way on a hosted runner — an
        # Electron bundle needs a session and a display, and the Android APK
        # needs a device — so this covers the one shape CI can actually run,
        # which is also the shape that shipped answering 404 to everything.
        name: smoke (self-host server)
        needs: [gate, spec-gate]
        uses: ./.github/workflows/deploy-smoke.yml

    publish:
        name: publish
        needs: [build-macos, build-windows, build-linux, build-android, smoke-server]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  # git-cliff walks the tag history to build the release
                  # notes; a shallow clone would leave it with one commit.
                  fetch-depth: 0

            - name: Set up PHP (libsodium for manifest signing)
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sodium
                  coverage: none
                  tools: composer:v2

            - name: Download every platform's artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  path: artifacts

            - name: Write the checksum file covering every published artefact
              # Each publisher manifest binds exactly the one installer its
              # `path:` field names, so the `.msi`, the `.deb` and the `.apk`
              # reach the release page with nothing a downloader can check them
              # against. This list covers whatever was downloaded, so an
              # artefact added to any build job is covered the day it appears
              # rather than the day somebody remembers this step.
              #
              # Written before the signing pass below, and therefore signed by
              # it: an unsigned list of hashes is only as trustworthy as the
              # page it sits on, which is the page it exists to vouch for.
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  CHECKSUMS="beatrax-${TAG#v}-checksums.txt"

                  mapfile -t ASSETS < <(find artifacts -type f | sort)
                  if [ "${#ASSETS[@]}" -eq 0 ]; then
                      echo "::error::no artefacts were downloaded, so there is nothing to checksum."
                      exit 1
                  fi

                  # `shasum -c` resolves each line against the working
                  # directory, and a downloader has every asset in one flat
                  # folder. Two artefacts sharing a basename would make one
                  # line silently check the other file.
                  duplicates=$(printf '%s\n' "${ASSETS[@]}" | xargs -n1 basename | sort | uniq -d)
                  if [ -n "$duplicates" ]; then
                      echo "::error::two published artefacts share a basename, which a flat download cannot tell apart: $(printf '%s' "$duplicates" | tr '\n' ' ')"
                      exit 1
                  fi

                  mkdir -p artifacts/checksums
                  for asset in "${ASSETS[@]}"; do
                      printf '%s  %s\n' "$(sha256sum "$asset" | cut -d' ' -f1)" "$(basename "$asset")"
                  done | sort -k2 > "artifacts/checksums/${CHECKSUMS}"

                  echo "--- ${CHECKSUMS} ---"
                  cat "artifacts/checksums/${CHECKSUMS}"

            - name: Sign the publisher manifests and the checksum file with Ed25519
              env:
                  ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  # Locate every publisher manifest electron-updater
                  # produced, plus the checksum file written above.
                  # `actions/download-artifact` flattens each platform under
                  # `artifacts/<name>/`, so the find pass picks up
                  # `latest.yml` / `latest-mac.yml` / `latest-linux.yml`
                  # regardless of where they landed. Each `.sig` sibling is
                  # written in place next to the file it covers.
                  mapfile -t SIGNABLE < <(find artifacts -type f \( -name 'latest*.yml' -o -name '*-checksums.txt' \))
                  if [ "${#SIGNABLE[@]}" -eq 0 ]; then
                      echo "No publisher manifests or checksum file found under artifacts/ — nothing to sign."
                      exit 1
                  fi
                  for signable in "${SIGNABLE[@]}"; do
                      echo "Signing ${signable}"
                      # shellcheck disable=SC2016  # inline PHP: $body is a PHP variable, not a shell one
                      php -r '
                          $body = file_get_contents($argv[1]);
                          if ($body === false) { fwrite(STDERR, "could not read " . $argv[1]); exit(1); }
                          $secret = sodium_hex2bin(getenv("ED25519_PRIVATE_KEY"));
                          $sig = sodium_crypto_sign_detached($body, $secret);
                          file_put_contents($argv[1] . ".sig", bin2hex($sig));
                      ' -- "$signable"
                  done

            - name: Generate release notes (git-cliff)
              id: cliff
              uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
              with:
                  config: cliff.toml
                  args: --latest --strip header

            # A release body over the API's limit is rejected outright, and
            # a major version spanning hundreds of commits gets there. Trim
            # to the last whole entry that fits and point at the full log.
            - name: Fit the release notes to the API limit
              id: notes
              env:
                  NOTES: ${{ steps.cliff.outputs.content }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  limit=124000
                  printf '%s' "$NOTES" > notes.md
                  if [ "$(wc -c < notes.md)" -gt "$limit" ]; then
                      head -c "$limit" notes.md | sed '$d' > notes.trimmed
                      printf '\n\n_Trimmed to fit. The complete log for %s is on the [commit history](%s/commits/%s)._\n' \
                          "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$TAG" >> notes.trimmed
                      mv notes.trimmed notes.md
                      echo "Release notes trimmed to $limit bytes." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Publish the GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
              with:
                  tag_name: ${{ github.ref_name }}
                  body_path: notes.md
                  # The repo has "immutable releases" enabled, which
                  # rejects asset uploads after a Release transitions
                  # to published. softprops uploads its asset list
                  # AFTER the Release is created, so a non-draft
                  # create fails immediately. Always create as draft
                  # here, then the next step flips prerelease tags
                  # (anything with a `-` suffix) to a published
                  # prerelease via `gh release edit`. Stable tags
                  # stay as draft so a human can review + publish.
                  draft: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  # Every platform artifact, the checksum file, and the
                  # Ed25519 detached signature written beside each of the
                  # things that carry one. Installed bundles fetch the
                  # matching `.sig` alongside the manifest and verify before
                  # any download proceeds; a human verifying by hand reads
                  # the checksum file and its own `.sig`.
                  files: |
                      artifacts/**/*
                      artifacts/**/latest*.yml.sig

            - name: Flip prerelease draft to published
              if: contains(github.ref_name, '-')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Via env, never inline in the shell: a tag name may contain
                  # $() or backticks (git ref-format permits them), and inline
                  # ${{ }} would let a crafted tag execute in this job.
                  TAG: ${{ github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # Convert the draft Release softprops just created
                  # into a published prerelease. Assets land while the
                  # Release is still a draft (which immutable-releases
                  # allows); publishing here only flips the visibility
                  # bit, no asset upload happens.
                  gh release edit "$TAG" \
                      --repo "$REPO" \
                      --draft=false

    verify-published:
        name: verify published
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP (libsodium for manifest verification)
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sodium
                  coverage: none
                  tools: composer:v2

            - name: Download published manifests, checksum file + signatures
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Via env, never inline: a crafted tag name must not reach the
                  # shell as executable $()/backtick text.
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  mkdir -p verify
                  gh release download "$TAG" \
                      --dir verify \
                      --pattern 'latest*.yml' \
                      --pattern 'latest*.yml.sig' \
                      --pattern '*-checksums.txt' \
                      --pattern '*-checksums.txt.sig'

            - name: Re-verify every signed file with sodium_crypto_sign_verify_detached
              run: |
                  set -euo pipefail
                  # Read the publisher public hex from the committed
                  # config file — the source of truth installed bundles
                  # verify against. A simple grep avoids booting the
                  # framework just to read one config value.
                  PUBLIC_HEX=$(grep -oE "'[0-9a-f]{64}'" config/auto_update.php | head -1 | tr -d "'")
                  if [ -z "$PUBLIC_HEX" ]; then
                      echo "Could not extract publisher_public_key_hex from config/auto_update.php"
                      exit 1
                  fi
                  mapfile -t SIGNED < <(find verify -type f -not -name '*.sig' \( -name 'latest*.yml' -o -name '*-checksums.txt' \))
                  if [ "${#SIGNED[@]}" -eq 0 ]; then
                      echo "Neither a manifest nor a checksum file was downloaded — verification cannot run."
                      exit 1
                  fi
                  for signed in "${SIGNED[@]}"; do
                      sig_file="${signed}.sig"
                      if [ ! -f "$sig_file" ]; then
                          echo "Missing signature for ${signed}"
                          exit 1
                      fi
                      echo "Verifying ${signed}"
                      # shellcheck disable=SC2016  # inline PHP: $body is a PHP variable, not a shell one
                      PUBLIC_HEX="$PUBLIC_HEX" php -r '
                          $body = file_get_contents($argv[1]);
                          $sigHex = trim((string) file_get_contents($argv[1] . ".sig"));
                          $public = sodium_hex2bin(getenv("PUBLIC_HEX"));
                          $sig = sodium_hex2bin($sigHex);
                          exit(sodium_crypto_sign_verify_detached($sig, $body, $public) ? 0 : 1);
                      ' -- "$signed"
                  done
                  echo "Every published manifest and the checksum file verify cleanly against the embedded publisher public key."

            - name: Every published asset appears in the signed checksum file
              # A checksum file that quietly stopped covering one artefact is
              # indistinguishable, on the page, from one that covers them all.
              # The page itself is the only honest input here, so the asset
              # list is read back from the release rather than from the tree
              # the publish job happened to hold.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  CHECKSUMS=$(find verify -type f -name '*-checksums.txt' -print -quit)
                  if [ -z "$CHECKSUMS" ]; then
                      echo "::error::the release carries no checksum file, so every artefact without a manifest entry has nothing to verify against."
                      exit 1
                  fi

                  mapfile -t COVERED < <(sed -E 's/^[0-9a-f]{64}  //' "$CHECKSUMS")

                  uncovered=()
                  while IFS= read -r asset; do
                      # A detached signature is checked by the key, not by a
                      # hash, and the checksum file cannot list itself.
                      case "$asset" in
                          *.sig | *-checksums.txt) continue ;;
                      esac
                      found=""
                      for name in "${COVERED[@]}"; do
                          if [ "$name" = "$asset" ]; then
                              found="yes"
                              break
                          fi
                      done
                      if [ -z "$found" ]; then
                          uncovered+=("$asset")
                      fi
                  done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

                  if [ "${#uncovered[@]}" -gt 0 ]; then
                      echo "::error::published with no entry in ${CHECKSUMS##*/}, so a downloader has nothing to check them against: ${uncovered[*]}"
                      exit 1
                  fi
                  echo "Every published asset is covered by the signed checksum file."
