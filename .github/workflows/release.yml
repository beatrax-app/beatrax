# Tag-triggered installer pipeline. Push a v*.*.* tag for a stable
# draft release; push any tag with a semver prerelease suffix
# (e.g. v1.0.0-beta, v1.0.0-rc.1, v1.0.0-alpha.2) for an immediate
# preview release.
#
# Workflow shape: a quality gate (the same Pint + Larastan + Pest
# matrix that ci.yml runs) fails fast on a broken main before any
# platform job spins up; macOS-14 + Windows-2025 + Ubuntu-24.04 build
# in parallel; the publish job creates a GitHub Release with every
# platform artifact attached.
#
# Tag is the single source of truth for the shipped version string.
# The release workflow strips the leading `v` from the pushed tag
# (so `v0.1.0` becomes `0.1.0`) and exports it as
# NATIVEPHP_APP_VERSION before invoking `php artisan native:build`;
# the bundle reads that value via env('NATIVEPHP_APP_VERSION', ...)
# in config/nativephp.php and surfaces it through the /health probe
# at runtime on real installs.
#
# Every third-party action is pinned to a full 40-char commit SHA;
# tag-only references are a supply-chain risk because mutable tags
# can be repointed at malicious commits without the workflow file
# changing. The trigger is `push: tags: [v*]` only — never
# pull_request_target — so fork PRs cannot reach this workflow.
#
# Auto-update integrity chain:
#   1. macOS builds register the `nativephp_inject_macos_update_settings`
#      prebuild hook so the generated electron-builder config carries
#      `disableDifferentialDownload: true` — full-binary auto-update
#      bypasses OS-signature validation that ad-hoc-signed bundles
#      would otherwise fail.
#   2. The publish job signs the publisher manifests (`latest.yml` +
#      per-platform variants) with the Ed25519 private key sourced from
#      the `ED25519_PRIVATE_KEY` repo secret; the matching public hex
#      lives in `config/auto_update.php` so installed bundles verify
#      the signature via `sodium_crypto_sign_verify_detached` on every
#      poll.
#   3. The verify-published job re-downloads the published manifests
#      and re-runs the Ed25519 verification — catches CDN partial-
#      upload races and silently-skipped upload steps before a release
#      goes "green" to humans while broken in flight.

name: release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

env:
    TZ: Europe/Amsterdam
    # Wire NativePHP's updater config to the GitHub publisher.
    # `php artisan native:build` reads these via the Updater
    # facade and JSON-encodes them as NATIVEPHP_UPDATER_CONFIG
    # for electron-builder, which makes electron-builder emit
    # the auto-update manifests (`latest.yml`, `latest-mac.yml`,
    # `latest-linux.yml`) alongside the installer artifacts.
    # Those manifests are what the Ed25519 signing step in the
    # publish job signs, and what electron-updater polls at
    # runtime in the installed bundle. The repo is public, so
    # the read-only GITHUB_TOKEN GitHub injects is enough for
    # electron-builder's pre-publish dry-runs; `-p never` keeps
    # it from pushing directly — softprops/action-gh-release
    # owns the actual upload.
    # Owner and repo are read from the GitHub context rather than
    # hardcoded, so an organisation move cannot silently point the
    # updater feed at the previous owner.
    NATIVEPHP_UPDATER_PROVIDER: github
    GITHUB_OWNER: ${{ github.repository_owner }}
    GITHUB_REPO: ${{ github.event.repository.name }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    gate:
        name: gate (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: true
            matrix:
                php: ['8.5']
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Install poppler-utils (pdftotext)
              run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: ~/.composer/cache
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-${{ matrix.php }}-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build Vite assets
              run: npm run build

            - name: Prepare environment for Larastan + Pest
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi
                  mkdir -p database
                  touch database/database.sqlite
                  mkdir -p storage/app/inbox storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  chmod -R u+rwX storage bootstrap/cache

            - name: Pint (code-style)
              run: vendor/bin/pint --test

            - name: Larastan level 10 strict
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Pest (full suite)
              env:
                  APP_ENV: testing
              run: php artisan test

    build-macos:
        # macOS Intel (x64) is intentionally skipped from the
        # prebuilt installer pipeline. GitHub deprecated all
        # native macOS-Intel hosted runners earlier this year,
        # so an x64 leg on macos-14 (Apple Silicon) has to run
        # @electron/rebuild under Rosetta 2 — observed wall-clock
        # is 18–25+ min vs ~9 min native arm64, and the silent
        # subprocesses regularly trip the job timeout. Intel Mac
        # users build from source per the README's
        # "Installing on macOS" section. arm64 is the only
        # prebuilt arch shipped from CI.
        name: build (macOS, arm64)
        needs: gate
        runs-on: macos-14
        timeout-minutes: 20
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci

            - name: Build Vite assets
              # Blade layouts call `@vite([...])` which resolves URLs via
              # `public/build/manifest.json`. `public/build/` is
              # gitignored, so each per-platform build runner must
              # regenerate it before `native:build` copies the app tree
              # into the bundle — otherwise the shipped installer
              # boots into Laravel's `ViteManifestNotFoundException` on
              # the first request.
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              # `nativephp/electron/` is gitignored — the desktop build's
              # prebuild hooks (patch-imports, inject-tray) need it on
              # disk first, and the bundler copies the project `.env`
              # into `vendor/nativephp/desktop/resources/build/app/.env`
              # so the packaged runtime has a base config to load.
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the macOS bundle (arm64)
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  # Strip the leading `v` so the bundle's reported version
                  # matches the tag without the prefix (v0.1.0 → 0.1.0).
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build mac arm64

            - name: Emit auto-update manifest (latest-mac.yml)
              # electron-builder skips writing the publisher manifest
              # when invoked with `-p never` (NativePHP's default
              # build:* npm scripts). Switching to `-p always` would
              # have electron-builder push installers + manifest to a
              # GitHub Release directly, racing softprops/action-gh-
              # release in the publish job. Cheaper to emit the
              # manifest ourselves: compute the DMG's SHA-512
              # (base64-encoded, as electron-updater expects) plus
              # size, write the minimal UpdateInfo schema, and let
              # the existing upload-artifact + Ed25519 Sign chain
              # carry it through.
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  INSTALLER=$(find . -maxdepth 1 -name "*.dmg" -print -quit)
                  INSTALLER=${INSTALLER#./}
                  if [ -z "$INSTALLER" ]; then
                      echo "No .dmg found in nativephp/electron/dist/"
                      exit 1
                  fi
                  SHA512_B64=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 | tr -d '\n')
                  SIZE=$(wc -c < "$INSTALLER" | tr -d ' ')
                  VERSION="${TAG_REF#v}"
                  RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  {
                      echo "version: ${VERSION}"
                      echo "files:"
                      echo "  - url: ${INSTALLER}"
                      echo "    sha512: ${SHA512_B64}"
                      echo "    size: ${SIZE}"
                      echo "path: ${INSTALLER}"
                      echo "sha512: ${SHA512_B64}"
                      echo "releaseDate: '${RELEASE_DATE}'"
                  } > latest-mac.yml
                  echo "--- latest-mac.yml ---"
                  cat latest-mac.yml

            - name: Upload macOS artifacts (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: macos-arm64
                  path: |
                      nativephp/electron/dist/*.dmg
                      nativephp/electron/dist/latest-mac.yml
                  if-no-files-found: error

    build-windows:
        name: build (Windows)
        needs: gate
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  # Windows additions: ext-zip + ext-sodium are needed
                  # by nativephp/desktop and the libsodium-backed
                  # auto-update signing. ext-pcntl + ext-posix are
                  # POSIX-only and cannot be installed on Windows; we
                  # tell composer to ignore those platform requirements
                  # below since the desktop runtime does not invoke the
                  # signal-handled queue worker on this platform.
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              shell: bash
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix

            - name: Install npm dependencies
              run: npm ci

            - name: Build Vite assets
              # See the macOS leg above — the manifest must exist on
              # this runner before `native:build` copies the app tree
              # into the bundle, or the shipped installer boots into
              # `ViteManifestNotFoundException`.
              shell: bash
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              shell: bash
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Windows bundle
              shell: bash
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Emit auto-update manifest (latest.yml)
              shell: bash
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  INSTALLER=$(find . -maxdepth 1 -name "*.exe" -print -quit)
                  INSTALLER=${INSTALLER#./}
                  if [ -z "$INSTALLER" ]; then
                      echo "No .exe found in nativephp/electron/dist/"
                      exit 1
                  fi
                  SHA512_B64=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 | tr -d '\n')
                  SIZE=$(wc -c < "$INSTALLER" | tr -d ' ')
                  VERSION="${TAG_REF#v}"
                  RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  {
                      echo "version: ${VERSION}"
                      echo "files:"
                      echo "  - url: ${INSTALLER}"
                      echo "    sha512: ${SHA512_B64}"
                      echo "    size: ${SIZE}"
                      echo "path: ${INSTALLER}"
                      echo "sha512: ${SHA512_B64}"
                      echo "releaseDate: '${RELEASE_DATE}'"
                  } > latest.yml
                  echo "--- latest.yml ---"
                  cat latest.yml

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: windows
                  path: |
                      nativephp/electron/dist/*.exe
                      nativephp/electron/dist/*.msi
                      nativephp/electron/dist/latest.yml
                  if-no-files-found: error

    build-linux:
        name: build (Linux)
        needs: gate
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci

            - name: Build Vite assets
              # See the macOS leg above — the manifest must exist on
              # this runner before `native:build` copies the app tree
              # into the bundle, or the shipped installer boots into
              # `ViteManifestNotFoundException`.
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Linux bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Emit auto-update manifest (latest-linux.yml)
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  cd nativephp/electron/dist
                  INSTALLER=$(find . -maxdepth 1 -name "*.AppImage" -print -quit)
                  INSTALLER=${INSTALLER#./}
                  if [ -z "$INSTALLER" ]; then
                      echo "No .AppImage found in nativephp/electron/dist/"
                      exit 1
                  fi
                  SHA512_B64=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 | tr -d '\n')
                  SIZE=$(wc -c < "$INSTALLER" | tr -d ' ')
                  VERSION="${TAG_REF#v}"
                  RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  {
                      echo "version: ${VERSION}"
                      echo "files:"
                      echo "  - url: ${INSTALLER}"
                      echo "    sha512: ${SHA512_B64}"
                      echo "    size: ${SIZE}"
                      echo "path: ${INSTALLER}"
                      echo "sha512: ${SHA512_B64}"
                      echo "releaseDate: '${RELEASE_DATE}'"
                  } > latest-linux.yml
                  echo "--- latest-linux.yml ---"
                  cat latest-linux.yml

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: linux
                  path: |
                      nativephp/electron/dist/*.AppImage
                      nativephp/electron/dist/*.deb
                      nativephp/electron/dist/latest-linux.yml
                  if-no-files-found: error

    publish:
        name: publish
        needs: [build-macos, build-windows, build-linux]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  # git-cliff walks the tag history to build the release
                  # notes; a shallow clone would leave it with one commit.
                  fetch-depth: 0

            - name: Set up PHP (libsodium for manifest signing)
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sodium
                  coverage: none
                  tools: composer:v2

            - name: Download every platform's artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  path: artifacts

            - name: Sign latest.yml with Ed25519
              env:
                  ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  # Locate every publisher manifest electron-updater
                  # produced. `actions/download-artifact` flattens each
                  # platform under `artifacts/<name>/`, so the find pass
                  # picks up `latest.yml` / `latest-mac.yml` /
                  # `latest-linux.yml` regardless of where they landed.
                  # The matching `latest.yml.sig` / `latest-mac.yml.sig`
                  # / `latest-linux.yml.sig` siblings are written in
                  # place next to each manifest.
                  mapfile -t MANIFESTS < <(find artifacts -name 'latest*.yml' -type f)
                  if [ "${#MANIFESTS[@]}" -eq 0 ]; then
                      echo "No publisher manifests found under artifacts/ — nothing to sign."
                      exit 1
                  fi
                  for manifest in "${MANIFESTS[@]}"; do
                      echo "Signing ${manifest}"
                      # shellcheck disable=SC2016  # inline PHP: $body is a PHP variable, not a shell one
                      php -r '
                          $body = file_get_contents($argv[1]);
                          if ($body === false) { fwrite(STDERR, "could not read " . $argv[1]); exit(1); }
                          $secret = sodium_hex2bin(getenv("ED25519_PRIVATE_KEY"));
                          $sig = sodium_crypto_sign_detached($body, $secret);
                          file_put_contents($argv[1] . ".sig", bin2hex($sig));
                      ' -- "$manifest"
                  done

            - name: Generate release notes (git-cliff)
              id: cliff
              uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
              with:
                  config: cliff.toml
                  args: --latest --strip header

            # A release body over the API's limit is rejected outright, and
            # a major version spanning hundreds of commits gets there. Trim
            # to the last whole entry that fits and point at the full log.
            - name: Fit the release notes to the API limit
              id: notes
              env:
                  NOTES: ${{ steps.cliff.outputs.content }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  limit=124000
                  printf '%s' "$NOTES" > notes.md
                  if [ "$(wc -c < notes.md)" -gt "$limit" ]; then
                      head -c "$limit" notes.md | sed '$d' > notes.trimmed
                      printf '\n\n_Trimmed to fit. The complete log for %s is on the [commit history](%s/commits/%s)._\n' \
                          "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$TAG" >> notes.trimmed
                      mv notes.trimmed notes.md
                      echo "Release notes trimmed to $limit bytes." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Publish the GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
              with:
                  tag_name: ${{ github.ref_name }}
                  body_path: notes.md
                  # The repo has "immutable releases" enabled, which
                  # rejects asset uploads after a Release transitions
                  # to published. softprops uploads its asset list
                  # AFTER the Release is created, so a non-draft
                  # create fails immediately. Always create as draft
                  # here, then the next step flips prerelease tags
                  # (anything with a `-` suffix) to a published
                  # prerelease via `gh release edit`. Stable tags
                  # stay as draft so a human can review + publish.
                  draft: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  # Every platform artifact PLUS the Ed25519 detached
                  # signature for each publisher manifest. Installed
                  # bundles fetch the matching `.sig` alongside the
                  # manifest and verify before any download proceeds.
                  files: |
                      artifacts/**/*
                      artifacts/**/latest*.yml.sig

            - name: Flip prerelease draft to published
              if: contains(github.ref_name, '-')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  # Convert the draft Release softprops just created
                  # into a published prerelease. Assets land while the
                  # Release is still a draft (which immutable-releases
                  # allows); publishing here only flips the visibility
                  # bit, no asset upload happens.
                  gh release edit "${{ github.ref_name }}" \
                      --repo "${{ github.repository }}" \
                      --draft=false

    verify-published:
        name: verify published
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP (libsodium for manifest verification)
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sodium
                  coverage: none
                  tools: composer:v2

            - name: Download published manifests + signatures
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  mkdir -p verify
                  gh release download "${{ github.ref_name }}" \
                      --dir verify \
                      --pattern 'latest*.yml' \
                      --pattern 'latest*.yml.sig'

            - name: Re-verify every published manifest with sodium_crypto_sign_verify_detached
              run: |
                  set -euo pipefail
                  # Read the publisher public hex from the committed
                  # config file — the source of truth installed bundles
                  # verify against. A simple grep avoids booting the
                  # framework just to read one config value.
                  PUBLIC_HEX=$(grep -oE "'[0-9a-f]{64}'" config/auto_update.php | head -1 | tr -d "'")
                  if [ -z "$PUBLIC_HEX" ]; then
                      echo "Could not extract publisher_public_key_hex from config/auto_update.php"
                      exit 1
                  fi
                  mapfile -t MANIFESTS < <(find verify -name 'latest*.yml' -not -name '*.sig' -type f)
                  if [ "${#MANIFESTS[@]}" -eq 0 ]; then
                      echo "No published manifests downloaded — verification cannot run."
                      exit 1
                  fi
                  for manifest in "${MANIFESTS[@]}"; do
                      sig_file="${manifest}.sig"
                      if [ ! -f "$sig_file" ]; then
                          echo "Missing signature for ${manifest}"
                          exit 1
                      fi
                      echo "Verifying ${manifest}"
                      # shellcheck disable=SC2016  # inline PHP: $body is a PHP variable, not a shell one
                      PUBLIC_HEX="$PUBLIC_HEX" php -r '
                          $body = file_get_contents($argv[1]);
                          $sigHex = trim((string) file_get_contents($argv[1] . ".sig"));
                          $public = sodium_hex2bin(getenv("PUBLIC_HEX"));
                          $sig = sodium_hex2bin($sigHex);
                          exit(sodium_crypto_sign_verify_detached($sig, $body, $public) ? 0 : 1);
                      ' -- "$manifest"
                  done
                  echo "Every published manifest verifies cleanly against the embedded publisher public key."
