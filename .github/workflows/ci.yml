# Diederik PR gate — quality-check workflow.
#
# Runs Laravel Pint (--test), Larastan level 10 strict, and the full Pest
# suite on every pull request and on every push to `main`. A single PHP
# axis runs the gates:
#
#   - 8.5 — the project runtime floor (the `php` constraint in composer.json)
#           and the minor that runs in the shipped desktop build: the release
#           workflow runs `native:build` on 8.5 and `nativephp/php-bin` 1.2.0
#           bundles the matching 8.5 binary. The gates and the shipped bundle
#           therefore target the same runtime the end user runs.
#
# `fail-fast: false` is retained so that if the matrix is ever widened again
# every axis reports independently rather than being hidden by the first to
# finish.
#
# Every third-party action is pinned to a full 40-char commit SHA with
# the human-readable tag retained as an inline comment for legibility.
# Tag-only references are a supply-chain risk: mutable tags can be
# repointed at malicious commits without the workflow file changing.

name: ci

on:
    pull_request:
    push:
        branches:
            - main

# One run per ref, not one per push. Without this a branch that is pushed four
# times keeps four full sets of shards queued, and the runners spend their time
# on commits nobody will merge -- measured at 107 queued runs against 8
# executing, 44 of them superseded. A push to main is exempt: every commit that
# lands is checked on its own, because that run is the only thing standing
# behind a merge that has already happened.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
    contents: read

jobs:
    # Sharded across runners, and each shard runs its share in parallel across
    # that runner's cores. The two multiply. `quality (PHP 8.5)` below is the
    # branch ruleset's required check and stays a single stable name, so the
    # shard count can change without touching branch protection.
    quality-shard:
        name: quality shard ${{ matrix.shard }} (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                php: ['8.5']
                shard: [1, 2, 3]
        env:
            # The app is timezone-pinned to Europe/Amsterdam across every
            # module (recurring detection, drift alerts, forecasting all
            # assume it); the CI runner must match so date-bucketing
            # behaviour is identical to the developer machine.
            TZ: Europe/Amsterdam
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Install poppler-utils (pdftotext) and avahi-utils (mDNS)
              # The receipt-extraction pipeline shells out to `pdftotext`
              # from poppler-utils. The GitHub-hosted `ubuntu-latest`
              # image does not ship the package; install it explicitly
              # so PDF-fingerprint tests do not throw PdfExtractionFailed.
              #
              # avahi-utils is here for a sharper version of the same reason.
              # The mDNS advertiser looks for `dns-sd` or for
              # `avahi-publish-service`, and the runner had neither — so the
              # one test that proves the advertiser cannot wedge a worker at
              # shutdown skipped in every job, counted in the totals and run
              # in none of them. The binary is enough; no daemon is needed.
              run: |
                  set -euo pipefail
                  # apt hangs on a bad mirror often enough to have cost a day of CI: the
                  # job sits here until its own timeout and reports as CANCELLED with no
                  # output, which reads as an externally killed run rather than a stalled
                  # download. Bounded and retried, a stall costs a minute, not the job.
                  for attempt in 1 2 3; do
                      if sudo timeout 120 apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                          && sudo timeout 180 apt-get install -y --no-install-recommends \
                              -o Acquire::Retries=3 -o Acquire::http::Timeout=20 poppler-utils avahi-utils; then
                          exit 0
                      fi
                      echo "::warning::apt attempt ${attempt} stalled or failed; retrying."
                      sleep 5
                  done
                  echo "::error::poppler-utils and avahi-utils could not be installed after three attempts."
                  exit 1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  # Extensions the framework + project use. `ext-imap` is
                  # deliberately omitted — the project hard-conflicts with
                  # any IMAP package that requires it (composer.json
                  # `conflict` block) since PHP unbundled it in 8.4.
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            # vendor/ itself, not just the download cache. Restoring the
            # archives still leaves composer to unpack and link ~34s of them on
            # every job, and there are now seven jobs per run.
            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: |
                      ~/.composer/cache
                      vendor
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-${{ matrix.php }}-

            # Still runs on a cache hit: it is near-instant when vendor/ already
            # matches the lock file, and it is what fires package:discover to
            # write bootstrap/cache. Skipping it would save seconds and cost a
            # missing package manifest.
            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # Many Blade views call `@vite([...])` which resolves URLs
              # via `public/build/manifest.json`. Feature tests render
              # those views, so the manifest must exist before Pest runs
              # or rendering throws a ViewException.
              run: npm run build

            - name: Prepare environment for Larastan + Pest
              # Larastan boots the Laravel app to provide smarter static
              # analysis (it reads service-container bindings + config).
              # The boot path runs `PRAGMA journal_mode = WAL` against
              # the configured SQLite connection, so an empty SQLite
              # file at `database/database.sqlite` must exist or the
              # boot fails with `Database file ... does not exist`. The
              # CI runner has no DB; we create an empty file here.
              # `.env.example` provides the rest of the required env;
              # `APP_KEY` is generated fresh per run.
              #
              # The EmlBlobStore writes temp files under
              # `storage/app/inbox` and chmods them; the framework also
              # needs `storage/framework/{cache,sessions,views}` and
              # `bootstrap/cache` to be writable. The tree is created
              # explicitly so a fresh CI checkout does not fail with
              # `failed to chmod temp file` or framework cache errors.
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi
                  mkdir -p database
                  touch database/database.sqlite
                  mkdir -p storage/app/inbox storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  chmod -R u+rwX storage bootstrap/cache

            - name: Resolve this shard's testsuites
              id: shard
              # `set -e` and the emptiness check are both load-bearing, and the
              # second is the one that matters. Without them a resolver that
              # exits non-zero leaves `suites` empty, the step still ends on a
              # successful echo, and the run below becomes
              # `--parallel --testsuite=""` — which does not fail. It reports
              # "6 passed" and exits 0, those six being the tests/Helpers files
              # paratest collects whatever `--testsuite` asks for. The serial
              # form exits 1 on the same input; only the parallel one CI uses is
              # silent. A shard would have gone green having tested nothing.
              run: |
                  set -euo pipefail
                  suites=$(python3 .github/scripts/shard-testsuites.py --shard "${{ matrix.shard }}" --of 3)
                  if [ -z "$suites" ]; then
                      echo "::error::the shard resolver named no testsuite, and a run with none passes."
                      exit 1
                  fi
                  echo "suites=$suites" >> "$GITHUB_OUTPUT"
                  echo "shard ${{ matrix.shard }}/3: $suites"

            - name: Pest (sharded)
              # Ran serially, whole, because EmailScan's inbox tree and DevMode's
              # subprocess files raced when paratest split them across workers.
              # Those paths are no longer shared: the inbox resolves through
              # storage_path(), and tests/TestCase.php now points the storage
              # root at a per-test temp directory, so two workers cannot land on
              # one path. DevMode's files come from tempnam(), unique by
              # construction. The isolation went in for an unrelated keyring bug
              # and closed this as a side effect; three consecutive full parallel
              # runs then reported identical counts.
              # Full suite: 773s serial, 358s parallel, before sharding.
              env:
                  APP_ENV: testing
                  # Reaches the paratest WORKERS, which is where the time goes —
                  # a -d flag would only configure the parent. Enables opcache
                  # for the CLI and turns pcov off; this step never collects
                  # coverage, and the coverage workflow sets neither.
                  PHP_INI_SCAN_DIR: ':tools/test-php-ini'
              run: php artisan test --parallel --testsuite="${{ steps.shard.outputs.suites }}" --log-junit=junit.xml

            - name: Keep this shard's JUnit report
              # Checked in the `quality` job below rather than here. A shard
              # collects only its own testsuites, so no single one can tell a
              # file that ran elsewhere from a file that ran nowhere — which is
              # the whole question. The three reports have to meet first.
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: junit-shard-${{ matrix.shard }}
                  path: junit.xml
                  if-no-files-found: error
                  retention-days: 1

    # Pint and Larastan read the whole tree and do not care about the tests, so
    # they ran on shard 1 to avoid being repeated three times. That made the
    # largest shard the critical path: 4.6 minutes against 2.5 for the others,
    # the difference being these two. Run alongside the shards instead, they
    # cost nothing on the clock. Neither needs Node, Vite or poppler.
    static-analysis:
        name: static analysis (PHP 8.5)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            TZ: Europe/Amsterdam
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: |
                      ~/.composer/cache
                      vendor
                  key: composer-${{ runner.os }}-8.5-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-8.5-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            # Both tools re-check every file from cold and skip the unchanged
            # ones from warm: Pint 175s to 4s, PHPStan 125s to 3s. The key
            # carries the commit sha so each run writes a fresh entry, and the
            # restore-keys fall back to the newest compatible one — a cache
            # keyed only on the lock file would be written once and never
            # updated again.
            - name: Cache Pint results
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: .pint.cache
                  key: pint-${{ runner.os }}-${{ hashFiles('pint.json', '**/composer.lock') }}-${{ github.sha }}
                  restore-keys: |
                      pint-${{ runner.os }}-${{ hashFiles('pint.json', '**/composer.lock') }}-
                      pint-${{ runner.os }}-

            - name: Cache PHPStan result cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: .phpstan-cache
                  key: phpstan-${{ runner.os }}-8.5-${{ hashFiles('**/composer.lock', 'phpstan.neon') }}-${{ github.sha }}
                  restore-keys: |
                      phpstan-${{ runner.os }}-8.5-${{ hashFiles('**/composer.lock', 'phpstan.neon') }}-
                      phpstan-${{ runner.os }}-8.5-

            - name: Pint (code-style)
              run: vendor/bin/pint --test --cache-file=.pint.cache

            - name: Larastan level 10 strict
              # The default 128M memory limit crashes Larastan on this
              # project — `composer analyse` already pins 1G locally; the
              # CI step pins the same limit explicitly.
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Declared dependencies cover every import
              # An import satisfied only by a dependency-of-a-dependency
              # compiles until that middle package drops it, and then the
              # break arrives on an unrelated `composer update`.
              run: composer analyse:deps

    # The name the branch ruleset requires. Sharding turned one check into
    # three, and a required check has to be one name that means "the suite
    # passed" — so the shards report under their own names and this collapses
    # them, along with the static analysis that used to sit inside them.
    # `always()` is what makes it a gate rather than a formality: without it a
    # failed shard skips this job, and a skipped required check is not a failed
    # one, so the pull request would look mergeable.
    quality:
        name: quality (PHP 8.5)
        needs: [quality-shard, static-analysis]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Collapse the shard results
              env:
                  SHARDS: ${{ needs.quality-shard.result }}
                  STATIC: ${{ needs.static-analysis.result }}
              run: |
                  echo "shards: $SHARDS   static analysis: $STATIC"
                  [ "$SHARDS" = success ] && [ "$STATIC" = success ] || exit 1

            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: Collect the shards' JUnit reports
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  pattern: junit-shard-*
                  path: junit-reports

            - name: The skips the shards reported, against the pinned budget
              # A skipped test prints in the same colour as a passing one and is
              # counted with it, so a capability no job supplies reads in every
              # report as a guarantee that holds. The budget names, per file,
              # the job that actually runs what skipped — and has no value
              # meaning "nowhere", so a gate nothing can answer has to be fixed
              # rather than written down.
              #
              # All three reports at once, because a pinned file absent from one
              # shard is only a defect if it is absent from all of them.
              run: |
                  set -euo pipefail
                  find junit-reports -name junit.xml | sort
                  count=$(find junit-reports -name junit.xml | wc -l)
                  [ "$count" -eq 3 ] || { echo "::error::expected 3 JUnit reports, found $count"; exit 1; }
                  python3 .github/scripts/skip-budget.py --job "quality shard" --junit junit-reports/*/junit.xml

    # mobile-app quality gate (15-11-PLAN.md Task 2). The desktop `quality`
    # job above builds from the REPO ROOT; the mobile shell is a SEPARATE
    # Composer root at `mobile-app/` (its own vendor/, own nativephp/mobile
    # instead of nativephp/desktop — the two host packages hard-conflict,
    # 15-TOPOLOGY-SPIKE-FINDINGS.md) that shares the domain codebase via
    # symlinks (Modules/, app/, resources/, database/, routes/, public/,
    # tests/). This job proves the mobile shell BOOTS with the shared
    # modules correctly wired (Mobile enabled, Desktop excluded) and that
    # Mobile's own shared code passes — it does NOT attempt a full signed
    # native iOS/Android build (Xcode/Gradle + Apple signing stays a LOCAL
    # `native:run` step for dev/sideload delivery until app-store
    # publishing).
    mobile-quality:
        name: mobile-app quality (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                php: ['8.5']
        env:
            TZ: Europe/Amsterdam
            # `nativephp/mobile-biometrics`, `nativephp/mobile-background-tasks`,
            # and `nativephp/mobile-scanner` are PAID, PRIVATE packages served
            # from the `plugins.nativephp.com` Composer repository
            # (`mobile-app/composer.json` `repositories.nativephp-plugins`,
            # 15-03-SUMMARY.md). `composer install` below cannot resolve them
            # without http-basic credentials. Two repository secrets supply
            # them — NATIVEPHP_LICENSE_EMAIL and NATIVEPHP_LICENSE_KEY — and
            # they are set. Composer reads the pair from the environment; no
            # project-local auth.json exists and none should ever be committed.
            COMPOSER_AUTH: >-
                {"http-basic":{"plugins.nativephp.com":{"username":"${{ secrets.NATIVEPHP_LICENSE_EMAIL }}","password":"${{ secrets.NATIVEPHP_LICENSE_KEY }}"}}}
        steps:
            - name: Check out the source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            # `~/.composer/cache` alone was the whole path list, and it does not
            # exist on the runner — composer keeps its downloads under the XDG
            # directory. actions/cache found nothing to archive and said so once,
            # as a warning, in the post-job block nobody reads:
            # "Path Validation Error: Path(s) specified in the action for caching
            # do(es) not exist, hence no cache is being saved." So the entry was
            # never written, and every run missed both the primary key and the
            # restore-key and installed from cold. vendor/ is what the repo-root
            # job caches, and that one has been hitting all along.
            - name: Cache Composer packages (mobile-app/ lock file)
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: mobile-app/vendor
                  key: composer-mobile-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('mobile-app/composer.lock') }}
                  restore-keys: |
                      composer-mobile-${{ runner.os }}-${{ matrix.php }}-

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Build Vite assets
              # mobile-app/public is a symlink to the repo-root public/, so the
              # manifest is built once at the root and both shells read it.
              # Without this every view render in the mobile suite returns 500
              # with ViteManifestNotFoundException — thirty tests, none of whose
              # messages mention Vite.
              run: npm ci --ignore-scripts && npm run build

            - name: Lay down the mobile environment
              # Before the install, not after. Composer's post-autoload-dump
              # hook runs `artisan package:discover`, which boots the framework
              # — and a boot with no .env and no writable framework directories
              # fails resolving `request`. A fresh clone has neither, because
              # mobile-app/.env is gitignored.
              #
              # Nothing here needs the framework, so it can run before Composer
              # has put one there.
              working-directory: mobile-app
              run: |
                  cp .env.example .env
                  mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  touch database/database.sqlite
                  chmod -R u+rwX storage bootstrap/cache

            - name: Install Composer dependencies (mobile-app/ root)
              # Credentials come from the job-level COMPOSER_AUTH above.
              working-directory: mobile-app
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Mint the mobile application key
              working-directory: mobile-app
              run: php artisan key:generate --ansi

            # DocsNameSymbolsThatExistArchTest reads BOTH Composer roots'
            # classmaps, because a class one root never loads is still a class
            # that exists and calling it absent would report every framework
            # mention on every page. It skips when either is missing — and no
            # job had both, so it skipped in 100% of runs while reporting green.
            # This is the only job with mobile-app/ installed, so the repo root
            # joins it here rather than the credentials going to three more
            # jobs. The key is the shard jobs', already warm.
            - name: Cache Composer packages (repo root)
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: |
                      ~/.composer/cache
                      vendor
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-${{ matrix.php }}-

            - name: Lay down the repo-root environment
              # Before the install, for the reason the mobile laydown gives: the
              # post-autoload-dump hook boots the framework, and a boot with no
              # .env and no writable framework directories fails resolving
              # `request`.
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  mkdir -p database storage/app/inbox storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  touch database/database.sqlite
                  chmod -R u+rwX storage bootstrap/cache
                  composer install --prefer-dist --no-interaction --no-progress
                  php artisan key:generate --ansi

            - name: The docs-symbol rule, which needs both Composer roots
              # Run from the repo root so base_path() resolves both classmaps.
              # A skip here is a failure: it would mean the rule once again ran
              # nowhere, which is the state this step exists to end. The check
              # that says so is the same one every other job runs, reading the
              # budget entry that points every other job HERE.
              env:
                  APP_ENV: testing
              run: |
                  set -euo pipefail
                  vendor/bin/pest tests/Contracts/DocsNameSymbolsThatExistArchTest.php --colors=never --log-junit=junit-docs-symbol.xml
                  python3 .github/scripts/skip-budget.py --job "docs-symbol (both roots)" --junit junit-docs-symbol.xml

            - name: Assert shared-module discovery (Mobile enabled, Desktop excluded)
              # The mobile shell must never silently pick up a
              # Desktop-coupled provider or route — `Modules\Desktop` has no
              # `module.json` (loaded only via bootstrap/providers.php) and
              # `mobile-app/bootstrap/providers.php` deliberately omits
              # DesktopServiceProvider.
              working-directory: mobile-app
              run: |
                  set -euo pipefail
                  php artisan config:clear
                  MODULE_LIST=$(php artisan module:list)
                  echo "$MODULE_LIST"
                  echo "$MODULE_LIST" | grep -q '\[Enabled\] Mobile' || { echo "::error::Mobile module is not enabled under mobile-app/"; exit 1; }
                  if echo "$MODULE_LIST" | grep -qi 'Desktop'; then
                      echo "::error::Desktop module leaked into the mobile-app/ shell"
                      exit 1
                  fi
                  # The route half of this check read `route:list --name=desktop`
                  # and grepped for a line beginning `  desktop`. No line of that
                  # table ever begins with a route name — the name sits in the
                  # right-hand column, behind the verb and the URI — so the
                  # pattern could not match a leak, and the step passed whatever
                  # the shell had registered. The JSON output names the field.
                  #
                  # The count is the positive control: an empty list would clear
                  # the leak assertion without proving anything, which is the
                  # shape the grep was already failing in.
                  ROUTES=$(php artisan route:list --json)
                  TOTAL=$(printf '%s' "$ROUTES" | jq 'length')
                  if [ "$TOTAL" -lt 1 ]; then
                      echo "::error::route:list returned no routes at all, so a leak check against it proves nothing."
                      exit 1
                  fi
                  echo "route:list returned ${TOTAL} routes; checking each for a desktop name or URI."
                  LEAKED=$(printf '%s' "$ROUTES" | jq -r '
                      .[] | select(((.name // "") | startswith("desktop")) or ((.uri // "") | startswith("desktop"))) | "\(.uri) -> \(.name // "unnamed")"')
                  if [ -n "$LEAKED" ]; then
                      echo "::error::Desktop routes leaked into the mobile-app/ shell"
                      echo "$LEAKED"
                      exit 1
                  fi

            - name: Mobile-scoped Pest pass (mobile-app root)
              # Scoped to the Mobile-owning testsuite ONLY (mobile-app/phpunit.xml)
              # — the desktop `quality` job above already runs the full suite
              # from the repo root; re-running it here would be redundant CI
              # cost against the SAME shared Modules/ tree. `--exclude-group=
              # repo-root-only` skips the handful of assertions that are only
              # true when running against the repo-root Composer tree (e.g. a
              # premium NativePHP plugin facade being genuinely ABSENT there) —
              # each excluded test documents why in its own file.
              working-directory: mobile-app
              env:
                  APP_ENV: testing
                  # Same settings as the sharded step, reached from the mobile
                  # root — `tools/` is one of the few directories NOT symlinked
                  # into this second Composer root, so the path steps out.
                  PHP_INI_SCAN_DIR: ':../tools/test-php-ini'
              run: vendor/bin/pest --testsuite=Mobile --exclude-group=repo-root-only --log-junit=junit-mobile.xml

            - name: The skips the mobile root reported, against the pinned budget
              # This root is where most of the tree's skips are pointed: a gate
              # on `nativephp/mobile` is correct in the shards and has to be
