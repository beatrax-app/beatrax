# Diederik PR gate — quality-check workflow.
#
# Runs Laravel Pint (--test), Larastan level 10 strict, and the full Pest
# suite on every pull request and on every push to `main`. Two PHP axes
# always run in parallel:
#
#   - 8.4 — the version `nativephp/php-bin` bundles inside the shipped
#           desktop build; the gates must be honest on that exact runtime.
#   - 8.5 — the developer's local dev box; keeps the project honest about
#           the newer runtime so divergence is caught at PR time.
#
# `fail-fast: false` is intentional — both axes always report, so a
# regression that only surfaces on one runtime is never hidden by the
# other finishing first.
#
# Every third-party action is pinned to a full 40-char commit SHA with
# the human-readable tag retained as an inline comment for legibility.
# Tag-only references are a supply-chain risk: mutable tags can be
# repointed at malicious commits without the workflow file changing.

name: ci

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: quality (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        env:
            # The app is timezone-pinned to Europe/Amsterdam across every
            # module (recurring detection, drift alerts, forecasting all
            # assume it); the CI runner must match so date-bucketing
            # behaviour is identical to the developer machine.
            TZ: Europe/Amsterdam
        steps:
            - name: Check out the source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

            - name: Install poppler-utils (pdftotext)
              # The receipt-extraction pipeline shells out to `pdftotext`
              # from poppler-utils. The GitHub-hosted `ubuntu-latest`
              # image does not ship the package; install it explicitly
              # so PDF-fingerprint tests do not throw PdfExtractionFailed.
              run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: ${{ matrix.php }}
                  # Extensions the framework + project use. `ext-imap` is
                  # deliberately omitted — the project hard-conflicts with
                  # any IMAP package that requires it (composer.json
                  # `conflict` block) since PHP 8.4 unbundled it.
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
              with:
                  path: ~/.composer/cache
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-${{ matrix.php }}-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Set up Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build Vite assets
              # Many Blade views call `@vite([...])` which resolves URLs
              # via `public/build/manifest.json`. Feature tests render
              # those views, so the manifest must exist before Pest runs
              # or rendering throws a ViewException.
              run: npm run build

            - name: Prepare environment for Larastan + Pest
              # Larastan boots the Laravel app to provide smarter static
              # analysis (it reads service-container bindings + config).
              # The boot path runs `PRAGMA journal_mode = WAL` against
              # the configured SQLite connection, so an empty SQLite
              # file at `database/database.sqlite` must exist or the
              # boot fails with `Database file ... does not exist`. The
              # CI runner has no DB; we create an empty file here.
              # `.env.example` provides the rest of the required env;
              # `APP_KEY` is generated fresh per run.
              #
              # The EmlBlobStore writes temp files under
              # `storage/app/inbox` and chmods them; the framework also
              # needs `storage/framework/{cache,sessions,views}` and
              # `bootstrap/cache` to be writable. The tree is created
              # explicitly so a fresh CI checkout does not fail with
              # `failed to chmod temp file` or framework cache errors.
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi
                  mkdir -p database
                  touch database/database.sqlite
                  mkdir -p storage/app/inbox storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  chmod -R u+rwX storage bootstrap/cache

            - name: Pint (code-style)
              run: vendor/bin/pint --test

            - name: Larastan level 10 strict
              # The default 128M memory limit crashes Larastan on this
              # project — `composer analyse` already pins 1G locally; the
              # CI step pins the same limit explicitly.
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Pest (full suite)
              # Runs serially. A handful of Integration tests in
              # Modules/EmailScan (the EmlBlobStore inbox tree) and
              # Modules/DevMode (subprocess stdout/err tmp files) race
              # on shared filesystem paths when paratest splits them
              # across workers, since neither path is namespaced by
              # TEST_TOKEN. Local dev iteration still uses --parallel
              # via `composer test`; CI trades ~3 min of wall-clock
              # for reliable, race-free signal.
              env:
                  APP_ENV: testing
              run: php artisan test
