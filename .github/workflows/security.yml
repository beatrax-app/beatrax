# Secret-scanning gate. Runs gitleaks against every pull request and
# every push to `main` so a commit that introduces a high-entropy
# token never reaches the protected branch.
#
# Every third-party action is pinned to a full 40-char commit SHA;
# tag-only references are a supply-chain risk because mutable tags
# can be repointed at malicious commits without the workflow file
# changing.

name: security

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks scan
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the source
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
              with:
                  # gitleaks scans the full git history so a leaked
                  # secret in an old commit is caught even when the
                  # current diff is clean.
                  fetch-depth: 0

            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
