# Manual build-only verification workflow. Runs the per-platform
# `native:build` matrix and uploads the produced installers as
# workflow artifacts. No smoke test, no publish, no Ed25519
# manifest signing, no GitHub Release is created or touched.
#
# Use cases:
#   - verify the desktop bundlers (macOS / Windows / Linux)
#     compile cleanly for an existing tag without committing to a
#     release
#   - regenerate the bundle artifacts for an existing tag and
#     pull them down from the workflow run's artifact tab to
#     inspect locally before deciding whether to publish
#   - iterate on a release-pipeline fix without burning the
#     publish + verify path on every attempt
#
# Trigger is `workflow_dispatch` only. GitHub gates manual dispatch
# on repository write permission, so the workflow inherits the same
# actor-protection as a tag push.
#
# Versioning stays tag-based: the input `tag` MUST be an existing
# tag on origin. Every job checks the source out at that tag and
# stamps the bundle's reported version (NATIVEPHP_APP_VERSION) from
# the tag (with the leading `v` stripped). The official "cut a
# release" path remains `git push origin vX.Y.Z` → release.yml.
#
# Every third-party action is SHA-pinned to the same commit as
# release.yml so the two workflows stay in lockstep on supply
# chain.

name: release-build

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to build and release (e.g. v0.1.0)'
                required: true
                type: string

permissions:
    contents: write

env:
    TZ: Europe/Amsterdam

jobs:
    build-macos:
        # x64 build skipped — see comment in release.yml. arm64
        # is the only prebuilt macOS arch the pipeline produces;
        # Intel users build locally from source.
        name: build (macOS, arm64)
        runs-on: macos-14
        timeout-minutes: 20
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # `public/build/manifest.json` is gitignored, so each
              # per-platform build runner must regenerate it before
              # `native:build` copies the app tree into the bundle —
              # otherwise the shipped installer boots into Laravel's
              # `ViteManifestNotFoundException` on the first request.
              run: npm run build

            - name: Stage the shipped .env
              uses: ./.github/actions/stage-shipped-env

            - name: Stage the NativePHP electron scaffold
              shell: bash
              run: |
                  set -euo pipefail
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the macOS bundle (arm64)
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
                  # Kept in lockstep with release.yml, which carries the same
                  # block and guard.
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  NATIVEPHP_MAC_IDENTITY: ${{ vars.NATIVEPHP_MAC_IDENTITY }}
                  NATIVEPHP_APPLE_ID: ${{ secrets.NATIVEPHP_APPLE_ID }}
                  NATIVEPHP_APPLE_ID_PASS: ${{ secrets.NATIVEPHP_APPLE_ID_PASS }}
                  NATIVEPHP_APPLE_TEAM_ID: ${{ vars.NATIVEPHP_APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  for required in CSC_LINK CSC_KEY_PASSWORD NATIVEPHP_MAC_IDENTITY NATIVEPHP_APPLE_ID NATIVEPHP_APPLE_ID_PASS NATIVEPHP_APPLE_TEAM_ID; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned macOS build."
                          exit 1
                      fi
                  done
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build mac arm64

            # The same check release.yml runs, in the same position, so a
            # bundle that would be rejected at release time is rejected here
            # first. The action resolves from the checked-out tag, so a tag
            # cut before this step existed cannot find it — rebuild from a
            # tag that contains it.
            - name: Resolve the bundle identifier the build was given
              id: app-identity
              run: |
                  set -euo pipefail
                  identifier=$(php artisan tinker --execute="echo config('nativephp.app_id');" 2>/dev/null | tail -n 1 | tr -d '[:space:]')
                  if [ -z "${identifier}" ]; then
                      echo "::error::could not resolve config('nativephp.app_id'); refusing to verify a bundle against an unknown identity."
                      exit 1
                  fi
                  echo "identifier=${identifier}" >> "$GITHUB_OUTPUT"

            - name: Verify the macOS bundle is genuinely signed
              uses: ./.github/actions/verify-signature
              with:
                  platform: macos
                  artifact-path: nativephp/electron/dist/*.dmg
                  expected-identifier: ${{ steps.app-identity.outputs.identifier }}

            - name: Upload macOS artifacts (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: macos-arm64
                  path: nativephp/electron/dist/*.dmg
                  if-no-files-found: error

    build-windows:
        name: build (Windows)
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              shell: bash
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # See the macOS leg above.
              shell: bash
              run: npm run build

            - name: Stage the shipped .env
              uses: ./.github/actions/stage-shipped-env

            - name: Stage the NativePHP electron scaffold
              shell: bash
              run: |
                  set -euo pipefail
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Windows bundle
              shell: bash
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
                  # Kept in lockstep with release.yml, which carries the same
                  # block and the same guard: electron-builder.mjs drops
                  # azureSignOptions when any NATIVEPHP_AZURE_* value is empty,
                  # so an absent secret ships an UNSIGNED installer from a
                  # green build.
                  NATIVEPHP_AZURE_ENDPOINT: ${{ vars.NATIVEPHP_AZURE_ENDPOINT }}
                  NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
                  NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME }}
                  NATIVEPHP_AZURE_PUBLISHER_NAME: ${{ vars.NATIVEPHP_AZURE_PUBLISHER_NAME }}
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
              run: |
                  set -euo pipefail
                  for required in NATIVEPHP_AZURE_ENDPOINT NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME NATIVEPHP_AZURE_PUBLISHER_NAME AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned Windows build."
                          exit 1
                      fi
                  done
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            # The same check release.yml runs, in the same position. The
            # guard above proves the six Azure values reached the build; only
            # the artifact proves electron-builder signed with them.
            - name: Verify the Windows installer is genuinely signed
              uses: ./.github/actions/verify-signature
              with:
                  platform: windows
                  artifact-path: nativephp/electron/dist/*.exe

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: windows
                  path: |
                      nativephp/electron/dist/*.exe
                      nativephp/electron/dist/*.msi
                  if-no-files-found: error

    build-linux:
        name: build (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # See the macOS leg above.
              run: npm run build

            - name: Stage the shipped .env
              uses: ./.github/actions/stage-shipped-env

            - name: Stage the NativePHP electron scaffold
              shell: bash
              run: |
                  set -euo pipefail
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Linux bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            # No signing guard and no artifact interrogation here, where the
            # macOS and Windows legs carry both, and that is deliberate rather
            # than missing: Linux has no OS-level signature a desktop verifies,
            # so there is nothing to guard for or to interrogate. Its integrity
            # signal is added at publish time by release.yml — the Ed25519-signed
            # `latest-linux.yml` over the AppImage, and the Ed25519-signed
            # checksum file over that and the `.deb`. This workflow publishes
            # nothing, so neither exists on this path.
            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: linux
                  path: |
                      nativephp/electron/dist/*.AppImage
                      nativephp/electron/dist/*.deb
                  if-no-files-found: error

    build-android:
        # The public, sideloadable APK. Bifrost builds the store-shaped
        # artifacts from its own credentials; this leg exists so a signed
        # download sits alongside the desktop ones on the Release page.
        name: build (Android)
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            # The nativephp/mobile-* plugins are a paid, private Composer
            # repository; the mobile root cannot install without these.
            COMPOSER_AUTH: >-
                {"http-basic":{"plugins.nativephp.com":{"username":"${{ secrets.NATIVEPHP_LICENSE_EMAIL }}","password":"${{ secrets.NATIVEPHP_LICENSE_KEY }}"}}}
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # public/build is served on-device, so the bundle needs it before
              # the Laravel tree is copied into the APK.
              run: npm run build

            - name: Stage the shipped .env
              uses: ./.github/actions/stage-shipped-env
              with:
                  working-directory: mobile-app

            - name: Lay down the rest of the mobile environment
              working-directory: mobile-app
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
                  touch database/database.sqlite
                  chmod -R u+rwX storage bootstrap/cache

            - name: Install Composer dependencies (mobile-app/ root)
              working-directory: mobile-app
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Mint the mobile application key
              working-directory: mobile-app
              run: php artisan key:generate --ansi

            - name: Restore the release keystore
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 is empty — refusing to publish an unsigned Android build."
                      exit 1
                  fi
                  mkdir -p mobile-app/credentials
                  printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile-app/credentials/app-release-key.jks
                  chmod 600 mobile-app/credentials/app-release-key.jks

            - name: Build and sign the APK
              working-directory: mobile-app
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
                  # Read from the environment rather than passed as --flags:
                  # command-line arguments are visible in the process list.
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  for required in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned Android build."
                          exit 1
                      fi
                  done
                  export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/mobile-app/credentials/app-release-key.jks"
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  # mobile:package-android, never native:package directly and
                  # never native:run --build=release. native:package returns
                  # success whatever goes wrong — including with no Android
                  # project to build, which is the state a `composer install`
                  # checkout is in. The wrapper generates the project, applies
                  # the shell patches and fails unless an artifact exists.
                  php artisan mobile:package-android --build-type=release --no-interaction

            - name: Verify the APK is signed by the release key
              env:
                  EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
              run: |
                  set -euo pipefail
                  # Scoped to Gradle's release output rather than the whole
                  # mobile root, so an intermediate or stale APK elsewhere in
                  # the tree cannot stand in for the one just built.
                  apk=$(find mobile-app/nativephp/android/app/build/outputs/apk/release \
                      -name '*.apk' -not -name '*unsigned*' -print -quit 2>/dev/null || true)
                  if [ -z "$apk" ]; then
                      echo "::error::no signed APK was produced."
                      exit 1
                  fi
                  echo "verifying $apk"

                  apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -print -quit)
                  if [ -z "$apksigner" ]; then
                      echo "::error::apksigner not found — cannot verify the signature."
                      exit 1
                  fi

                  "$apksigner" verify --verbose "$apk"

                  # apksigner verify passes on a DEBUG-signed APK too, so the
                  # signer identity is the check that matters.
                  actual=$("$apksigner" verify --print-certs "$apk" \
                      | grep -i 'SHA-256 digest:' | head -1 \
                      | sed 's/.*digest: *//' | tr -d ' :' | tr '[:lower:]' '[:upper:]')
                  expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')

                  if [ -z "$expected" ]; then
                      echo "::error::ANDROID_SIGNING_CERT_SHA256 is not set — cannot prove which key signed this."
                      exit 1
                  fi
                  if [ "$actual" != "$expected" ]; then
                      echo "::error::APK is signed by an unexpected key."
                      exit 1
                  fi
                  echo "signed by the expected release key"
                  echo "APK_PATH=$apk" >> "$GITHUB_ENV"

            - name: Build and sign the store bundle
              working-directory: mobile-app
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/mobile-app/credentials/app-release-key.jks"
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  # Play takes an AAB and refuses an APK, so the sideloadable
                  # artifact above is not a submission — it is the direct
                  # download, and both ship. Same command and the same identity
                  # checks against the shipped artifact, over the project the
                  # APK run already generated and patched.
                  php artisan mobile:package-android --build-type=bundle --no-interaction

            - name: Verify the store bundle is signed by the release key
              env:
                  EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
              run: |
                  set -euo pipefail
                  aab=mobile-app/nativephp/android/app/build/outputs/bundle/release/app-release.aab
                  if [ ! -s "$aab" ]; then
                      echo "::error::no signed AAB was produced."
                      exit 1
                  fi

                  # apksigner cannot read an AAB: it is a JAR-signed archive,
                  # so the certificate comes out of keytool instead. What
                  # keytool prints is the SHA-256 of the same DER certificate
                  # apksigner digests for the APK, so one recorded value
                  # answers for both artifacts.
                  actual=$(keytool -printcert -jarfile "$aab" \
                      | grep -i 'SHA256:' | head -1 \
                      | sed 's/.*SHA256: *//' | tr -d ' :' | tr '[:lower:]' '[:upper:]')
                  expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')

                  if [ -z "$expected" ]; then
                      echo "::error::ANDROID_SIGNING_CERT_SHA256 is not set — cannot prove which key signed this."
                      exit 1
                  fi
                  # An unsigned AAB prints no certificate at all, which an
                  # equality check alone would read as a mismatch rather than
                  # as the worse thing it is.
                  if [ -z "$actual" ]; then
                      echo "::error::the AAB carries no certificate — it is unsigned."
                      exit 1
                  fi
                  if [ "$actual" != "$expected" ]; then
                      echo "::error::AAB is signed by an unexpected key."
                      exit 1
                  fi
                  echo "store bundle signed by the expected release key"
                  echo "AAB_PATH=$aab" >> "$GITHUB_ENV"

            - name: Upload Android artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: android
                  # Both shapes: the APK is the direct download and the AAB is
                  # what Play takes. Neither stands in for the other.
                  path: |
                      ${{ env.APK_PATH }}
                      ${{ env.AAB_PATH }}
                  if-no-files-found: error
