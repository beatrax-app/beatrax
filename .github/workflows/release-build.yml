# Manual escape hatch for cutting a release without re-running the
# Pint / Larastan / Pest quality gate that release.yml runs first.
#
# Use this when the gate has already passed somewhere else (e.g. the
# tag's commit landed via main where ci.yml is green) and you want
# to ship a new bundle for an existing tag — typically because an
# earlier release.yml run failed at the build / publish step and
# you don't want to wait another five minutes per gate matrix axis.
#
# Trigger is `workflow_dispatch` only — there is no auto-trigger.
# GitHub gates manual dispatch on repository write permission, so
# the workflow inherits the same actor-protection as a tag push
# (only collaborators can fire it).
#
# Versioning stays tag-based: the input `tag` MUST be an existing
# annotated or lightweight tag on origin. Every job checks the
# source out at that tag, and the publish step attaches the built
# artifacts to a GitHub Release whose name is exactly that tag.
# Stable tags (`v*.*.*`) produce a draft release that a human
# explicitly publishes; `-rc` tags publish immediately as a
# prerelease — the same policy release.yml enforces.
#
# Every third-party action is SHA-pinned to the same commit as
# release.yml so the two workflows stay in lockstep on supply
# chain.

name: release-build

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to build and release (e.g. v0.1.0)'
                required: true
                type: string

permissions:
    contents: write

env:
    TZ: Europe/Amsterdam

jobs:
    build-macos:
        name: build (macOS)
        runs-on: macos-14
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the macOS bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Smoke test the macOS bundle
              env:
                  TAG_REF: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  VERSION="${TAG_REF#v}"
                  DMG=$(find dist -name '*.dmg' -print -quit)
                  if [ -z "$DMG" ]; then
                      echo "No .dmg artifact found under dist/"
                      exit 1
                  fi
                  hdiutil attach -mountpoint /tmp/dmg-mount "$DMG"
                  cp -R /tmp/dmg-mount/beatrax.app /Applications/
                  hdiutil detach /tmp/dmg-mount
                  xattr -d com.apple.quarantine /Applications/beatrax.app || true
                  open -a beatrax
                  sleep 10
                  RESPONSE=$(curl -fsS http://127.0.0.1:8000/health)
                  echo "$RESPONSE"
                  echo "$RESPONSE" | jq -e --arg v "$VERSION" '.status == "ok" and .app_version == $v'

            - name: Upload macOS artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: macos
                  path: dist/*.dmg
                  if-no-files-found: error

    build-windows:
        name: build (Windows)
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              shell: bash
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix

            - name: Install npm dependencies
              run: npm ci

            - name: Stage NativePHP electron scaffold + app .env
              shell: bash
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Windows bundle
              shell: bash
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Smoke test the Windows bundle
              shell: bash
              env:
                  TAG_REF: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  VERSION="${TAG_REF#v}"
                  INSTALLER=$(find dist -name '*.exe' -print -quit)
                  if [ -z "$INSTALLER" ]; then
                      echo "No .exe installer found under dist/"
                      exit 1
                  fi
                  start //wait "" "$INSTALLER" //S
                  start "" "C:\\Program Files\\beatrax\\beatrax.exe"
                  sleep 10
                  RESPONSE=$(curl -fsS http://127.0.0.1:8000/health)
                  echo "$RESPONSE"
                  echo "$RESPONSE" | jq -e --arg v "$VERSION" '.status == "ok" and .app_version == $v'

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: windows
                  path: |
                      dist/*.exe
                      dist/*.msi
                  if-no-files-found: error

    build-linux:
        name: build (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Linux bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Smoke test the Linux bundle
              env:
                  TAG_REF: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  VERSION="${TAG_REF#v}"
                  DEB=$(find dist -name '*.deb' -print -quit)
                  if [ -z "$DEB" ]; then
                      echo "No .deb installer found under dist/"
                      exit 1
                  fi
                  sudo dpkg -i "$DEB"
                  nohup beatrax > /tmp/beatrax.log 2>&1 &
                  sleep 10
                  RESPONSE=$(curl -fsS http://127.0.0.1:8000/health)
                  echo "$RESPONSE"
                  echo "$RESPONSE" | jq -e --arg v "$VERSION" '.status == "ok" and .app_version == $v'

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: linux
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                  if-no-files-found: error

    publish:
        name: publish
        needs: [build-macos, build-windows, build-linux]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP (libsodium for manifest signing)
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sodium
                  coverage: none
                  tools: composer:v2

            - name: Download every platform's artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  path: artifacts

            - name: Sign latest.yml with Ed25519
              env:
                  ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  mapfile -t MANIFESTS < <(find artifacts -name 'latest*.yml' -type f)
                  if [ "${#MANIFESTS[@]}" -eq 0 ]; then
                      echo "No publisher manifests found under artifacts/ — nothing to sign."
                      exit 1
                  fi
                  for manifest in "${MANIFESTS[@]}"; do
                      echo "Signing ${manifest}"
                      php -r '
                          $body = file_get_contents($argv[1]);
                          if ($body === false) { fwrite(STDERR, "could not read " . $argv[1]); exit(1); }
                          $secret = sodium_hex2bin(getenv("ED25519_PRIVATE_KEY"));
                          $sig = sodium_crypto_sign_detached($body, $secret);
                          file_put_contents($argv[1] . ".sig", bin2hex($sig));
                      ' -- "$manifest"
                  done

            - name: Publish the GitHub Release
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
              with:
                  tag_name: ${{ inputs.tag }}
                  draft: ${{ !contains(inputs.tag, '-rc') }}
                  prerelease: ${{ contains(inputs.tag, '-rc') }}
                  files: |
                      artifacts/**/*
                      artifacts/**/latest*.yml.sig

    verify-published:
        name: verify published
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP (libsodium for manifest verification)
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sodium
                  coverage: none
                  tools: composer:v2

            - name: Download published manifests + signatures
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_REF: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  mkdir -p verify
                  gh release download "$TAG_REF" \
                      --dir verify \
                      --pattern 'latest*.yml' \
                      --pattern 'latest*.yml.sig'

            - name: Re-verify every published manifest with sodium_crypto_sign_verify_detached
              run: |
                  set -euo pipefail
                  PUBLIC_HEX=$(grep -oE "'[0-9a-f]{64}'" config/auto_update.php | head -1 | tr -d "'")
                  if [ -z "$PUBLIC_HEX" ]; then
                      echo "Could not extract publisher_public_key_hex from config/auto_update.php"
                      exit 1
                  fi
                  mapfile -t MANIFESTS < <(find verify -name 'latest*.yml' -not -name '*.sig' -type f)
                  if [ "${#MANIFESTS[@]}" -eq 0 ]; then
                      echo "No published manifests downloaded — verification cannot run."
                      exit 1
                  fi
                  for manifest in "${MANIFESTS[@]}"; do
                      sig_file="${manifest}.sig"
                      if [ ! -f "$sig_file" ]; then
                          echo "Missing signature for ${manifest}"
                          exit 1
                      fi
                      echo "Verifying ${manifest}"
                      PUBLIC_HEX="$PUBLIC_HEX" php -r '
                          $body = file_get_contents($argv[1]);
                          $sigHex = trim((string) file_get_contents($argv[1] . ".sig"));
                          $public = sodium_hex2bin(getenv("PUBLIC_HEX"));
                          $sig = sodium_hex2bin($sigHex);
                          exit(sodium_crypto_sign_verify_detached($sig, $body, $public) ? 0 : 1);
                      ' -- "$manifest"
                  done
                  echo "Every published manifest verifies cleanly against the embedded publisher public key."
