# Manual build-only verification workflow. Runs the per-platform
# `native:build` matrix and uploads the produced installers as
# workflow artifacts. No smoke test, no publish, no Ed25519
# manifest signing, no GitHub Release is created or touched.
#
# Use cases:
#   - verify the desktop bundlers (macOS / Windows / Linux)
#     compile cleanly for an existing tag without committing to a
#     release
#   - regenerate the bundle artifacts for an existing tag and
#     pull them down from the workflow run's artifact tab to
#     inspect locally before deciding whether to publish
#   - iterate on a release-pipeline fix without burning the
#     publish + verify path on every attempt
#
# Trigger is `workflow_dispatch` only. GitHub gates manual dispatch
# on repository write permission, so the workflow inherits the same
# actor-protection as a tag push.
#
# Versioning stays tag-based: the input `tag` MUST be an existing
# tag on origin. Every job checks the source out at that tag and
# stamps the bundle's reported version (NATIVEPHP_APP_VERSION) from
# the tag (with the leading `v` stripped). The official "cut a
# release" path remains `git push origin vX.Y.Z` → release.yml.
#
# Every third-party action is SHA-pinned to the same commit as
# release.yml so the two workflows stay in lockstep on supply
# chain.

name: release-build

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to build and release (e.g. v0.1.0)'
                required: true
                type: string

permissions:
    contents: write

env:
    TZ: Europe/Amsterdam

jobs:
    build-macos:
        name: build (macOS)
        runs-on: macos-14
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the macOS bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Upload macOS artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: macos
                  path: dist/*.dmg
                  if-no-files-found: error

    build-windows:
        name: build (Windows)
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              shell: bash
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix

            - name: Install npm dependencies
              run: npm ci

            - name: Stage NativePHP electron scaffold + app .env
              shell: bash
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Windows bundle
              shell: bash
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: windows
                  path: |
                      dist/*.exe
                      dist/*.msi
                  if-no-files-found: error

    build-linux:
        name: build (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Linux bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: linux
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                  if-no-files-found: error
