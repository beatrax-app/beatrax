# Manual build-only verification workflow. Runs the per-platform
# `native:build` matrix and uploads the produced installers as
# workflow artifacts. No smoke test, no publish, no Ed25519
# manifest signing, no GitHub Release is created or touched.
#
# Use cases:
#   - verify the desktop bundlers (macOS / Windows / Linux)
#     compile cleanly for an existing tag without committing to a
#     release
#   - regenerate the bundle artifacts for an existing tag and
#     pull them down from the workflow run's artifact tab to
#     inspect locally before deciding whether to publish
#   - iterate on a release-pipeline fix without burning the
#     publish + verify path on every attempt
#
# Trigger is `workflow_dispatch` only. GitHub gates manual dispatch
# on repository write permission, so the workflow inherits the same
# actor-protection as a tag push.
#
# Versioning stays tag-based: the input `tag` MUST be an existing
# tag on origin. Every job checks the source out at that tag and
# stamps the bundle's reported version (NATIVEPHP_APP_VERSION) from
# the tag (with the leading `v` stripped). The official "cut a
# release" path remains `git push origin vX.Y.Z` → release.yml.
#
# Every third-party action is SHA-pinned to the same commit as
# release.yml so the two workflows stay in lockstep on supply
# chain.

name: release-build

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to build and release (e.g. v0.1.0)'
                required: true
                type: string

permissions:
    contents: write

env:
    TZ: Europe/Amsterdam

jobs:
    build-macos:
        # x64 build skipped — see comment in release.yml. arm64
        # is the only prebuilt macOS arch the pipeline produces;
        # Intel users build locally from source.
        name: build (macOS, arm64)
        runs-on: macos-14
        timeout-minutes: 20
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # `public/build/manifest.json` is gitignored, so each
              # per-platform build runner must regenerate it before
              # `native:build` copies the app tree into the bundle —
              # otherwise the shipped installer boots into Laravel's
              # `ViteManifestNotFoundException` on the first request.
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the macOS bundle (arm64)
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build mac arm64

            - name: Upload macOS artifacts (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: macos-arm64
                  path: nativephp/electron/dist/*.dmg
                  if-no-files-found: error

    build-windows:
        name: build (Windows)
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              shell: bash
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # See the macOS leg above.
              shell: bash
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              shell: bash
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Windows bundle
              shell: bash
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
                  # Kept in lockstep with release.yml, which carries the same
                  # block and the same guard: electron-builder.mjs drops
                  # azureSignOptions when any NATIVEPHP_AZURE_* value is empty,
                  # so an absent secret ships an UNSIGNED installer from a
                  # green build.
                  NATIVEPHP_AZURE_ENDPOINT: ${{ vars.NATIVEPHP_AZURE_ENDPOINT }}
                  NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
                  NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME }}
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
              run: |
                  set -euo pipefail
                  for required in NATIVEPHP_AZURE_ENDPOINT NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::${required} is empty — refusing to publish an unsigned Windows build."
                          exit 1
                      fi
                  done
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: windows
                  path: |
                      nativephp/electron/dist/*.exe
                      nativephp/electron/dist/*.msi
                  if-no-files-found: error

    build-linux:
        name: build (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  ref: ${{ inputs.tag }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, intl, xml, dom, fileinfo, tokenizer, json
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Build Vite assets
              # See the macOS leg above.
              run: npm run build

            - name: Stage NativePHP electron scaffold + app .env
              run: |
                  set -euo pipefail
                  cp .env.example .env
                  php artisan key:generate --ansi
                  php artisan native:install --publish --no-interaction --force

            - name: Build the Linux bundle
              env:
                  NATIVEPHP_APP_VERSION: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  export NATIVEPHP_APP_VERSION="${NATIVEPHP_APP_VERSION#v}"
                  php artisan native:build

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: linux
                  path: |
                      nativephp/electron/dist/*.AppImage
                      nativephp/electron/dist/*.deb
                  if-no-files-found: error
