# Calls the reusable workflows the spec repo defines once for the whole
# organisation. First-party reusables ride a moving
# major-version tag: a fix to a shared check reaches every consumer on its next
# run, and a breaking change cuts v2 so repositories migrate one at a time
# (ADR-0021). Third-party actions are still pinned to a full SHA (ADR-0012), and
# the `action pins` step in the shared hygiene workflow enforces both halves.
name: shared

on: [pull_request]

# One run per ref, not one per push. Without this a branch that is pushed four
# times keeps four sets of these ten checks queued, and the runners spend their
# time on commits nobody will merge. This workflow answers pull requests only,
# so there is no push to exempt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The governance gate: a citation is present and every cited identifier
  # resolves on the canonical spec.
  spec-check:
    uses: beatrax-app/spec/.github/workflows/spec-check.yml@v1

  hygiene:
    uses: beatrax-app/spec/.github/workflows/hygiene.yml@v1

  security:
    uses: beatrax-app/spec/.github/workflows/security.yml@v1

  dco:
    uses: beatrax-app/spec/.github/workflows/dco.yml@v1

  commitlint:
    uses: beatrax-app/spec/.github/workflows/commitlint.yml@v1

  # The sticky comment linking each cited identifier to its defining file.
  # Skipped for fork PRs, whose token cannot write a comment.
  spec-references:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: beatrax-app/spec/.github/workflows/spec-references.yml@v1

  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: beatrax-app/spec/.github/workflows/labeler.yml@v1
