sonar.projectKey=beatrax-app_beatrax
sonar.organization=beatrax

# The application, minus the second Composer root: mobile-app/ is symlinks onto
# the same Modules/ tree, so scanning it would double-count every file.
sonar.sources=app,Modules,config,routes,database
# database/schema/*.sql is Laravel's squashed schema dump. SonarCloud hands
# .sql files to the PL/SQL analyser, which cannot parse SQLite's dialect — it
# failed at line 259 and raised the "last analysis had a warning" banner, plus
# a second warning about an unconfigured PL/SQL data dictionary. The file is
# generated by `schema:dump` and reviewed as a migration artefact, not authored.
sonar.exclusions=**/vendor/**,**/node_modules/**,mobile-app/**,**/Database/Migrations/**,public/build/**,database/schema/**

sonar.tests=tests
sonar.test.inclusions=tests/**,Modules/*/tests/**
sonar.test.exclusions=**/fixtures/**

# Coverage is ingested from the clover report the coverage workflow produces.
# It only appears when analysis runs from CI — SonarCloud's automatic analysis
# does not accept an imported report, so the two are mutually exclusive.
#
# This is the single-report path a local `--coverage-clover=coverage.xml` writes.
# The coverage workflow shards the suite and overrides this on the command line
# with one path per shard, which Sonar unions.
sonar.php.coverage.reportPaths=coverage.xml

# These stay in sonar.sources so the analyser still reports issues in them, but
# they are not code a test covers: migrations are schema replayed by every test,
# and config/routes/database are declarations. Counting them would report a
# coverage figure about the shape of the framework rather than about the tests.
# phpunit.xml's <source> filter draws the same line for the clover report.
# Blade templates are excluded because their coverage cannot be measured, not
# because they are untested. A template compiles to PHP under
# storage/framework/views/ and pcov instruments the compiled file, so coverage
# never attributes back to the .blade.php source: every one of the 24658
# template lines reported exactly 0.0%, including files whose markup the suite
# asserts on directly. That artifact was 74% of all uncovered lines and pulled
# the reported figure from 83.6% down to 56.9%.
sonar.coverage.exclusions=config/**,routes/**,database/**,**/Database/Migrations/**,**/tests/**,**/*.blade.php

# The per-parser payment-type hinters are keyword tables, not logic. Since the
# scan itself moved to DescriptionKeywordHinter these classes hold a source
# format and a list of lexemes and nothing else, so what the copy-paste
# detector matches across them is the declaration boilerplate a data class
# cannot avoid — `protected const KEYWORDS = [` and the rows either side of it.
#
# The rows it matches are real overlap and are supposed to be there: ASN and
# MT940 are both Dutch bank exports and share ten lexemes verbatim. Keeping one
# table per format is the point. Merging them to satisfy the detector would
# couple two parsers' vocabularies, so a keyword added for one bank would
# silently start matching the other's rows — which is precisely the bug the
# per-format tables exist to prevent.
#
# Scoped to these files by name. Duplication anywhere else in Parsers/,
# including in the parsers themselves, still reports.
sonar.cpd.exclusions=Modules/Import/Internal/Parsers/**/*PaymentTypeHinter.php

sonar.sourceEncoding=UTF-8

# S7637 wants a full commit SHA on every `uses:`. ADR-0021 deliberately puts
# first-party reusable workflows on a moving major-version tag instead, so the
# rule reports thirteen findings that are the documented decision rather than a
# defect. Disabling it here would drop the third-party half of the rule too,
# which is the half that matters — so the `action pins` step in the shared
# hygiene workflow now enforces both halves precisely, and fails the build on a
# tag-referenced third-party action. Nothing is lost by silencing this rule; the
# check that replaced it is stricter about the case Sonar was right about.
# One criterion per file, and no brace alternation in any resourceKey: the
# matcher understands *, ** and ? only, so a `{a,b}` pattern matches nothing —
# silently. Two entries written that way reported as if they were not there at
# all, which is the failure mode to watch for: a criterion that matches no file
# produces no warning, only issues that keep appearing.
sonar.issue.ignore.multicriteria=adr21,ecbns,liglyph,lirow,rl1,rl2,rl3,rl4,rl5,rl6,rl7,labelname,immret,nativerole,deadpriv
sonar.issue.ignore.multicriteria.adr21.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.adr21.resourceKey=.github/workflows/*.yml

# S5332 reads the ECB vocabulary URI as an insecure endpoint. It is an XML
# namespace name, not an address: it is never dereferenced, it is compared
# byte-for-byte against the xmlns the ECB feed declares, and rewriting it to
# https would make registerXPathNamespace() match nothing — every rate fetch
# would parse to zero rates and fail silently. The document is retrieved over
# https (line 20 of the same file), which is the half the rule is right about.
sonar.issue.ignore.multicriteria.ecbns.ruleKey=php:S5332
sonar.issue.ignore.multicriteria.ecbns.resourceKey=Modules/FX/Internal/Providers/EcbRateProvider.php

# Both files are single-<li> partials; the <ul> that contains them lives in the
# view that includes them (welcome-step and forecast-page respectively). The
# analyser reads one file at a time, so it cannot see the container and reports
# a stray list item. The only change that would satisfy it is inlining the
# components back into their parents, which is the opposite of an improvement.
# Scoped to these two files so a genuinely stray <li> elsewhere still reports.
sonar.issue.ignore.multicriteria.liglyph.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.liglyph.resourceKey=Modules/Onboarding/Resources/views/components/vd-glyph.blade.php
sonar.issue.ignore.multicriteria.lirow.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.lirow.resourceKey=Modules/Forecasting/Resources/views/livewire/partials/series-confidence-row.blade.php

# S6822 calls `role="list"` on a <ul> redundant. It is not redundant here.
# Tailwind's preflight sets `list-style: none` on every ol/ul/menu
# (node_modules/tailwindcss/preflight.css:197), and WebKit drops list
# semantics from a list styled that way — VoiceOver stops announcing "list, N
# items" and stops offering list navigation. `role="list"` restores it, which
# is why it is the documented workaround rather than decoration. This matters
# more than usual for beatrax: the macOS bundle runs on WebKit, so that is the
# engine for a whole shipped platform, not one browser among several.
#
# Scoped to the eight files that carry the workaround. The redundant
# `section role="region"` and `aside role="complementary"` attributes have no
# such excuse and were removed instead — this rule still reports those.
sonar.issue.ignore.multicriteria.rl1.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl1.resourceKey=Modules/Anomaly/Resources/views/livewire/anomaly-settings-section.blade.php
sonar.issue.ignore.multicriteria.rl2.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl2.resourceKey=Modules/Tax/Resources/views/livewire/tax-settings-section.blade.php
sonar.issue.ignore.multicriteria.rl3.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl3.resourceKey=Modules/Community/Resources/views/livewire/mystery-merchants-page.blade.php
sonar.issue.ignore.multicriteria.rl4.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl4.resourceKey=Modules/Notifications/Resources/views/livewire/notifications-settings-section.blade.php
sonar.issue.ignore.multicriteria.rl5.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl5.resourceKey=Modules/Onboarding/Resources/views/livewire/steps/done-step.blade.php
sonar.issue.ignore.multicriteria.rl6.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl6.resourceKey=Modules/Onboarding/Resources/views/livewire/steps/welcome-step.blade.php
sonar.issue.ignore.multicriteria.rl7.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.rl7.resourceKey=Modules/Onboarding/Resources/views/livewire/steps/budgets-step.blade.php

# S7927 asks that a control's visible text be part of its accessible name,
# which is WCAG 2.5.3 and worth enforcing. The analyser reads the raw Blade
# template, so it cannot evaluate {{ }}: of the 32 findings left after the
# twelve real ones were fixed, 15 compared two template expressions that
# never match at analysis time, 6 were icon-only buttons with no visible
# text at all, and the rest were entity glyphs read as words.
#
# tests/Contracts/VisibleLabelInAccessibleNameArchTest.php enforces the rule
# instead, on the pairs that can actually be decided. It is stricter about
# the case S7927 was right about: it found two PIN pads showing "OK" while
# announcing "Confirm PIN" that S7927 never reported at all.
sonar.issue.ignore.multicriteria.labelname.ruleKey=Web:S7927
sonar.issue.ignore.multicriteria.labelname.resourceKey=Modules/**/*.blade.php

# S1488 wants a value returned rather than assigned and returned on the next
# line. Of its 48 findings, 46 sat under a /** @var */ annotation, because an
# annotation needs an assignment to attach to. Twelve turned out to be
# removable — Larastan infers Eloquent and transaction returns on its own —
# and were fixed. Inlining the other 36 replaces a Sonar finding with a
# PHPStan error: the expression is a Closure call typed mixed, or an array
# whose shape only the annotation supplies.
#
# The rule that already prevents the defect S1488 gestures at is
# `phpstan analyse` at level 10 in strict mode, which is blocking on every
# PR. It is the stricter of the two: it rejects an un-narrowed return
# outright, rather than commenting on where the value was parked first.
sonar.issue.ignore.multicriteria.immret.ruleKey=php:S1488
sonar.issue.ignore.multicriteria.immret.resourceKey=Modules/**/*.php

# S6819 asks for a native element instead of an ARIA role. It was right about
# one thing and it has been fixed: the calendar month view was a flat div grid
# with the week rows collapsed under `display: contents`, and it is a real
# <table> now. The other 57 findings name an element that does not fit.
# Alpine/Flux popovers are not <dialog> — they are not in the top layer and
# never call showModal(). A toolbar of filter chips is not <fieldset>, which
# groups form controls. A Livewire picker whose items dispatch wire:click is
# not <select>. A CSS-drawn status dot is not <img>. The suggested rewrites
# would each be a downgrade, and the alternatives the rule lists for
# role="group" (<address>, <details>, <optgroup>) say how little context it
# has to work with.
#
# tests/Contracts/AriaWidgetCompletenessArchTest.php enforces the thing that
# actually decides whether a roled widget works: whether it carries the state
# its native element would have supplied. A <progress> reports its value
# unasked; role="progressbar" without aria-valuenow announces nothing. It is
# stricter about the case S6819 exists for — it found two listboxes with no
# accessible name, in DriftAlerts and Recurring, that S6819 reported only as
# "use <select>" and would have kept reporting that way after a rewrite.
sonar.issue.ignore.multicriteria.nativerole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.nativerole.resourceKey=Modules/**/*.blade.php

# S1144 calls a private method unused. Its symbol resolution misses two
# references PHP counts and the code relies on, so it names live methods as
# dead. A first-class callable, `array_map(self::conditionFromDto(...), ...)`
# in RuleFormModal, is not linked to the method it names. A method declared on
# a Livewire component but called only from a trait the component uses —
# TransactionDetail::legCategoryId(), read from the ManagesSplitEditor concern
# — is invisible because the analyser reads one file at a time. Deleting either,
# which is the only fix the rule offers, breaks the caller.
#
# PHPStan's always-on unused-private-method rule is the stricter replacement and
# runs at level 10 on every PR. It resolves both references correctly — a
# first-class callable is a use, and a trait sees its host's members — while
# still failing the build on a private method that truly has no caller. Nothing
# S1144 would have caught is lost; the cases it gets wrong stop being reported.
sonar.issue.ignore.multicriteria.deadpriv.ruleKey=php:S1144
sonar.issue.ignore.multicriteria.deadpriv.resourceKey=Modules/**/*.php
